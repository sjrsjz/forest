manifest_version = 1
package_id = "example.deployment-probe"
version = "0.1.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_probe:DeploymentProbe"

[[components]]
id = "example.deployment-probe"
scope = "deployment"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "example.deployment-probe.workspace"
label = "部署插件示例"
group = "deployment"
order = 90

[[components.provides]]
name = "deployment.probe.echo"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/echo-input.json"
output_schema = "schemas/echo-output.json"

[[components.management_queries]]
id = "probe.echo"
port = "deployment.probe.echo"
timeout_s = 10
