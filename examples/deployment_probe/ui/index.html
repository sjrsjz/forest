<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    body{margin:0;padding:12px}form{display:flex;gap:8px;align-items:end}label{display:grid;gap:5px;flex:1}
    input,button{padding:8px;border:1px solid #365b49;border-radius:6px;background:#102019;color:inherit}
    button{cursor:pointer}output{display:block;margin-top:12px;min-height:20px;color:#a9d9c1}
  </style>
</head>
<body>
  <form id="probe"><label>输入<input name="value" required></label><button>查询插件</button></form>
  <output id="result">等待连接</output>
  <script>
    (()=>{'use strict';let port,nonce,pending=0;const form=document.getElementById('probe');
      const result=document.getElementById('result');
      const send=(type,data={})=>port?.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...data});
      form.onsubmit=event=>{event.preventDefault();const request_id=`probe-${++pending}`;
        result.textContent='正在查询…';send('query',{request_id,operation_id:'probe.echo',value:{value:form.elements.value.value}});};
      addEventListener('message',event=>{const message=event.data||{};
        if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;
        port=event.ports[0];nonce=message.nonce;port.onmessage=event=>{const value=event.data||{};
          if(value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;
          if(value.type==='initialize')send('resize',{height:document.documentElement.scrollHeight});
          if(value.type==='query-result')result.textContent=value.value.echo;
          if(value.type==='operation-error')result.textContent=value.message||'查询失败';};
        port.start();send('ready');},{once:true});
    })();
  </script>
</body>
</html>
