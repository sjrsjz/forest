manifest_version = 1
package_id = "forest.media-capture"
version = "2.2.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "media_capture:MediaCapture"

[[components]]
id = "media.capture"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
auto_install = true
configuration_apply = "worker-host/1"

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 64
max_state_inflight = 16
max_owned_tasks = 4
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 120
stop_timeout_s = 10

[components.capabilities]
requests = [
  "service.call:media.image.fetch",
  "service.call:memory.source.capture",
  "service.call:memory.source.unavailable",
  "service.call:conversation.media-cost.record",
  "domain.query:media.capture.current",
  "domain.query:media.assets.resolve",
  "domain.command:media.publish-image",
  "domain.command:media.fail-part",
]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
label = "媒体采集"
group = "runtime"
order = 15

[components.storage]
schema_id = "forest.media.capture"
schema_version = "2.1.0"
baseline = "schema/media_capture.sql"
baseline_sha256 = "139256e8995616b115130cffd4e2c0327984962f4ee14a40cf09f3c1f3936f2e"
scope = "bot"
repository_contract = "forest.media-capture.repository/2"
execution_profile = "official"

[[components.requires]]
name = "conversation.media-cost.record"
contract = ">=1.0,<2.0"
required = true
startup_dependency = false

[[components.requires]]
name = "memory.source.capture"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.requires]]
name = "memory.source.unavailable"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.provides]]
name = "media.context.resolve"
contract = "1.0"
semantics = "read"
input_schema = "schemas/context-resolve-input.json"
output_schema = "schemas/context-resolve-output.json"

[[components.effect_services]]
name = "media.image.fetch"
contract = "1.0"
kind = "media.public-image"
semantics = "idempotent"
input_schema = "schemas/image-fetch-input.json"
output_schema = "schemas/image-fetch-output.json"

[[components.domain_queries]]
name = "media.capture.current"
contract = "1.0"
function = "media_capture_current"
input_schema = "schemas/capture-current-input.json"
output_schema = "schemas/capture-work-input.json"

[[components.domain_queries]]
name = "media.assets.resolve"
contract = "1.0"
function = "media_assets_resolve"
input_schema = "schemas/context-resolve-input.json"
output_schema = "schemas/context-resolve-output.json"

[[components.domain_commands]]
name = "media.publish-image"
contract = "1.0"
function = "media_publish_image"
input_schema = "schemas/publish-image-input.json"
output_schema = "schemas/part-command-output.json"

[[components.domain_commands.payload_refs]]
path = "/payload"
owner_component = "media.capture"
owner_kind = "media.asset"
owner_id_path = "/media_ref"

[[components.domain_commands]]
name = "media.fail-part"
contract = "1.0"
function = "media_fail_part"
input_schema = "schemas/fail-part-input.json"
output_schema = "schemas/part-command-output.json"

[[components.unit_of_work_participants]]
name = "media.register-ingress"
contract = "1.0"
function = "media_register_ingress"
input_schema = "schemas/register-ingress-envelope.json"
output_schema = "schemas/register-ingress-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/capture/author"
owner_component = "adapter.onebot"
owner_kind = "onebot.author-snapshot"
owner_id_path = "/input/capture/author/owner_id"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/capture/text_parts/*/payload"
owner_component = "adapter.onebot"
owner_kind = "onebot.memory-text"
owner_id_path = "/input/capture/text_parts/*/payload/owner_id"

[[components.owned_work_handlers]]
name = "media.capture.pending"
contract = "1.0"
handler = "media.capture"
claim_function = "media_claim_work"
settle_function = "media_settle_work"
input_schema = "schemas/capture-work-input.json"
output_schema = "schemas/capture-work-output.json"
max_concurrency = 2
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 90
settle_timeout_s = 5
lease_seconds = 120
