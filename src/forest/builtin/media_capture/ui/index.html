<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    body{margin:0;padding:16px}form{display:grid;grid-template-columns:repeat(2,minmax(12rem,1fr));gap:14px}
    label{display:grid;gap:5px;color:#a9c1b2}input,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #395247;border-radius:8px;background:#13231b;color:inherit}button{grid-column:1/-1;background:#255844;cursor:pointer}
    p{grid-column:1/-1;margin:0;color:#8da497}@media(max-width:640px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <form id="config">
    <label>获取超时（秒）<input name="timeout_seconds" type="number" min="1" max="30" required></label>
    <label>最大连接数<input name="max_connections" type="number" min="1" max="16" required></label>
    <label>最大尝试次数<input name="max_attempts" type="number" min="1" max="10" required></label>
    <label>上下文等待（秒）<input name="context_wait_seconds" type="number" min="0" max="15" step="0.1" required></label>
    <button id="plan" type="button">校验并生成计划</button>
    <p>配置随 media.capture 包 Generation 一起预热、发布和排空。</p>
  </form>
  <script>
    (() => {
      'use strict';
      let port = null, nonce = null, draft = {};
      const form = document.getElementById('config');
      const send = (type, payload = {}) => port?.postMessage({protocol:'forest.management-ui-channel/1', nonce, type, ...payload});
      const render = values => {
        draft = structuredClone(values || {});
        for (const name of ['timeout_seconds','max_connections','max_attempts','context_wait_seconds']) form.elements[name].value = draft[name] ?? '';
      };
      addEventListener('message', event => {
        const message = event.data || {};
        if (event.source !== parent || !event.ports[0] || message.protocol !== 'forest.management-ui-connect/1' || message.type !== 'connect' || typeof message.nonce !== 'string') return;
        port = event.ports[0]; nonce = message.nonce;
        port.onmessage = event => { const update = event.data || {}; if (update.protocol !== 'forest.management-ui-channel/1' || update.nonce !== nonce) return; if(update.type==='initialize'){render(update.configuration.desired.value);send('resize',{height:document.documentElement.scrollHeight});}else if(update.type==='reset')render(update.value); };
        port.start(); send('ready');
      }, {once:true});
      form.addEventListener('input', () => {
        draft = {protocol:'forest.media.capture/1', timeout_seconds:Number(form.elements.timeout_seconds.value), max_connections:Number(form.elements.max_connections.value), max_attempts:Number(form.elements.max_attempts.value), context_wait_seconds:Number(form.elements.context_wait_seconds.value)};
        send('set-draft', {value:draft});
      });
      document.getElementById('plan').onclick = () => send('request-plan');
    })();
  </script>
</body>
</html>
