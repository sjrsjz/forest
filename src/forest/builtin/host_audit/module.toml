manifest_version = 1
package_id = "forest.host-audit"
version = "1.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "host_audit:HostAudit"

[[components]]
id = "host.audit"
scope = "host"
auto_install = true
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 1
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 30
stop_timeout_s = 10

[components.capabilities]
requests = ["domain.query:host.audit.page"]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "host.audit.workspace"
label = "Host 审计"
group = "host"
order = 50

[[components.provides]]
name = "host.audit.query"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[components.storage]
schema_id = "forest.host.audit"
schema_version = "1.0.0"
baseline = "schema/audit.sql"
baseline_sha256 = "ad894fb8ae6103634afe2d38041bbc6f167c07162661912ed5ea726a93a4e227"
scope = "host"
repository_contract = "forest.host-audit.repository/1"
execution_profile = "official"

[[components.domain_queries]]
name = "host.audit.page"
contract = "1.0"
function = "host_audit_page"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.management_queries]]
id = "audit.records.query"
port = "host.audit.query"
default_limit = 50
max_limit = 100
timeout_s = 10
audit = "SECURITY"
