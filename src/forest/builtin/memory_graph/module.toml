manifest_version = 1
package_id = "forest.memory-graph"
version = "1.5.3"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "memory_graph:MemoryGraph"

[[components]]
id = "memory.graph"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 128
max_state_inflight = 8
max_owned_tasks = 16
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 15
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 15

[components.capabilities]
requests = [
  "payload.read",
  "payload.write",
  "domain.query:memory.read-exact-sources",
  "domain.query:memory.list-trunks",
  "domain.query:memory.query-sources",
  "domain.query:memory.query-relations",
  "uow.execute:memory.capture-source",
  "uow.execute:memory.mark-source-unavailable"
]

[[components.provides]]
name = "memory.source.capture"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/capture-service-input.json"
output_schema = "schemas/capture-output.json"

[[components.provides]]
name = "memory.source.unavailable"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/unavailable-input.json"
output_schema = "schemas/unavailable-output.json"

[[components.provides]]
name = "memory.profile.describe"
contract = "2.0"
semantics = "read"
input_schema = "schemas/profile-input.json"
output_schema = "schemas/profile-output.json"

[[components.provides]]
name = "agent.tool.memory-exact-recall"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/tool-execute-input.json"
output_schema = "schemas/tool-execute-output.json"

[[components.provides]]
name = "shell.memory.inspect"
contract = "1.0"
semantics = "read"
input_schema = "schemas/shell-input.json"
output_schema = "schemas/shell-output.json"

[[components.shell_commands]]
command_id = "memory.trunks"
command_version = 1
service_id = "shell.memory.inspect"
service_version = 1
argument_schema = "schemas/shell-trunks.json"
management_operation_id = "memory.trunks.list"
target_scope = "BOT"
service_class = "P1"
required_capabilities = ["memory.read"]
output_policy = "SHORT"
timeout_s = 10

[[components.shell_commands]]
command_id = "memory.sources"
command_version = 1
service_id = "shell.memory.inspect"
service_version = 1
argument_schema = "schemas/shell-sources.json"
management_operation_id = "memory.sources.query"
target_scope = "BOT"
service_class = "P1"
required_capabilities = ["memory.read"]
output_policy = "SHORT"
timeout_s = 10

[[components.shell_commands]]
command_id = "memory.relations"
command_version = 1
service_id = "shell.memory.inspect"
service_version = 1
argument_schema = "schemas/shell-relations.json"
management_operation_id = "memory.relations.query"
target_scope = "BOT"
service_class = "P1"
required_capabilities = ["memory.read"]
output_policy = "SHORT"
timeout_s = 10

[[components.agent_tools]]
name = "memory_recall_exact"
service_id = "agent.tool.memory-exact-recall"
service_version = 1
declaration_schema = "schemas/memory-exact-recall-tool.json"
approval_required = false
supports_query = false

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "memory.graph.workspace"
label = "多模态记忆"
group = "memory"
order = 10

[components.storage]
schema_id = "forest.memory.graph"
schema_version = "3.3.0"
baseline = "schema/memory_graph.sql"
baseline_sha256 = "e781e7a2e696ec150859459c2d6a2c0b05a40dfc84893e8b292c25fc198584b0"
scope = "bot"
repository_contract = "forest.memory-graph.repository/2"
execution_profile = "official"

[[components.domain_queries]]
name = "memory.read-exact-sources"
contract = "1.0"
function = "memory_read_exact_sources"
input_schema = "schemas/read-exact-input.json"
output_schema = "schemas/read-exact-output.json"

[[components.domain_queries]]
name = "memory.list-trunks"
contract = "1.0"
function = "memory_list_trunks"
input_schema = "schemas/list-trunks-input.json"
output_schema = "schemas/list-trunks-output.json"

[[components.domain_queries]]
name = "memory.query-sources"
contract = "1.0"
function = "memory_query_sources"
input_schema = "schemas/query-sources-input.json"
output_schema = "schemas/query-sources-output.json"

[[components.domain_queries]]
name = "memory.query-relations"
contract = "1.0"
function = "memory_query_relations"
input_schema = "schemas/query-relations-input.json"
output_schema = "schemas/query-relations-output.json"

[[components.management_queries]]
id = "memory.trunks.list"
port = "memory.list-trunks"
timeout_s = 10

[[components.management_queries]]
id = "memory.sources.query"
port = "memory.query-sources"
default_limit = 50
max_limit = 100
timeout_s = 10

[[components.management_queries]]
id = "memory.relations.query"
port = "memory.query-relations"
default_limit = 10
max_limit = 20
timeout_s = 10

[[components.unit_of_work_participants]]
name = "memory.capture-source-record"
contract = "1.0"
function = "memory_capture_source"
input_schema = "schemas/capture-envelope.json"
output_schema = "schemas/capture-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/capture/author"
owner_component_path = "/input/capture/author/owner_component_id"
owner_kind_path = "/input/capture/author/owner_kind"
owner_id_path = "/input/capture/author/owner_id"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/capture/parts/*/payload"
owner_component_path = "/input/capture/parts/*/payload/owner_component_id"
owner_kind_path = "/input/capture/parts/*/payload/owner_kind"
owner_id_path = "/input/capture/parts/*/payload/owner_id"

[[components.unit_of_work_participants]]
name = "memory.mark-source-unavailable-record"
contract = "1.0"
function = "memory_mark_source_unavailable"
input_schema = "schemas/unavailable-envelope.json"
output_schema = "schemas/unavailable-output.json"

[[components.unit_of_work_participants]]
name = "memory.qualify-input-batch"
contract = "1.0"
function = "memory_qualify_input_batch"
input_schema = "schemas/qualify-input-batch-envelope.json"
output_schema = "schemas/qualify-input-batch-output.json"

[[components.unit_of_work_participants]]
name = "memory.qualify-archive"
contract = "1.0"
function = "memory_qualify_archive"
input_schema = "schemas/qualify-archive-envelope.json"
output_schema = "schemas/archive-selection-output.json"

[[components.unit_of_work_plans]]
name = "memory.capture-source"
contract = "1.0"
input_schema = "schemas/capture-plan.json"
output_schema = "schemas/capture-output.json"
timeout_s = 15
steps = [
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.capture-source-record", input_path = "/memory" }
]

[[components.unit_of_work_plans]]
name = "memory.mark-source-unavailable"
contract = "1.0"
input_schema = "schemas/unavailable-input.json"
output_schema = "schemas/unavailable-output.json"
timeout_s = 10
steps = [
  { id = "memory", component_id = "memory.graph", participant = "memory.mark-source-unavailable-record" }
]
