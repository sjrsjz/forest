manifest_version = 1
package_id = "forest.memory-graph"
version = "1.19.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "memory_graph:MemoryGraph"

[[components]]
id = "memory.graph"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
config_immutable_paths = ["/embedding"]

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 128
max_state_inflight = 8
max_owned_tasks = 16
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 15
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 15

[components.capabilities]
requests = [
  "payload.read",
  "payload.write",
  "service.call:embedding.profile.bind",
  "service.call:embedding.request.materialize",
  "service.call:embedding.encode",
  "service.call:vector.index.upsert",
  "service.call:vector.index.delete",
  "domain.query:memory.read-exact-sources",
  "domain.query:memory.read-facet-source",
  "domain.query:memory.read-embedding-candidates",
  "domain.query:memory.list-trunks",
  "domain.query:memory.query-sources",
  "domain.query:memory.query-relations",
  "uow.execute:memory.capture-source",
  "uow.execute:memory.forget-source",
  "uow.execute:memory.bind-domain",
  "uow.execute:memory.prepare-document-facets",
  "uow.execute:memory.reserve-embedding-budget",
  "uow.execute:memory.prepare-embedding-effect",
  "uow.execute:memory.handoff-embedding-effect",
  "uow.execute:memory.abandon-embedding-effect",
  "uow.execute:memory.observe-embedding-effect",
  "uow.execute:memory.publish-vector-batch",
  "uow.execute:memory.settle-embedding-budget",
  "uow.execute:memory.mark-source-unavailable"
]

