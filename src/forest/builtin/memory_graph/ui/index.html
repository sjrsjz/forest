<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>多模态记忆</title>
  <style>
    :root{color-scheme:dark;font:13px/1.4 Inter,system-ui,sans-serif;background:#0b1712;color:#dcebe3}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:2px}header,.panel{border:1px solid #29473a;border-radius:9px;background:#0e1c17}header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}header small,.hint{color:#8fa69b}button{border:0;border-radius:7px;padding:7px 12px;background:#79dbae;color:#07100c;font-weight:700}.panel{min-height:0;overflow:auto;padding:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:8px}label{display:grid;gap:4px;color:#9fb5aa}input{width:100%;border:1px solid #315144;border-radius:7px;background:#091510;color:#e8f4ee;padding:7px 8px}input:disabled{color:#83a092;background:#102019}.wide{grid-column:span 2}.status{min-height:18px;margin-top:8px;color:#8fd9b5}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(150px,1fr))}.wide{grid-column:span 2}}
  </style>
</head>
<body><div class="app"><header><div><strong>Memory Graph</strong><small id="revision">等待宿主握手</small></div><button id="plan" disabled>校验并生成计划</button></header><main class="panel"><p class="hint">Embedding 种类、模型与维度随 Bot 生命周期冻结；运行期只允许在 Embedding Provider 模块更换 endpoint。</p><div class="grid">
  <label class="wide">部署标识<input id="deployment" disabled></label><label class="wide">模型<input id="model" disabled></label><label>维度<input id="dimensions" disabled></label><label>模型种类<input id="kind" disabled></label>
  <label>种子数<input data-path="seed_limit" type="number" min="1" max="64"></label><label>每模态候选<input data-path="candidate_limit_per_facet" type="number" min="1" max="1024"></label><label>最大图节点<input data-path="max_graph_nodes" type="number" min="1" max="4096"></label><label>每点联想边<input data-path="max_association_edges_per_node" type="number" min="1" max="4096"></label><label>最小向量相似度<input data-path="min_similarity" type="number" min="-1" max="1" step="0.01"></label><label>最小图相关度<input data-path="min_graph_relevance" type="number" min="0" max="1" step="0.01"></label><label>序列权重<input data-path="sequence_weight" type="number" min="0" step="0.05"></label><label>联想权重<input data-path="association_weight" type="number" min="0" step="0.05"></label>
</div><div id="status" class="status"></div></main></div><script>(()=>{'use strict';let port=null,nonce='',draft=null;const q=id=>document.getElementById(id),send=(type,payload={})=>port&&port.postMessage({protocol:'forest.management-ui-channel/1',type,nonce,...payload});function render(){const e=draft.embedding,r=draft.retrieval;q('deployment').value=e.deployment_id;q('model').value=e.model;q('dimensions').value=e.dimensions;q('kind').value=e.model_kind;document.querySelectorAll('[data-path]').forEach(input=>input.value=r[input.dataset.path])}function changed(){document.querySelectorAll('[data-path]').forEach(input=>{draft.retrieval[input.dataset.path]=Number(input.value)});send('set-draft',{value:draft});q('status').textContent='草稿已更新'}document.querySelectorAll('[data-path]').forEach(input=>input.addEventListener('change',changed));q('plan').onclick=()=>{changed();q('status').textContent='服务端校验中';send('request-plan')};window.addEventListener('message',event=>{const message=event.data;if(!message||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||!event.ports[0])return;nonce=message.nonce;port=event.ports[0];port.onmessage=channel=>{const value=channel.data;if(!value||value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;if(value.type==='initialize'){draft=structuredClone(value.configuration.desired.value);q('revision').textContent=`期望 r${value.configuration.desired.revision} · 生效 r${value.configuration.effective.revision}`;q('plan').disabled=false;render()}else if(value.type==='plan-ready')q('status').textContent='计划已生成，请在宿主栏确认应用';else if(value.type==='applied')q('status').textContent=`配置 r${value.revision} 已生效`;else if(value.type==='reset'){draft=structuredClone(value.value);render();q('status').textContent='草稿已丢弃'}else if(value.type==='error')q('status').textContent=value.message||'操作失败'};port.start();send('ready')},{once:true})})();</script></body>
</html>
