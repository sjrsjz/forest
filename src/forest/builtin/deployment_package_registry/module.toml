manifest_version = 1
package_id = "forest.deployment-package-registry"
version = "1.6.1"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_package_registry:DeploymentPackageRegistry"

[[components]]
id = "deployment.package-registry"
scope = "deployment"
auto_install = true
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 1
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 30
stop_timeout_s = 10

[components.capabilities]
requests = [
  "service.call:deployment.catalog.page",
  "service.call:deployment.catalog.artifact",
  "service.call:deployment.catalog.import-receipt",
  "service.call:deployment.catalog.import-close",
]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "deployment.package-registry.workspace"
label = "部署包目录"
group = "deployment"
order = 30

[[components.effect_services]]
name = "deployment.catalog.page"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "read"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.effect_services]]
name = "deployment.catalog.artifact"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "read"
input_schema = "schemas/artifact-input.json"
output_schema = "schemas/artifact-output.json"

[[components.effect_services]]
name = "deployment.catalog.import"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "idempotent"
input_schema = "schemas/import-input.json"
output_schema = "schemas/artifact-output.json"

[[components.effect_services]]
name = "deployment.catalog.import-receipt"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "read"
input_schema = "schemas/import-receipt-input.json"
output_schema = "schemas/import-receipt-output.json"

[[components.effect_services]]
name = "deployment.catalog.import-close"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "idempotent"
input_schema = "schemas/import-receipt-input.json"
output_schema = "schemas/import-close-output.json"

[[components.provides]]
name = "deployment.package-registry.page"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.provides]]
name = "deployment.package-registry.artifact"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/artifact-input.json"
output_schema = "schemas/artifact-output.json"

[[components.provides]]
name = "deployment.package-registry.import-receipt"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/import-receipt-input.json"
output_schema = "schemas/import-receipt-output.json"

[components.storage]
schema_id = "forest.deployment.package-imports"
schema_version = "1.1.0"
baseline = "schema/imports.sql"
baseline_sha256 = "bb4e94d51597791d195671a6364b01b9fe21f6c2fafb930a6fe5c31707516efc"
scope = "deployment"
repository_contract = "forest.deployment-package-imports.repository/1"
execution_profile = "official"

[[components.domain_commands]]
name = "deployment.package-registry.import.reserve"
contract = "1.0"
function = "package_import_reserve"
input_schema = "schemas/import-reserve-input.json"
output_schema = "schemas/import-reserve-output.json"

[[components.domain_commands]]
name = "deployment.package-registry.import.settle"
contract = "1.0"
function = "package_import_settle"
input_schema = "schemas/import-settle-input.json"
output_schema = "schemas/import-settle-output.json"

[[components.domain_queries]]
name = "deployment.package-registry.import.page"
contract = "1.0"
function = "package_import_page"
input_schema = "schemas/import-page-input.json"
output_schema = "schemas/import-page-output.json"

[[components.owned_work_handlers]]
name = "deployment.package-registry.import.recover"
contract = "1.0"
handler = "deployment.package-registry.import.recover"
claim_function = "package_import_recovery_claim"
settle_function = "package_import_recovery_settle"
input_schema = "schemas/import-receipt-input.json"
output_schema = "schemas/import-close-output.json"
max_concurrency = 1
poll_interval_ms = 1000
claim_timeout_s = 5
handler_timeout_s = 15
settle_timeout_s = 5
lease_seconds = 30

[[components.management_queries]]
id = "packages"
port = "deployment.package-registry.page"
default_limit = 32
max_limit = 64
timeout_s = 30

[[components.management_queries]]
id = "artifact"
port = "deployment.package-registry.artifact"
timeout_s = 30

[[components.management_queries]]
id = "import.receipt"
port = "deployment.package-registry.import-receipt"
required_role = "ADMIN"
timeout_s = 30

[[components.management_queries]]
id = "import.page"
port = "deployment.package-registry.import.page"
required_role = "ADMIN"
default_limit = 32
max_limit = 100
timeout_s = 30

[[components.management_artifacts]]
id = "archive"
port = "deployment.catalog.artifact"
direction = "download"
media_type = "application/zip"
max_bytes = 33554432
required_role = "ADMIN"

[[components.management_artifacts]]
id = "import"
port = "deployment.catalog.import"
direction = "upload"
media_type = "application/zip"
max_bytes = 33554432
required_role = "ADMIN"
reserve_port = "deployment.package-registry.import.reserve"
settle_port = "deployment.package-registry.import.settle"
close_port = "deployment.catalog.import-close"
