manifest_version = 1
package_id = "forest.deployment-package-registry"
version = "1.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_package_registry:DeploymentPackageRegistry"

[[components]]
id = "deployment.package-registry"
scope = "deployment"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 1
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 30
stop_timeout_s = 10

[components.capabilities]
requests = [
  "service.call:deployment.catalog.page",
  "service.call:deployment.catalog.artifact",
]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "deployment.package-registry.workspace"
label = "部署包目录"
group = "deployment"
order = 30

[[components.effect_services]]
name = "deployment.catalog.page"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "read"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.effect_services]]
name = "deployment.catalog.artifact"
contract = "1.0"
kind = "deployment.package-catalog"
semantics = "read"
input_schema = "schemas/artifact-input.json"
output_schema = "schemas/artifact-output.json"

[[components.provides]]
name = "deployment.package-registry.page"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.provides]]
name = "deployment.package-registry.artifact"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/artifact-input.json"
output_schema = "schemas/artifact-output.json"

[[components.management_queries]]
id = "packages"
port = "deployment.package-registry.page"
default_limit = 32
max_limit = 64
timeout_s = 30

[[components.management_queries]]
id = "artifact"
port = "deployment.package-registry.artifact"
timeout_s = 30
