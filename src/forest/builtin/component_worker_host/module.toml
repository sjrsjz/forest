manifest_version = 1
package_id = "forest.component-worker-host"
version = "1.5.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "component_worker_host:ComponentWorkerHost"

[[components]]
id = "component.worker-host"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 64
max_state_inflight = 8
max_owned_tasks = 2
max_owned_resources = 2

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 60
stop_timeout_s = 10

[components.capabilities]
requests = [
  "service.call:runtime.graph.snapshot",
  "service.call:runtime.graph-replacement.request",
  "service.call:runtime.graph-replacement.status",
  "domain.query:component.reload.read",
  "domain.query:component.configuration-rebuild.read",
  "domain.command:component.reload.enqueue"
]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "components.workspace"
label = "组件"
group = "runtime"
order = 2

[components.storage]
schema_id = "forest.component.worker-host"
schema_version = "1.1.0"
baseline = "schema/control.sql"
baseline_sha256 = "b493f507bff369da64a2badddfe7f300c7d2b981a8783b6cbd03ac0edbf32f17"
scope = "bot"
repository_contract = "forest.component-worker-host.repository/1"
execution_profile = "official"

[[components.requires]]
name = "runtime.graph.snapshot"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.requires]]
name = "runtime.graph-replacement.request"
contract = ">=1.0,<2.0"
required = true
startup_dependency = false

[[components.requires]]
name = "runtime.graph-replacement.status"
contract = ">=1.0,<2.0"
required = true
startup_dependency = false

[[components.provides]]
name = "component.host.modules"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/modules-input.json"
output_schema = "schemas/modules-output.json"

[[components.provides]]
name = "component.host.module"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/module-input.json"
output_schema = "schemas/module-output.json"

[[components.provides]]
name = "component.host.reload"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/reload-read.json"
output_schema = "schemas/reload-status-output.json"

[[components.provides]]
name = "component.host.configuration-rebuild"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/configuration-rebuild-read.json"
output_schema = "schemas/configuration-rebuild-output.json"

[[components.provides]]
name = "shell.component-host.execute"
contract = "1.0"
semantics = "at-most-once"
input_schema = "schemas/shell-input.json"
output_schema = "schemas/shell-output.json"

[[components.provides]]
name = "shell.component-host.reload"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/shell-reload-input.json"
output_schema = "schemas/shell-output.json"

[[components.shell_commands]]
command_id = "module.list"
command_version = 1
service_id = "shell.component-host.execute"
service_version = 1
argument_schema = "schemas/shell-list.json"
management_operation_id = "module"
target_scope = "BOT"
service_class = "P1"
required_capabilities = ["runtime.status.read"]
output_policy = "SHORT"
timeout_s = 10

[[components.shell_commands]]
command_id = "module.reload"
command_version = 1
service_id = "shell.component-host.reload"
service_version = 1
argument_schema = "schemas/shell-reload-arguments.json"
management_operation_id = "module.reload"
target_scope = "BOT"
service_class = "P1"
required_capabilities = ["runtime.graph.reload"]
option_aliases = [["expect-graph", "expected_graph_revision"]]
output_policy = "SHORT"
timeout_s = 20

[[components.management_queries]]
id = "modules"
port = "component.host.modules"
timeout_s = 10

[[components.management_queries]]
id = "module"
port = "component.host.module"
timeout_s = 10

[[components.domain_commands]]
name = "component.reload.enqueue"
contract = "1.0"
function = "component_reload_enqueue"
input_schema = "schemas/reload-enqueue.json"
output_schema = "schemas/reload-output.json"

[[components.domain_queries]]
name = "component.reload.read"
contract = "1.0"
function = "component_reload_read"
input_schema = "schemas/reload-read.json"
output_schema = "schemas/reload-output.json"

[[components.domain_queries]]
name = "component.configuration-rebuild.read"
contract = "1.0"
function = "component_configuration_rebuild_read"
input_schema = "schemas/configuration-rebuild-read.json"
output_schema = "schemas/configuration-rebuild-output.json"

[[components.management_actions]]
id = "module.reload"
port = "component.reload.enqueue"
priority = "P1"
actor_field = "requested_by"
timeout_s = 15

[[components.management_queries]]
id = "reload"
port = "component.host.reload"
timeout_s = 10

[[components.management_queries]]
id = "configuration-rebuild"
port = "component.host.configuration-rebuild"
timeout_s = 10

[[components.owned_work_handlers]]
name = "component.reload.pending"
contract = "1.0"
handler = "component.reload.submit"
claim_function = "component_reload_claim"
settle_function = "component_reload_settle"
input_schema = "schemas/reload-work-input.json"
output_schema = "schemas/reload-work-output.json"
max_concurrency = 1
poll_interval_ms = 200
claim_timeout_s = 5
handler_timeout_s = 20
settle_timeout_s = 5
lease_seconds = 45

[[components.owned_work_handlers]]
name = "component.configuration-rebuild.pending"
contract = "1.0"
handler = "component.configuration-rebuild.submit"
claim_function = "component_configuration_rebuild_claim"
settle_function = "component_configuration_rebuild_settle"
input_schema = "schemas/configuration-rebuild-work-input.json"
output_schema = "schemas/configuration-rebuild-work-output.json"
max_concurrency = 1
poll_interval_ms = 500
claim_timeout_s = 5
handler_timeout_s = 20
settle_timeout_s = 5
lease_seconds = 45

[[components.unit_of_work_participants]]
name = "component.configuration-rebuild.record"
contract = "1.0"
function = "component_record_configuration_rebuild"
input_schema = "schemas/configuration-rebuild-envelope.json"
output_schema = "schemas/configuration-rebuild-output.json"
