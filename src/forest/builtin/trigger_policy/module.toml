manifest_version = 1
package_id = "forest.conversation.trigger-policy"
version = "1.1.1"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "trigger_policy:TriggerPolicy"

[[components]]
id = "conversation.trigger-policy"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
auto_install = true
configuration_apply = "worker-host/1"

[components.capabilities]
requests = ["service.call:adapter.onebot.groups.page"]

[[components.requires]]
name = "adapter.onebot.groups.page"
contract = ">=1.0,<2.0"
required = false
startup_dependency = false

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "conversation.trigger-policy.workspace"
label = "对话触发策略"
group = "conversation"
order = 10

[[components.management_queries]]
id = "groups.page"
port = "conversation.trigger.groups.page"
timeout_s = 15

[[components.provides]]
name = "conversation.trigger.groups.page"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/groups-page-input.json"
output_schema = "schemas/groups-page-output.json"

[components.bootstrap_contribution]
label = "Conversation Trigger Policy"
description = "Allowed groups and the conditions that create an Agent turn."
order = 40
schema = "schemas/config.json"
initial_value = "bootstrap.json"

[components.resources]
max_frame_bytes = 65536
max_inflight = 32
max_queue_items = 128
max_state_inflight = 1
max_owned_tasks = 4
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 10
stop_timeout_s = 5

[[components.provides]]
name = "conversation.trigger.classify"
contract = "1.0"
semantics = "read"
input_schema = "schemas/input.json"
output_schema = "schemas/output.json"
