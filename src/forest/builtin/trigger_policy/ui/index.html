<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>对话触发策略</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;color:#dcebe4;background:#0b1712}
    *{box-sizing:border-box}body{margin:0;padding:16px}h1,h2,p{margin:0}h1{font-size:19px}h2{font-size:15px}
    .muted{color:#9ab2a5;font-size:13px}header,.bar,.pagebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    header{justify-content:space-between;margin-bottom:12px}.policy{display:grid;grid-template-columns:minmax(220px,1fr) minmax(200px,1fr);gap:12px}
    section{border:1px solid #294437;border-radius:10px;padding:12px;margin-bottom:12px}label{display:flex;gap:8px;align-items:center}
    select,input[type=search]{background:#08130e;color:inherit;border:1px solid #365b47;border-radius:6px;padding:8px;min-width:0;font:inherit}
    .field{display:grid;gap:5px}.bar{margin:10px 0}.bar .field{flex:1;min-width:190px}.bar input{width:100%}
    button{border:1px solid #365b47;background:#193b2a;color:inherit;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
    button.primary{background:#84d9ae;color:#092718;font-weight:600}button:disabled{opacity:.45;cursor:default}input[type=checkbox]{accent-color:#84d9ae;width:17px;height:17px}
    .list{max-height:300px;overflow:auto;border:1px solid #294437;border-radius:7px}.row{padding:9px 11px;border-bottom:1px solid #223d2e;display:flex;gap:10px;align-items:center}
    .row:last-child{border-bottom:0}.row span{min-width:0;overflow-wrap:anywhere}.row small{display:block;color:#9ab2a5}.empty{padding:18px;color:#9ab2a5}
    .pagebar{justify-content:space-between;margin-top:8px}.selected{max-height:160px;overflow:auto;margin-top:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start}
    .chip{font-size:13px;max-width:100%;overflow-wrap:anywhere;text-align:left;padding:5px 8px}.chip span{margin-left:8px;color:#b2cbbd}
    details summary{cursor:pointer}#status{min-height:21px;color:#bfe5cd;overflow-wrap:anywhere}#discovery-error{color:#ffbcac;min-height:0}
    #mode-note{margin-top:8px}@media(max-width:600px){.policy{grid-template-columns:1fr}body{padding:10px}}
  </style>
</head>
<body>
  <header><div><h1>对话触发策略</h1><p class="muted" id="revision"></p></div><button class="primary" id="plan" disabled>生成配置计划</button></header>
  <section>
    <div class="policy">
      <label class="field">群聊触发方式<select id="mode" disabled><option value="MENTION">仅在 @ Bot 时触发</option><option value="ALL">允许群中的每条消息都触发</option><option value="DISABLED">关闭群聊自动触发</option></select></label>
      <label><input type="checkbox" id="private" disabled>允许私聊触发 Agent</label>
    </div>
    <p class="muted" id="mode-note"></p>
  </section>
  <section>
    <h2>允许触发的群</h2><p class="muted">从当前 Bot 已加入的群中选择。勾选只修改草稿，应用配置计划后生效。</p>
    <div class="bar">
      <label class="field">Bot 账号<select id="account" disabled><option>等待连接</option></select></label>
      <label class="field">搜索群名或群号<input type="search" id="search" placeholder="输入群名或群号"></label>
      <button id="find" disabled>查询</button><button id="refresh" disabled>刷新群列表</button>
    </div>
    <p id="discovery-error" role="alert"></p>
    <div class="list" id="groups"><p class="empty">正在读取配置…</p></div>
    <div class="pagebar"><span class="muted" id="page-info"></span><button id="next" hidden>下一页</button></div>
  </section>
  <section>
    <details id="selected-detail"><summary id="selected-count">已选 0 个群</summary><p class="muted">这里保留所有已选群，包含当前页或当前账号未显示的群。点击可移除。</p><div class="selected" id="selected"></div></details>
  </section>
  <p id="status" role="status"></p>
  <script>
  (()=>{'use strict';
    let port,nonce,draft=null,sequence=0,loadSequence=0,accounts=[],items=[],cursor=null,activeQuery='',pageNumber=1;
    const selected=new Set(),names=new Map(),pending=new Map(),el=id=>document.getElementById(id);
    const send=(type,payload={})=>port.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});
    const resize=()=>send('resize',{height:document.documentElement.scrollHeight});
    const status=message=>{el('status').textContent=message;resize();};
    const query=value=>new Promise((resolve,reject)=>{const request_id=`trigger:${++sequence}`;pending.set(request_id,{resolve,reject});send('query',{request_id,operation_id:'groups.page',value});});
    function update(){
      if(!draft)return;
      draft.allowed_group_ids=[...selected].sort((a,b)=>a.length-b.length||a.localeCompare(b));
      draft.group_trigger_mode=el('mode').value;draft.private_enabled=el('private').checked;
      send('set-draft',{value:structuredClone(draft)});renderSelection();
      el('mode-note').textContent=draft.group_trigger_mode==='ALL'?'每条消息均会触发，可能显著增加模型调用费用。':'白名单仅控制自动触发；接收、上下文归档与记忆召回使用各自模块的规则。';
    }
    function renderSelection(){
      el('selected-count').textContent=`已选 ${selected.size} 个群`;
      el('selected').replaceChildren();
      for(const id of selected){const button=document.createElement('button');button.className='chip';button.type='button';button.textContent=names.has(id)?`${names.get(id)} · ${id}`:id;const remove=document.createElement('span');remove.textContent='× 移除';button.append(remove);button.onclick=()=>{selected.delete(id);update();renderGroups();};el('selected').append(button);}
      resize();
    }
    function renderGroups(){
      el('groups').replaceChildren();
      if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent=accounts.length?'没有匹配的群。已有选择仍保留在下方。':'当前没有可查询的启用账号。';el('groups').append(p);}
      for(const row of items){
        const label=document.createElement('label');label.className='row';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(row.group_id);check.setAttribute('aria-label',`允许 ${row.group_name} (${row.group_id})`);
        check.onchange=()=>{if(check.checked&&selected.size>=4096){check.checked=false;status('最多允许选择 4096 个群。');return;}if(check.checked)selected.add(row.group_id);else selected.delete(row.group_id);update();};
        const text=document.createElement('span');text.textContent=row.group_name;const id=document.createElement('small');id.textContent=row.group_id;text.append(id);label.append(check,text);el('groups').append(label);
      }
      resize();
    }
    function restore(value){draft=structuredClone(value);selected.clear();for(const id of draft.allowed_group_ids)selected.add(id);el('mode').value=draft.group_trigger_mode;el('private').checked=draft.private_enabled;renderSelection();renderGroups();update();}
    async function discover({refresh=false,next=false}={}){
      const run=++loadSequence;el('discovery-error').textContent='';el('page-info').textContent='正在查询…';el('next').hidden=true;
      try{
        if(refresh){
          const metadata=await query({binding_ref:null,query:'',after_group_id:null});if(run!==loadSequence)return;
          const previous=el('account').value;accounts=metadata.accounts;el('account').replaceChildren();
          for(const account of accounts){const option=document.createElement('option');option.value=account.binding_ref;option.textContent=`${account.self_id} · ${account.binding_ref}`;el('account').append(option);}
          if(accounts.some(account=>account.binding_ref===previous))el('account').value=previous;
          el('account').disabled=!accounts.length;el('find').disabled=!accounts.length;
        }
        if(!accounts.length){items=[];cursor=null;el('page-info').textContent='无启用账号';renderGroups();return;}
        if(!next){activeQuery=el('search').value.trim();pageNumber=1;cursor=null;}
        const page=await query({binding_ref:el('account').value,query:activeQuery,after_group_id:next?cursor:null});if(run!==loadSequence)return;
        items=page.items;for(const row of items)names.set(row.group_id,row.group_name);cursor=page.next_after_group_id;if(next)pageNumber++;
        el('page-info').textContent=`匹配 ${page.total} 个群 · 第 ${pageNumber} 页 · 本页 ${items.length} 个`;
        el('next').hidden=cursor===null;renderGroups();renderSelection();
      }catch(error){if(run!==loadSequence)return;items=[];cursor=null;renderGroups();el('discovery-error').textContent=`读取群列表失败：${error.message}。原有白名单和草稿已保留，请确认 Bot 与 OneBot Adapter 在线后刷新。`;el('page-info').textContent='查询失败';}
      finally{if(run===loadSequence)resize();}
    }
    addEventListener('message',event=>{
      const message=event.data||{};if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;
      port=event.ports[0];nonce=message.nonce;port.onmessage=event=>{
        const data=event.data||{};if(data.protocol!=='forest.management-ui-channel/1'||data.nonce!==nonce)return;
        if(data.type==='initialize'){restore(data.configuration.desired.value);el('revision').textContent=`期望 r${data.configuration.desired.revision} · 生效 r${data.configuration.effective.revision}`;for(const id of ['mode','private','plan','refresh'])el(id).disabled=false;discover({refresh:true});return;}
        if(data.type==='reset'){restore(data.value);status('已恢复配置草稿。');return;}
        if(data.type==='plan-ready'){status('计划已生成，请在外层检查并点击“应用计划”。');return;}
        if(data.type==='desired-committed'){status(`配置 r${data.revision} 已提交，等待生效。`);return;}
        if(data.type==='error'){status(data.message||'配置计划失败');return;}
        const waiter=pending.get(data.request_id);if(!waiter)return;pending.delete(data.request_id);if(data.type==='operation-error')waiter.reject(new Error(data.message||'查询失败'));else waiter.resolve(data.value);
      };port.start();send('ready');
    },{once:true});
    el('mode').onchange=update;el('private').onchange=update;el('plan').onclick=()=>{update();send('request-plan');};
    el('refresh').onclick=()=>discover({refresh:true});el('find').onclick=()=>discover();el('account').onchange=()=>discover();el('next').onclick=()=>discover({next:true});
    el('search').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();if(!el('find').disabled)discover();}};el('selected-detail').ontoggle=()=>{if(port)resize();};
  })();
  </script>
</body>
</html>
