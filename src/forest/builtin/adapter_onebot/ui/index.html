<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    *{box-sizing:border-box}body{margin:0;padding:12px}section{border:1px solid #29493a;border-radius:10px;background:#102019;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-bottom:1px solid #29493a}.title{display:flex;align-items:baseline;gap:10px;min-width:0}h2{margin:0;font-size:16px;white-space:nowrap}p{margin:0;color:#97b4a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:8px;white-space:nowrap}.mono{font-family:ui-monospace,monospace;color:#7fe0b5}button{padding:7px 10px;border:1px solid #365b49;border-radius:7px;background:#173426;color:#dcebe2;cursor:pointer}.table{overflow-x:auto;padding:10px}.head,.binding{display:grid;grid-template-columns:minmax(8rem,1.1fr) 6rem minmax(7rem,.8fr) minmax(10rem,1.3fr) minmax(15rem,2fr) 5rem 5.5rem 5.5rem 4.5rem 3rem;gap:7px;align-items:center;min-width:1050px}.head{padding:0 4px 6px;color:#86aa97;font-size:12px}.binding{padding:7px 4px;border-top:1px solid #203e30}.binding:first-child{border-top:0}input{width:100%;min-width:0;padding:7px;border:1px solid #365b49;border-radius:6px;background:#09120e;color:#e9f7ef}input[type=checkbox]{width:auto;justify-self:center}.remove{padding:5px 8px;background:#2c1b1b;border-color:#653a3a;color:#efb6b6}@media(max-width:900px){p{display:none}}
  </style>
</head>
<body>
  <section>
    <div class="bar">
      <div class="title"><h2>OneBot 11 传输绑定</h2><p>配置由模块持有；保存后通过 RuntimeGraph 发布新 Generation。</p></div>
      <div class="actions"><span id="revision" class="mono">未连接</span><button id="add" type="button">新增绑定</button></div>
    </div>
    <div class="table">
      <div class="head"><span>Binding Ref</span><span>Epoch</span><span>Bot QQ</span><span>Credential Ref</span><span>WebSocket Endpoint</span><span>超时</span><span>事件队列</span><span>请求队列</span><span>启用</span><span></span></div>
      <div id="bindings"></div>
    </div>
  </section>
  <template id="binding-template">
    <div class="binding">
      <input data-field="binding_ref"><input data-field="binding_epoch" type="number" min="1"><input data-field="self_id"><input data-field="credential_ref"><input data-field="websocket_url" type="url"><input data-field="timeout_seconds" type="number" min="1" max="120"><input data-field="event_capacity" type="number" min="1" max="4096"><input data-field="pending_capacity" type="number" min="1" max="256"><input data-field="enabled" type="checkbox"><button class="remove" type="button" aria-label="删除绑定">×</button>
    </div>
  </template>
  <script>
    (()=>{'use strict';let port=null,nonce=null;
      const root=document.getElementById('bindings'),template=document.getElementById('binding-template'),revision=document.getElementById('revision'),numeric=new Set(['binding_epoch','timeout_seconds','event_capacity','pending_capacity']);
      const send=(type,payload={})=>port?.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});
      const row=value=>{const node=template.content.firstElementChild.cloneNode(true);for(const input of node.querySelectorAll('[data-field]')){const key=input.dataset.field;if(key==='enabled')input.checked=value[key];else input.value=value[key];}return node;};
      const render=value=>{root.replaceChildren(...value.bindings.map(row));};
      const draft=()=>({protocol:'forest.adapter.onebot/2',bindings:[...root.children].map(node=>Object.fromEntries([...node.querySelectorAll('[data-field]')].map(input=>{const key=input.dataset.field;return[key,key==='enabled'?input.checked:numeric.has(key)?Number(input.value):input.value];})))});
      const changed=()=>send('set-draft',{value:draft()});
      root.addEventListener('input',changed);root.addEventListener('click',event=>{if(!event.target.classList.contains('remove'))return;if(root.children.length===1)return;event.target.closest('.binding').remove();changed();});
      document.getElementById('add').addEventListener('click',()=>{if(root.children.length>=16)return;root.append(row({binding_ref:'',binding_epoch:1,self_id:'',credential_ref:'',websocket_url:'ws://',timeout_seconds:30,event_capacity:512,pending_capacity:64,enabled:true}));changed();send('resize',{height:document.documentElement.scrollHeight});});
      addEventListener('message',event=>{const m=event.data||{};if(event.source!==parent||!event.ports[0]||m.protocol!=='forest.management-ui-connect/1'||m.type!=='connect'||typeof m.nonce!=='string')return;port=event.ports[0];nonce=m.nonce;port.onmessage=event=>{const v=event.data||{};if(v.protocol!=='forest.management-ui-channel/1'||v.nonce!==nonce)return;if(v.type==='initialize'){render(v.configuration.desired.value);revision.textContent=`期望 r${v.configuration.desired.revision} · 生效 r${v.configuration.effective.revision}`;send('resize',{height:document.documentElement.scrollHeight});}else if(v.type==='reset')render(v.value);};port.start();send('ready');},{once:true});
    })();
  </script>
</body>
</html>
