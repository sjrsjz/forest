manifest_version = 1
package_id = "forest.counter"
version = "0.7.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "counter:Counter"

[[components]]
id = "forest.counter"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "counter.workspace"
label = "Counter"
group = "diagnostics"
order = 10

[[components.management_queries]]
id = "counter.current"
port = "counter.current"
timeout_s = 10

[[components.management_actions]]
id = "counter.set"
port = "counter.set"
priority = "P1"
timeout_s = 10

[components.capabilities]
requests = ["domain.query:counter.current", "domain.command:counter.set", "domain.command:counter.enqueue", "uow.execute:counter.atomic-set", "uow.execute:counter.atomic-set-reject", "uow.execute:counter.cross-component-reject"]

[components.storage]
schema_id = "forest.counter"
schema_version = "1.0.0"
baseline = "schema/counter.sql"
baseline_sha256 = "4c3d4d155f1224dde5c5d038b89dbc09efabcce552b37751390cb980dfd194be"
scope = "bot"
repository_contract = "forest.counter.repository/1"
execution_profile = "official"

[[components.domain_queries]]
name = "counter.current"
contract = "1.0"
function = "counter_current"
input_schema = "schemas/domain-current-input.json"
output_schema = "schemas/domain-current-output.json"

[[components.domain_commands]]
name = "counter.set"
contract = "1.0"
function = "counter_set"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"

[[components.domain_commands]]
name = "counter.enqueue"
contract = "1.0"
function = "counter_enqueue"
input_schema = "schemas/defer-input.json"
output_schema = "schemas/defer-output.json"

[[components.unit_of_work_participants]]
name = "counter.set-in-transaction"
contract = "1.0"
function = "counter_set_in_transaction"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"

[[components.unit_of_work_participants]]
name = "counter.set-from-plan"
contract = "1.0"
function = "counter_set_from_plan"
input_schema = "schemas/uow-step-input.json"
output_schema = "schemas/domain-set-output.json"

[[components.unit_of_work_participants]]
name = "counter.reject-plan"
contract = "1.0"
function = "counter_reject_plan"
input_schema = "schemas/uow-step-input.json"
output_schema = "schemas/domain-set-output.json"

[[components.unit_of_work_plans]]
name = "counter.atomic-set"
contract = "1.0"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"
timeout_s = 10
steps = [
  { id = "counter-set", component_id = "forest.counter", participant = "counter.set-from-plan" }
]

[[components.unit_of_work_plans]]
name = "counter.atomic-set-reject"
contract = "1.0"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"
timeout_s = 10
steps = [
  { id = "counter-set", component_id = "forest.counter", participant = "counter.set-from-plan" },
  { id = "reject", component_id = "forest.counter", participant = "counter.reject-plan" }
]

[[components.unit_of_work_plans]]
name = "counter.cross-component-reject"
contract = "1.0"
input_schema = "schemas/uow-cross-input.json"
output_schema = "schemas/domain-set-output.json"
timeout_s = 10
steps = [
  { id = "counter-set", component_id = "forest.counter", participant = "counter.set-from-plan", input_path = "/counter" },
  { id = "effect-observe", component_id = "kernel.effect", participant = "effect.observe", input_path = "/effect" }
]

[[components.owned_work_handlers]]
name = "counter.deferred-apply"
contract = "1.0"
handler = "counter.apply"
claim_function = "counter_claim_work"
settle_function = "counter_settle_work"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"
max_concurrency = 1
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 10
settle_timeout_s = 5
lease_seconds = 20

[[components.provides]]
name = "counter.increment"
contract = "1.0"
input_schema = "schemas/input.json"
output_schema = "schemas/output.json"

[[components.provides]]
name = "counter.defer"
contract = "1.0"
input_schema = "schemas/defer-input.json"
output_schema = "schemas/defer-output.json"

[[components.provides]]
name = "counter.transaction"
contract = "1.0"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"

[[components.provides]]
name = "counter.transaction-reject"
contract = "1.0"
input_schema = "schemas/domain-set-input.json"
output_schema = "schemas/domain-set-output.json"

[[components.provides]]
name = "counter.cross-component-probe"
contract = "1.0"
input_schema = "schemas/uow-cross-input.json"
output_schema = "schemas/domain-set-output.json"
