manifest_version = 1
package_id = "forest.shell-command"
version = "1.2.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "shell_command:ShellCommand"

[[components]]
id = "shell.command"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
configuration_apply = "worker-host/1"

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 128
max_state_inflight = 8
max_owned_tasks = 8
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 10

[components.capabilities]
requests = [
  "service.call:kernel.payload.json-write",
  "uow.execute:shell.authorize-execution",
  "uow.execute:shell.complete",
  "uow.execute:shell.complete-rejection"
]

[[components.contribution_directories]]
kind = "shell-commands"
max_execution_timeout_s = 900
synchronization_command = "shell-directory.synchronize"
cleanup_command = "shell-directory.cleanup"
synchronize_configuration = true

[[components.provides]]
name = "shell.ingress.inspect"
contract = "1.0"
semantics = "read"
input_schema = "schemas/inspect-input.json"
output_schema = "schemas/inspect-output.json"

[[components.effect_services]]
name = "kernel.payload.json-write"
contract = "1.0"
kind = "kernel.payload-json"
semantics = "idempotent"
input_schema = "schemas/payload-write-input.json"
output_schema = "schemas/payload-write-output.json"

[components.storage]
schema_id = "forest.shell.command"
schema_version = "2.2.0"
baseline = "schema/shell_command.sql"
baseline_sha256 = "02ee7b16b128aef55d0e1d459f31d8c20c54ce53dad4bf26dd960e13de4330d5"
scope = "bot"
repository_contract = "forest.shell-command.repository/2"
execution_profile = "official"

[[components.domain_commands]]
name = "shell-directory.synchronize"
contract = "1.0"
function = "shell_directory_synchronize"
input_schema = "schemas/directory-input.json"
output_schema = "schemas/directory-output.json"

[[components.domain_commands]]
name = "shell-directory.cleanup"
contract = "1.0"
function = "shell_directory_cleanup"
input_schema = "schemas/directory-cleanup-input.json"
output_schema = "schemas/directory-cleanup-output.json"

[[components.unit_of_work_participants]]
name = "shell.admit-ingress"
contract = "1.0"
function = "shell_admit_ingress"
input_schema = "schemas/admit-envelope.json"
output_schema = "schemas/admit-output.json"

[[components.unit_of_work_participants]]
name = "shell.authorize-claim"
contract = "1.0"
function = "shell_authorize_claim"
input_schema = "schemas/authorize-envelope.json"
output_schema = "schemas/authorize-output.json"

[[components.unit_of_work_participants]]
name = "shell.verify-management-claim"
contract = "1.0"
function = "shell_verify_management_claim"
input_schema = "schemas/management-claim-input.json"
output_schema = "schemas/management-claim-output.json"

[[components.unit_of_work_participants]]
name = "shell.complete-claim"
contract = "1.0"
function = "shell_complete_claim"
input_schema = "schemas/complete-envelope.json"
output_schema = "schemas/complete-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/result"
owner_component = "shell.command"
owner_kind = "shell.result"
owner_id_path = "/input/result/owner_id"

[[components.unit_of_work_participants]]
name = "shell.complete-rejection-record"
contract = "1.0"
function = "shell_complete_rejection"
input_schema = "schemas/complete-rejection-envelope.json"
output_schema = "schemas/complete-rejection-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/result"
owner_component = "shell.command"
owner_kind = "shell.result"
owner_id_path = "/input/result/owner_id"

[[components.unit_of_work_plans]]
name = "shell.authorize-execution"
contract = "1.0"
input_schema = "schemas/authorize-plan.json"
output_schema = "schemas/authorize-output.json"
timeout_s = 10
steps = [
  { id = "issue", component_id = "kernel.authorization", participant = "authorization.issue", input_path = "/issue" },
  { id = "consume", component_id = "kernel.authorization", participant = "authorization.consume", input_path = "/consume" },
  { id = "shell", component_id = "shell.command", participant = "shell.authorize-claim", input_path = "/shell" }
]

[[components.unit_of_work_plans]]
name = "shell.complete"
contract = "1.0"
input_schema = "schemas/complete-plan.json"
output_schema = "schemas/audit-output.json"
timeout_s = 10
steps = [
  { id = "shell", component_id = "shell.command", participant = "shell.complete-claim", input_path = "/shell" },
  { id = "delivery", component_id = "delivery", participant = "delivery.create-control-intent-uow", input_path = "/delivery", participant_generation_field = "delivery_generation_id" },
  { id = "audit", component_id = "kernel.audit", participant = "audit.append", input_path = "/audit" }
]

[[components.unit_of_work_plans]]
name = "shell.complete-rejection"
contract = "1.0"
input_schema = "schemas/complete-plan.json"
output_schema = "schemas/audit-output.json"
timeout_s = 10
steps = [
  { id = "shell", component_id = "shell.command", participant = "shell.complete-rejection-record", input_path = "/shell" },
  { id = "delivery", component_id = "delivery", participant = "delivery.create-control-intent-uow", input_path = "/delivery", participant_generation_field = "delivery_generation_id" },
  { id = "audit", component_id = "kernel.audit", participant = "audit.append", input_path = "/audit" }
]

[[components.owned_work_handlers]]
name = "shell.command.pending"
contract = "1.0"
handler = "shell.command.execute"
claim_function = "shell_claim_work"
settle_function = "shell_settle_work"
input_schema = "schemas/work-input.json"
output_schema = "schemas/work-output.json"
max_concurrency = 1
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 920
settle_timeout_s = 10
lease_seconds = 940
drain_policy = "backlog"

[[components.owned_work_handlers]]
name = "shell.rejection.pending"
contract = "1.0"
handler = "shell.rejection.publish"
claim_function = "shell_claim_rejection"
settle_function = "shell_settle_rejection"
input_schema = "schemas/rejection-work-input.json"
output_schema = "schemas/work-output.json"
max_concurrency = 1
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 30
settle_timeout_s = 10
lease_seconds = 45
drain_policy = "backlog"
