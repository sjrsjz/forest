<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>受控进程执行</title>
  <style>
    :root{color-scheme:dark;font:13px/1.45 Inter,system-ui,sans-serif;background:#0b1712;color:#dbe9e2}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button,textarea{font:inherit}
    button{border:0;border-radius:7px;padding:7px 11px;background:#79dbae;color:#07100c;font-weight:700;cursor:pointer}
    button.quiet{border:1px solid #315144;background:#13251e;color:#bad0c5}button.danger{background:#3a201d;color:#ffd0ca}
    button:disabled{opacity:.45;cursor:default}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:9px;padding:2px}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid #29473a;border-radius:9px;background:#0e1c17}
    header strong{display:block}header small{color:#8fa69b}.actions{display:flex;gap:6px;flex-wrap:wrap}
    .body{min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr);gap:9px}.pane{min-height:0;border:1px solid #29473a;border-radius:9px;background:#0e1c17;overflow:hidden}
    aside{display:grid;grid-template-rows:auto minmax(0,1fr)}.pane-title{padding:8px 10px;border-bottom:1px solid #223a30;color:#91aa9e}.list{overflow:auto;padding:5px}
    .profile{display:grid;width:100%;gap:2px;margin:2px 0;text-align:left;background:transparent;color:#bfd3c9}.profile.selected,.profile:hover{background:#173126}.profile small{overflow:hidden;color:#819b8e;text-overflow:ellipsis}
    main{display:grid;grid-template-rows:auto minmax(0,1fr)}.editor-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #223a30}.status{color:#91aa9e}
    textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:12px;background:#091510;color:#e8f4ee;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    @media(max-width:760px){.body{grid-template-columns:1fr;grid-template-rows:140px minmax(0,1fr)}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><strong>ExecutionProfile</strong><small id="revision">等待宿主握手</small></div>
      <div class="actions">
        <button id="add" class="quiet" disabled>新增 Profile</button>
        <button id="remove" class="danger" disabled>删除</button>
        <button id="plan" disabled>校验并生成计划</button>
      </div>
    </header>
    <div class="body">
      <aside class="pane"><div class="pane-title">执行配置 <span id="count">0</span></div><div id="list" class="list"></div></aside>
      <main class="pane"><div class="editor-head"><span id="selected">尚未选择</span><span id="status" class="status"></span></div><textarea id="editor" spellcheck="false" disabled></textarea></main>
    </div>
  </div>
  <script>
    (()=>{
      'use strict';
      let port=null,nonce='',configuration=null,profiles=[],selected=-1;
      const byId=id=>document.getElementById(id);
      const send=(type,payload={})=>port&&port.postMessage({protocol:'forest.management-ui-channel/1',type,nonce,...payload});
      const show=value=>{byId('status').textContent=value||''};
      const enable=value=>['add','plan'].forEach(id=>byId(id).disabled=!value);
      function emitDraft(){send('set-draft',{value:{protocol:'forest.process.executor/1',profiles}});}
      function storeEditor(){
        if(selected<0)return true;
        try{const value=JSON.parse(byId('editor').value);if(!value||Array.isArray(value)||typeof value!=='object')throw new Error('Profile 必须是 JSON 对象');profiles[selected]=value;show('草稿已更新');emitDraft();return true}catch(error){show(error.message);return false}
      }
      function render(){
        const list=byId('list');list.replaceChildren();byId('count').textContent=String(profiles.length);
        profiles.forEach((profile,index)=>{const button=document.createElement('button');button.className='profile'+(index===selected?' selected':'');button.type='button';const name=document.createElement('span');name.textContent=profile.profile_id||`profile ${index+1}`;const path=document.createElement('small');path.textContent=profile.executable||'未设置可执行文件';button.append(name,path);button.onclick=()=>{if(!storeEditor())return;selected=index;byId('selected').textContent=profile.profile_id||`profile ${index+1}`;byId('editor').value=JSON.stringify(profile,null,2);byId('editor').disabled=false;byId('remove').disabled=false;render()};list.append(button)});
        if(selected<0){byId('editor').value='';byId('editor').disabled=true;byId('remove').disabled=true;byId('selected').textContent='尚未选择'}
      }
      byId('editor').addEventListener('change',storeEditor);
      byId('add').onclick=()=>{if(!storeEditor())return;profiles.push({profile_id:'new.profile',executable:'/absolute/path',executable_sha256:'sha256:'+'0'.repeat(64),arguments_schema:{$schema:'https://json-schema.org/draft/2020-12/schema',type:'object',required:[],properties:{},additionalProperties:false},argv:[{literal:'--version'}],working_directory:'/app',environment:{},run_as:{uid:10001,gid:10001},network_policy:'deny',require_posix_limits:true,limits:{cpu_seconds:5,memory_bytes:268435456,wall_seconds:30,output_bytes:65536,open_files:64,processes:16,terminate_grace_seconds:2}});selected=profiles.length-1;byId('editor').value=JSON.stringify(profiles[selected],null,2);byId('editor').disabled=false;emitDraft();render()};
      byId('remove').onclick=()=>{if(selected<0)return;profiles.splice(selected,1);selected=Math.min(selected,profiles.length-1);if(selected>=0)byId('editor').value=JSON.stringify(profiles[selected],null,2);emitDraft();render()};
      byId('plan').onclick=()=>{if(storeEditor()){show('服务端校验中');send('request-plan')}};
      window.addEventListener('message',event=>{
        const message=event.data;if(!message||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||!event.ports[0])return;
        nonce=message.nonce;port=event.ports[0];port.onmessage=channel=>{
          const value=channel.data;if(!value||value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;
          if(value.type==='initialize'){configuration=value.configuration;profiles=structuredClone(configuration.desired.value.profiles||[]);selected=profiles.length?0:-1;byId('revision').textContent=`期望 r${configuration.desired.revision} · 生效 r${configuration.effective.revision}`;if(selected>=0)byId('editor').value=JSON.stringify(profiles[0],null,2);enable(true);render();show('')}
          else if(value.type==='plan-ready')show('计划已生成，请在宿主栏确认应用');
          else if(value.type==='applied')show(`配置 r${value.revision} 已生效`);
          else if(value.type==='reset'){profiles=structuredClone(value.value.profiles||[]);selected=profiles.length?0:-1;if(selected>=0)byId('editor').value=JSON.stringify(profiles[0],null,2);render();show('草稿已丢弃')}
          else if(value.type==='error')show(value.message||'操作失败');
        };port.start();send('ready');
      },{once:true});
    })();
  </script>
</body>
</html>
