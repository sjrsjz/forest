manifest_version = 1
package_id = "forest.deployment-accounts"
version = "1.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_accounts:DeploymentAccounts"

[[components]]
id = "deployment.accounts"
scope = "deployment"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 1
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 30
stop_timeout_s = 10

[components.capabilities]
requests = ["domain.query:deployment.accounts.metadata.page"]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "deployment.accounts.workspace"
label = "管理账号"
group = "deployment"
order = 40

[[components.provides]]
name = "deployment.accounts.page"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[components.storage]
schema_id = "forest.deployment.accounts-ui"
schema_version = "1.0.0"
baseline = "schema/accounts.sql"
baseline_sha256 = "1a7550872c772ecea98fb6927d2c5a9bf47727b45700d9ad133b88f121b19692"
scope = "deployment"
repository_contract = "forest.deployment-accounts-ui.repository/1"
execution_profile = "official"

[[components.domain_queries]]
name = "deployment.accounts.metadata.page"
contract = "1.0"
function = "deployment_accounts_metadata_page"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.kernel_commands]]
name = "deployment.accounts.create"
contract = "1.0"
kind = "deployment.account-create"
input_schema = "schemas/create-input.json"
output_schema = "schemas/account-output.json"

[[components.kernel_commands]]
name = "deployment.accounts.update"
contract = "1.0"
kind = "deployment.account-update"
input_schema = "schemas/update-input.json"
output_schema = "schemas/account-output.json"

[[components.kernel_commands]]
name = "deployment.accounts.password"
contract = "1.0"
kind = "deployment.account-password"
input_schema = "schemas/password-input.json"
output_schema = "schemas/account-output.json"

[[components.kernel_commands]]
name = "deployment.accounts.revoke-sessions"
contract = "1.0"
kind = "deployment.account-revoke-sessions"
input_schema = "schemas/revoke-input.json"
output_schema = "schemas/account-output.json"

[[components.management_queries]]
id = "accounts.list"
port = "deployment.accounts.page"
default_limit = 50
max_limit = 100
timeout_s = 10

[[components.management_actions]]
id = "account.create"
port = "deployment.accounts.create"
priority = "P0"
secret_field = "password"
timeout_s = 20

[[components.management_actions]]
id = "account.update"
port = "deployment.accounts.update"
priority = "P0"
timeout_s = 15

[[components.management_actions]]
id = "account.password"
port = "deployment.accounts.password"
priority = "P0"
secret_field = "password"
timeout_s = 20

[[components.management_actions]]
id = "account.sessions.revoke"
port = "deployment.accounts.revoke-sessions"
priority = "P0"
timeout_s = 15
