manifest_version = 1
package_id = "forest.deployment-secrets"
version = "1.1.2"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_secrets:DeploymentSecrets"

[[components]]
id = "deployment.secrets"
scope = "deployment"
auto_install = true
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 1
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 30
stop_timeout_s = 10

[components.capabilities]
requests = ["domain.query:deployment.secrets.metadata.page"]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "deployment.secrets.workspace"
label = "Secret 寮曠敤"
group = "deployment"
order = 20

[[components.provides]]
name = "deployment.secrets.page"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[components.storage]
schema_id = "forest.deployment.secrets-ui"
schema_version = "1.0.0"
baseline = "schema/secrets.sql"
baseline_sha256 = "8a14da2596d2ab855991e0b3ffe1ecd78f8a7da1399046e1bce1b48fcea9d287"
scope = "deployment"
repository_contract = "forest.deployment-secrets-ui.repository/1"
execution_profile = "official"

[[components.domain_queries]]
name = "deployment.secrets.metadata.page"
contract = "1.0"
function = "deployment_secret_metadata_page"
input_schema = "schemas/page-input.json"
output_schema = "schemas/page-output.json"

[[components.kernel_commands]]
name = "deployment.secrets.put"
contract = "1.0"
kind = "deployment.secret-put"
input_schema = "schemas/put-input.json"
output_schema = "schemas/put-output.json"

[[components.kernel_queries]]
name = "deployment.secrets.operation-result"
contract = "1.0"
kind = "deployment.secret-operation-result"
input_schema = "schemas/operation-input.json"
output_schema = "schemas/operation-output.json"

[[components.management_queries]]
id = "secrets.list"
port = "deployment.secrets.page"
default_limit = 50
max_limit = 100
timeout_s = 10

[[components.management_queries]]
id = "secret.operation"
port = "deployment.secrets.operation-result"
actor_field = "requested_by"
required_role = "ADMIN"
timeout_s = 10

[[components.management_actions]]
id = "secret.put"
port = "deployment.secrets.put"
priority = "P0"
secret_field = "plaintext"
timeout_s = 15
