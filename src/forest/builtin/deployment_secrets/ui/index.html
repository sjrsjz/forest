<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    *{box-sizing:border-box}body{margin:0;padding:10px}main{border:1px solid #29493a;border-radius:9px;background:#102019;overflow:hidden}
    header,.toolbar,.footer{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}header{border-bottom:1px solid #29493a}h2{font-size:16px;margin:0 auto 0 0}#status{color:#91ac9a}
    button,input{border:1px solid #365b49;border-radius:6px;background:#173426;color:#e9f7ef;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
    .toolbar input{flex:1;min-width:180px}.editor{display:grid;grid-template-columns:2fr 2fr 100px auto;gap:8px;padding:12px;align-items:end;border-bottom:1px solid #29493a}.editor label{display:grid;gap:4px;min-width:0}.editor input{min-width:0;width:100%}
    .list{max-height:380px;overflow:auto}.row{display:grid;grid-template-columns:minmax(180px,2fr) minmax(180px,2fr) 90px minmax(130px,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #203e30;min-width:700px}.row code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .footer{justify-content:space-between;border-top:1px solid #29493a}small{color:#91ac9a}[hidden]{display:none!important}
    @media(max-width:850px){.editor{grid-template-columns:1fr 1fr}.editor button{grid-column:1/-1}}
  </style>
</head>
<body>
<main>
  <header><h2>Secret 引用</h2><button id="refresh" type="button">刷新</button></header>
  <form id="editor" class="editor">
    <label>引用<input name="secret_ref" placeholder="secret://bot/model" required></label>
    <label>用途<input name="purpose" placeholder="provider.chat-completions.credential" required></label>
    <label>修订<input name="expected_revision" type="number" min="0" value="0" required></label>
    <button type="submit">输入新值并写入</button>
  </form>
  <form id="filter" class="toolbar"><input id="search" placeholder="筛选引用或用途" aria-label="筛选 Secret"><button type="submit">查询</button><small>列表和响应仅显示元数据</small></form>
  <div id="items" class="list"></div>
  <div class="footer"><span id="status">等待连接</span><button id="more" type="button" hidden>下一页</button></div>
</main>
<script>
(()=>{'use strict';
  let port,nonce,sequence=0,pending=new Map(),nextAfter=null,activeSearch='';
  const $=id=>document.getElementById(id),items=$('items'),status=$('status');
  const randomId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
  const send=(type,payload={})=>port?.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});
  const resize=()=>send('resize',{height:Math.min(document.documentElement.scrollHeight,680)});
  const request=(type,operation_id,value,idempotency_key)=>new Promise((resolve,reject)=>{
    const request_id='secret-ui-'+(++sequence);pending.set(request_id,{resolve,reject});
    send(type,{request_id,operation_id,value,...(idempotency_key?{idempotency_key}:{})});
  });
  function row(item){
    const element=document.createElement('div');element.className='row';
    for(const text of [item.secret_ref,item.purpose,`v${item.version} / r${item.revision}`,item.key_id]){
      const cell=document.createElement('code');cell.textContent=text;cell.title=text;element.append(cell);
    }
    const edit=document.createElement('button');edit.type='button';edit.textContent='轮换';
    edit.onclick=()=>{
      const form=$('editor');form.elements.secret_ref.value=item.secret_ref;
      form.elements.purpose.value=item.purpose;
      form.elements.expected_revision.value=item.revision;
      form.querySelector('button').focus();
    };
    element.append(edit);items.append(element);
  }
  async function load(append){
    const search=$('search').value.trim();
    if(!append){items.replaceChildren();nextAfter=null;activeSearch=search;}
    if(append&&search!==activeSearch)return load(false);
    $('more').disabled=true;status.textContent='正在读取…';
    try{
      const page=await request('query','secrets.list',{limit:50,...(activeSearch?{search:activeSearch}:{}),...(append&&nextAfter?{after:nextAfter}:{})});
      for(const item of page.items)row(item);
      nextAfter=page.next_after;$('more').hidden=!nextAfter;
      status.textContent=`已显示 ${items.children.length} 条引用`;resize();
    }catch(error){status.textContent=error.message;}
    finally{$('more').disabled=false;}
  }
  $('editor').onsubmit=async event=>{
    event.preventDefault();const form=event.currentTarget;
    const input={secret_ref:form.elements.secret_ref.value,purpose:form.elements.purpose.value,
      expected_revision:Number(form.elements.expected_revision.value)};
    form.querySelector('button').disabled=true;
    status.textContent='等待宿主输入新值…';
    try{await request('secret-action','secret.put',input,randomId());status.textContent='已写入新版本';await load(false);}
    catch(error){status.textContent=error.message;}
    finally{form.querySelector('button').disabled=false;}
  };
  $('filter').onsubmit=event=>{event.preventDefault();load(false);};
  $('refresh').onclick=()=>load(false);$('more').onclick=()=>load(true);
  addEventListener('message',event=>{
    const message=event.data||{};
    if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;
    port=event.ports[0];nonce=message.nonce;
    port.onmessage=event=>{
      const value=event.data||{};if(value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;
      if(value.type==='initialize'){resize();load(false);return;}
      const entry=pending.get(value.request_id);
      if(entry){pending.delete(value.request_id);if(value.type==='query-result'||value.type==='action-result')entry.resolve(value.value);else entry.reject(Error(value.message||'Secret 操作失败'));}
      else if(value.type==='error')status.textContent=value.message||'Secret 操作失败';
    };
    port.start();send('ready');
  },{once:true});
})();
</script>
</body>
</html>
