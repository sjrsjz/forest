manifest_version = 1
package_id = "forest.provider.chat-completions"
version = "4.4.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "provider:ChatCompletionsProvider"

[[components]]
id = "provider.chat-completions"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
auto_install = true
configuration_apply = "worker-host/1"

[components.bootstrap_contribution]
label = "Chat Completions Provider"
description = "Model endpoint, credential reference, limits, and declared capabilities."
order = 10
schema = "schemas/config.json"
initial_value = "bootstrap.json"

[[components.bootstrap_contribution.secret_refs]]
field = "credential_ref"
purpose = "provider.chat-completions.credential"

[[components.bootstrap_contribution.origins]]
field = "base_url"
schemes = ["http", "https"]

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 128
max_state_inflight = 1
max_owned_tasks = 4
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 120
stop_timeout_s = 10
replacement_facts_schema = "schemas/replacement-facts.json"

[[components.provides]]
name = "provider.profile.bind"
contract = "1.0"
semantics = "read"
input_schema = "schemas/bind-input.json"
output_schema = "schemas/bind-output.json"

[[components.effect_services]]
name = "provider.model.dispatch"
contract = "2.0"
kind = "chat-completions.http"
semantics = "at-most-once"
input_schema = "schemas/dispatch-input.json"
output_schema = "schemas/dispatch-output.json"

[[components.effect_services]]
name = "provider.model.result.lookup"
contract = "1.0"
kind = "chat-completions.result-lookup"
semantics = "read"
input_schema = "schemas/result-lookup-input.json"
output_schema = "schemas/result-lookup-output.json"
