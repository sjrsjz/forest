manifest_version = 1
package_id = "forest.deployment-provisioning"
version = "2.3.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_provisioning:DeploymentProvisioning"

[[components]]
id = "deployment.provisioning"
scope = "deployment"
auto_install = true
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
provides = []

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 1
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 750
stop_timeout_s = 10

[components.capabilities]
requests = [
  "service.call:deployment.provisioning.materialize",
]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "deployment.provisioning.workspace"
label = "Bot 供应"
group = "deployment"
order = 30
bootstrap_catalog_query = "provisioning.bootstrap-catalog"

[[components.effect_services]]
name = "deployment.provisioning.materialize"
contract = "1.0"
kind = "deployment.provisioning-materializer"
semantics = "idempotent"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/materialize-output.json"

[[components.owned_work_handlers]]
name = "deployment.provisioning.execute"
contract = "1.0"
authority = "kernel"
handler = "deployment.provisioning.execute"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/materialize-output.json"
max_concurrency = 1
poll_interval_ms = 1000
claim_timeout_s = 10
handler_timeout_s = 600
settle_timeout_s = 20
lease_seconds = 120
renew_interval_s = 30
renew_timeout_s = 10

[[components.kernel_queries]]
name = "deployment.provisioning.jobs.page"
contract = "1.0"
kind = "deployment.provisioning-jobs-page"
input_schema = "schemas/jobs-page-input.json"
output_schema = "schemas/jobs-page-output.json"

[[components.kernel_queries]]
name = "deployment.provisioning.bootstrap.catalog"
contract = "1.0"
kind = "deployment.bootstrap-catalog"
input_schema = "schemas/bootstrap-catalog-input.json"
output_schema = "schemas/bootstrap-catalog-output.json"

[[components.kernel_commands]]
name = "deployment.provisioning.storage-create"
contract = "1.0"
kind = "deployment.storage-create"
input_schema = "schemas/storage-input.json"
output_schema = "schemas/storage-output.json"

[[components.kernel_commands]]
name = "deployment.provisioning.bootstrap-create"
contract = "1.0"
kind = "deployment.bootstrap-create"
input_schema = "schemas/bootstrap-input.json"
output_schema = "schemas/bootstrap-output.json"

[[components.kernel_commands]]
name = "deployment.provisioning.enqueue"
contract = "1.0"
kind = "deployment.provisioning-enqueue"
input_schema = "schemas/enqueue-input.json"
output_schema = "schemas/job-output.json"

[[components.kernel_commands]]
name = "deployment.provisioning.cancel"
contract = "1.0"
kind = "deployment.provisioning-cancel"
input_schema = "schemas/cancel-input.json"
output_schema = "schemas/job-output.json"

[[components.kernel_commands]]
name = "deployment.provisioning.reconcile"
contract = "1.0"
kind = "deployment.provisioning-reconcile"
input_schema = "schemas/reconcile-input.json"
output_schema = "schemas/job-output.json"

[[components.management_queries]]
id = "provisioning.jobs.list"
port = "deployment.provisioning.jobs.page"
default_limit = 50
max_limit = 100
timeout_s = 10

[[components.management_queries]]
id = "provisioning.bootstrap-catalog"
port = "deployment.provisioning.bootstrap.catalog"
default_limit = 64
max_limit = 64
timeout_s = 10

[[components.management_actions]]
id = "storage.create"
port = "deployment.provisioning.storage-create"
priority = "P0"
timeout_s = 15

[[components.management_actions]]
id = "bootstrap.create"
port = "deployment.provisioning.bootstrap-create"
priority = "P0"
timeout_s = 20

[[components.management_actions]]
id = "provisioning.enqueue"
port = "deployment.provisioning.enqueue"
priority = "P0"
timeout_s = 15

[[components.management_actions]]
id = "provisioning.cancel"
port = "deployment.provisioning.cancel"
priority = "P0"
timeout_s = 15

[[components.management_actions]]
id = "provisioning.reconcile"
port = "deployment.provisioning.reconcile"
priority = "P0"
timeout_s = 30
