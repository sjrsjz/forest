<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;color:#dcebe2;background:#0d1712}*{box-sizing:border-box}body{margin:0;padding:10px}main{border:1px solid #29493a;border-radius:9px;background:#102019;overflow:hidden}header,.tabs,.toolbar,.footer{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}header{border-bottom:1px solid #29493a}h2{font-size:16px;margin:0 auto 0 0}small,#status{color:#91ac9a}button,input,select{border:1px solid #365b49;border-radius:6px;background:#173426;color:#e9f7ef;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:grid;gap:4px;min-width:0}input,select{width:100%;min-width:0}.tabs{border-bottom:1px solid #29493a}.tabs button[aria-selected=true]{background:#357c5f;color:white}.panel{padding:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:9px;align-items:end;max-width:1100px}.grid button{height:36px}.toolbar{padding:0 0 10px}.toolbar input{width:220px}.list{max-height:340px;overflow:auto}.row{display:grid;grid-template-columns:minmax(180px,2fr) minmax(120px,1fr) 110px 75px 120px 120px;gap:8px;align-items:center;padding:8px;border-top:1px solid #29493a;min-width:760px}.row code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.footer{justify-content:space-between;border-top:1px solid #29493a}[hidden]{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(130px,1fr))}}
</style></head><body><main>
<header><h2>Bot 供应</h2><span id="status" role="status">等待连接</span><button id="refresh" type="button">刷新任务</button></header>
<nav class="tabs" aria-label="供应步骤"><button type="button" data-tab="jobs" aria-selected="true">任务</button><button type="button" data-tab="storage">存储</button><button type="button" data-tab="bootstrap">模块配置</button><button type="button" data-tab="enqueue">创建任务</button></nav>
<section class="panel" data-panel="jobs"><form id="filter" class="toolbar"><input name="bot_id" placeholder="Bot ID 精确筛选" aria-label="Bot ID"><select name="state" aria-label="任务状态"><option value="">全部状态</option><option>QUEUED</option><option>RUNNING</option><option>RETRY_WAIT</option><option>BLOCKED_UNKNOWN</option><option>SUCCEEDED</option><option>FAILED</option><option>CANCELLED</option></select><button>查询</button></form><div id="items" class="list"></div><div class="footer"><span id="job-count">等待连接</span><button id="more" type="button" hidden>下一页</button></div></section>
<section class="panel" data-panel="storage" hidden><form id="storage" class="grid"><label>Bot ID<input name="bot_id" required></label><label>Storage Profile Ref<input name="profile_ref" value="storage-profile/" required></label><label>Storage Generation<input name="storage_generation" type="number" min="1" value="1" required></label><label>DSN Secret Ref<input name="dsn_secret_ref" value="secret://" required></label><button type="submit">创建本地存储</button></form><p><small>本地模式由内核生成专用数据库与凭据。外部 DSN 请先在 Secret 模块登记，再使用 storage.create 管理动作。</small></p></section>
<section class="panel" data-panel="bootstrap" hidden><form id="bootstrap" class="grid"><label>Bot ID<input name="bot_id" required></label><label>Bootstrap Profile Ref<input name="profile_ref" value="bootstrap-profile/" required></label><label>Storage Profile Ref<input name="storage_profile_ref" value="storage-profile/" required></label><label>Storage Generation<input name="storage_generation" type="number" min="1" value="1" required></label><button id="edit-components" type="button">编辑模块设置</button><button type="submit">冻结配置</button></form><p><small id="component-status">先打开模块设置。每个模块有自己的配置 UI；凭据需先在 Secret 模块登记。</small></p></section>
<section class="panel" data-panel="enqueue" hidden><form id="enqueue" class="grid"><label>Job ID<input name="job_id" value="provisioning/" required></label><label>Bot ID<input name="bot_id" required></label><label>显示名称<input name="display_name" required></label><label>Storage Profile Ref<input name="storage_profile_ref" value="storage-profile/" required></label><label>Storage Generation<input name="storage_generation" type="number" min="1" value="1" required></label><label>Bootstrap Profile Ref<input name="bootstrap_profile_ref" value="bootstrap-profile/" required></label><label>最多尝试<input name="max_attempts" type="number" min="1" max="20" value="3" required></label><button type="submit">创建任务</button></form></section>
</main><script>
(()=>{'use strict';let port,nonce,sequence=0,after=null,filter={},components=null;const pending=new Map();const $=id=>document.getElementById(id);const send=(type,payload={})=>port?.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});const resize=()=>send('resize',{height:Math.min(document.documentElement.scrollHeight,740)});const request=(type,operation_id,value,idempotency_key)=>new Promise((resolve,reject)=>{const request_id='provisioning-ui-'+(++sequence);pending.set(request_id,{resolve,reject});send(type,{request_id,operation_id,value,...(idempotency_key?{idempotency_key}:{})});});const action=(id,value)=>request('action',id,value,randomId());const status=text=>{$('status').textContent=text;};const formValue=form=>Object.fromEntries(new FormData(form));
const randomId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
function jobRow(job){const row=document.createElement('div');row.className='row';for(const value of [job.job_id,job.bot_id,job.state,`#${job.attempt_no}`,job.last_error_code||'—']){const cell=document.createElement('code');cell.textContent=value;row.append(cell);}const controls=document.createElement('span');controls.style.display='flex';controls.style.gap='4px';const cancel=document.createElement('button');cancel.type='button';cancel.textContent='取消';cancel.disabled=!['QUEUED','RETRY_WAIT'].includes(job.state);cancel.onclick=async()=>{cancel.disabled=true;try{await action('provisioning.cancel',{job_id:job.job_id,expected_revision:job.revision});await load(false);}catch(error){status(error.message);cancel.disabled=false;}};controls.append(cancel);if(job.state==='BLOCKED_UNKNOWN'){const reconcile=document.createElement('button');reconcile.type='button';reconcile.textContent='核对物化';reconcile.title='仅在 Bot 库已有准确完成回执时发布 READY';reconcile.onclick=async()=>{reconcile.disabled=true;try{await action('provisioning.reconcile',{job_id:job.job_id,expected_revision:job.revision});await load(false);}catch(error){status(error.message);reconcile.disabled=false;}};controls.append(reconcile);}row.append(controls);return row;}
async function load(append){if(!append){after=null;const values=formValue($('filter'));filter={...(values.bot_id.trim()?{bot_id:values.bot_id.trim()}:{}),...(values.state?{state:values.state}:{})};$('items').replaceChildren();}$('job-count').textContent='正在读取…';$('more').disabled=true;try{const page=await request('query','provisioning.jobs.list',{limit:50,...filter,...(append&&after?{after}:{})});for(const item of page.items)$('items').append(jobRow(item));after=page.next_after;$('more').hidden=!after;$('job-count').textContent=`已显示 ${$('items').children.length} 条任务`;resize();}catch(error){status(error.message);}finally{$('more').disabled=false;}}
for(const tab of document.querySelectorAll('[data-tab]'))tab.onclick=()=>{for(const item of document.querySelectorAll('[data-tab]'))item.setAttribute('aria-selected',String(item===tab));for(const panel of document.querySelectorAll('[data-panel]'))panel.hidden=panel.dataset.panel!==tab.dataset.tab;resize();};
$('filter').onsubmit=event=>{event.preventDefault();load(false);};$('refresh').onclick=()=>load(false);$('more').onclick=()=>load(true);
$('edit-components').onclick=async()=>{const button=$('edit-components');button.disabled=true;try{components=await request('bootstrap-editors-open','provisioning.bootstrap-catalog',{});$('component-status').textContent=`已编辑 ${Object.keys(components).length} 个模块`;resize();}catch(error){$('component-status').textContent=error.message;}finally{button.disabled=false;}};
$('storage').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;try{const value=formValue(form);value.storage_generation=Number(value.storage_generation);await action('storage.create-local',value);status('Storage Profile 已创建');}catch(error){status(error.message);}finally{button.disabled=false;}};
$('bootstrap').onsubmit=async event=>{event.preventDefault();if(!components){$('component-status').textContent='先编辑模块设置';return;}const form=event.currentTarget,button=form.querySelector('[type=submit]');button.disabled=true;try{const value=formValue(form);value.storage_generation=Number(value.storage_generation);value.components=components;await action('bootstrap.create',value);status('Bootstrap Profile 已冻结');}catch(error){status(error.message);}finally{button.disabled=false;}};
$('enqueue').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('[type=submit]');button.disabled=true;try{const value=formValue(form);value.storage_generation=Number(value.storage_generation);value.max_attempts=Number(value.max_attempts);await action('provisioning.enqueue',value);status('任务已入队');document.querySelector('[data-tab="jobs"]').click();await load(false);}catch(error){status(error.message);}finally{button.disabled=false;}};
addEventListener('message',event=>{const message=event.data||{};if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;port=event.ports[0];nonce=message.nonce;port.onmessage=event=>{const value=event.data||{};if(value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;if(value.type==='initialize'){status('已连接');resize();load(false);return;}const entry=pending.get(value.request_id);if(entry){pending.delete(value.request_id);if(['query-result','action-result','bootstrap-editors-result'].includes(value.type))entry.resolve(value.value);else entry.reject(Error(value.message||'操作失败'));}else if(value.type==='error')status(value.message||'操作失败');};port.start();send('ready');},{once:true});
})();
</script></body></html>
