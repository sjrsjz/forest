manifest_version = 1
package_id = "forest.routing-graph"
version = "2.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "routing_graph:RoutingGraph"

[[components]]
id = "routing.graph"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 256
max_state_inflight = 32
max_owned_tasks = 32
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 15
drain_timeout_s = 180
stop_timeout_s = 10

[components.capabilities]
requests = [
  "domain.command:routing-directory.synchronize",
  "domain.command:routing-directory.cleanup",
  "domain.command:events.publish",
  "domain.command:component-jobs.schedule"
]

[[components.contribution_directories]]
kind = "routing-routes"
max_execution_timeout_s = 120
synchronization_command = "routing-directory.synchronize"
cleanup_command = "routing-directory.cleanup"

[[components.provides]]
name = "routing.event.publish"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/event-publish-input.json"
output_schema = "schemas/event-publish-output.json"

[[components.provides]]
name = "routing.component-job.schedule"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/job-schedule-input.json"
output_schema = "schemas/job-schedule-output.json"

[components.storage]
schema_id = "forest.routing.graph"
schema_version = "2.0.0"
baseline = "schema/routing_graph.sql"
baseline_sha256 = "b5c9ecaff35e6bff6974d0ec172a56e775a17de7e947cd55869db3ea8df6eb79"
scope = "bot"
repository_contract = "forest.routing-graph.repository/2"
execution_profile = "official"

[[components.domain_commands]]
name = "routing-directory.synchronize"
contract = "1.0"
function = "routing_directory_synchronize"
input_schema = "schemas/routing-directory.json"
output_schema = "schemas/routing-directory-output.json"

[[components.domain_commands]]
name = "routing-directory.cleanup"
contract = "1.0"
function = "routing_directory_cleanup"
input_schema = "schemas/directory-cleanup-input.json"
output_schema = "schemas/directory-cleanup-output.json"

[[components.domain_commands]]
name = "events.publish"
contract = "1.0"
function = "event_publish"
input_schema = "schemas/event-publish-input.json"
output_schema = "schemas/event-publish-output.json"

[[components.domain_commands]]
name = "component-jobs.schedule"
contract = "1.0"
function = "component_job_schedule"
input_schema = "schemas/job-schedule-input.json"
output_schema = "schemas/job-schedule-output.json"

[[components.owned_work_handlers]]
name = "routing.event-delivery"
contract = "1.0"
handler = "routing.event-delivery.execute"
claim_function = "event_delivery_claim"
settle_function = "event_delivery_settle"
input_schema = "schemas/event-delivery-work.json"
output_schema = "schemas/event-delivery-output.json"
max_concurrency = 8
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 130
settle_timeout_s = 10
lease_seconds = 150

[[components.owned_work_handlers]]
name = "routing.component-job"
contract = "1.0"
handler = "routing.component-job.execute"
claim_function = "component_job_claim"
settle_function = "component_job_settle"
input_schema = "schemas/component-job-work.json"
output_schema = "schemas/component-job-output.json"
max_concurrency = 8
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 130
settle_timeout_s = 10
lease_seconds = 150
