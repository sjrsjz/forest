manifest_version = 1
package_id = "forest.host-storage"
version = "0.9.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "host_storage:HostStorage"

[[components]]
id = "host.storage"
scope = "host"
auto_install = true
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 2
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 300
stop_timeout_s = 10

[components.capabilities]
requests = [
  "domain.query:host.storage.generations.read",
  "domain.command:host.storage.reserve-record",
  "domain.command:host.storage.realize-record",
  "domain.command:host.storage.materialization-enqueue-record",
  "domain.query:host.storage.materialization-status-read",
  "domain.query:host.storage.resource-read",
  "domain.command:host.storage.reference-pin-record",
  "domain.command:host.storage.reference-release-record",
  "service.call:host.storage.postgres.materialize",
  "domain.command:host.storage.reclaim-enqueue-record",
  "domain.command:host.storage.reclaim-finish-record",
  "domain.query:host.storage.reclaim-status-read",
  "service.call:host.storage.postgres.reclaim",
]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "host.storage.workspace"
label = "Host 物理存储"
group = "host"
order = 10

[[components.provides]]
name = "host.storage.generations"
contract = "1.0"
semantics = "read"
visibility = "management"
input_schema = "schemas/generations-input.json"
output_schema = "schemas/generations-output.json"

[[components.provides]]
name = "host.storage.reserve"
contract = "1.0"
semantics = "idempotent"
visibility = "public"
internal_command = "host.storage.reserve-record"
input_schema = "schemas/reserve-input.json"
output_schema = "schemas/reserve-output.json"

[[components.effect_services]]
name = "host.storage.postgres.materialize"
contract = "1.0"
kind = "host.postgresql-materializer"
semantics = "idempotent"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/materialize-output.json"

[[components.effect_services]]
name = "host.storage.postgres.reclaim"
contract = "1.0"
kind = "host.postgresql-reclaimer"
semantics = "idempotent"
input_schema = "schemas/reclaim-input.json"
output_schema = "schemas/reclaim-physical-output.json"

[[components.provides]]
name = "host.storage.materialization.enqueue"
contract = "1.0"
semantics = "idempotent"
visibility = "public"
internal_command = "host.storage.materialization-enqueue-record"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/materialization-enqueue-output.json"

[[components.provides]]
name = "host.storage.materialization.status"
contract = "1.0"
semantics = "read"
visibility = "public"
input_schema = "schemas/resource-lookup-input.json"
output_schema = "schemas/materialization-enqueue-output.json"

[[components.provides]]
name = "host.storage.resource"
contract = "1.0"
semantics = "read"
visibility = "public"
input_schema = "schemas/resource-lookup-input.json"
output_schema = "schemas/resource-lookup-output.json"

[[components.provides]]
name = "host.storage.reference.pin"
contract = "1.0"
semantics = "idempotent"
visibility = "public"
internal_command = "host.storage.reference-pin-record"
input_schema = "schemas/reference-pin-input.json"
output_schema = "schemas/reference-pin-output.json"

[[components.provides]]
name = "host.storage.reference.release"
contract = "1.0"
semantics = "idempotent"
visibility = "public"
allowed_callers = ["deployment.storage-bridge"]
internal_command = "host.storage.reference-release-record"
input_schema = "schemas/reference-release-input.json"
output_schema = "schemas/reference-release-output.json"

[[components.provides]]
name = "host.storage.reclaim.enqueue"
contract = "1.0"
semantics = "idempotent"
visibility = "public"
allowed_callers = ["deployment.storage-bridge"]
internal_command = "host.storage.reclaim-enqueue-record"
input_schema = "schemas/reference-release-output.json"
output_schema = "schemas/reclaim-work-output.json"

[[components.provides]]
name = "host.storage.reclaim.status"
contract = "1.0"
semantics = "read"
visibility = "public"
input_schema = "schemas/resource-lookup-input.json"
output_schema = "schemas/reclaim-work-output.json"

[components.storage]
schema_id = "forest.host.storage"
schema_version = "1.7.0"
baseline = "schema/storage.sql"
baseline_sha256 = "346e5d763cbd76e9e20f6b7a7d0bd145b90e5ce26aad44e9314ff6d8c54c7901"
scope = "host"
repository_contract = "forest.host-storage.repository/1"
execution_profile = "official"

[[components.domain_queries]]
name = "host.storage.generations.read"
contract = "1.0"
function = "host_storage_generations"
input_schema = "schemas/generations-input.json"
output_schema = "schemas/generations-output.json"

[[components.domain_queries]]
name = "host.storage.materialization-status-read"
contract = "1.0"
function = "host_storage_materialization_status"
input_schema = "schemas/resource-lookup-input.json"
output_schema = "schemas/materialization-enqueue-output.json"

[[components.domain_queries]]
name = "host.storage.resource-read"
contract = "1.0"
function = "host_storage_resource"
input_schema = "schemas/resource-lookup-input.json"
output_schema = "schemas/resource-lookup-output.json"

[[components.domain_queries]]
name = "host.storage.reclaim-status-read"
contract = "1.0"
function = "host_storage_reclaim_status"
input_schema = "schemas/resource-lookup-input.json"
output_schema = "schemas/reclaim-work-output.json"

[[components.domain_commands]]
name = "host.storage.reserve-record"
contract = "1.0"
function = "host_storage_reserve"
input_schema = "schemas/reserve-input.json"
output_schema = "schemas/reserve-output.json"

[[components.domain_commands]]
name = "host.storage.realize-record"
contract = "1.0"
function = "host_storage_realize"
input_schema = "schemas/materialize-output.json"
output_schema = "schemas/realize-output.json"

[[components.domain_commands]]
name = "host.storage.materialization-enqueue-record"
contract = "1.0"
function = "host_storage_enqueue_materialization"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/materialization-enqueue-output.json"

[[components.domain_commands]]
name = "host.storage.reference-pin-record"
contract = "1.0"
function = "host_storage_pin_reference"
input_schema = "schemas/reference-pin-input.json"
output_schema = "schemas/reference-pin-output.json"

[[components.domain_commands]]
name = "host.storage.reference-release-record"
contract = "1.0"
function = "host_storage_release_reference"
input_schema = "schemas/reference-release-input.json"
output_schema = "schemas/reference-release-output.json"

[[components.domain_commands]]
name = "host.storage.reclaim-enqueue-record"
contract = "1.0"
function = "host_storage_enqueue_reclamation"
input_schema = "schemas/reference-release-output.json"
output_schema = "schemas/reclaim-work-output.json"

[[components.domain_commands]]
name = "host.storage.reclaim-finish-record"
contract = "1.0"
function = "host_storage_finish_reclamation"
input_schema = "schemas/reclaim-physical-output.json"
output_schema = "schemas/reclaim-finish-output.json"

[[components.owned_work_handlers]]
name = "host.storage.materialize"
contract = "1.0"
handler = "host.storage.materialize"
private_commands = ["host.storage.realize-record"]
claim_function = "host_storage_claim_materialization"
settle_function = "host_storage_settle_materialization"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/realize-output.json"
max_concurrency = 1
poll_interval_ms = 1000
claim_timeout_s = 10
handler_timeout_s = 240
settle_timeout_s = 10
lease_seconds = 270

[[components.owned_work_handlers]]
name = "host.storage.reclaim"
contract = "1.0"
handler = "host.storage.reclaim"
private_commands = ["host.storage.reclaim-finish-record"]
claim_function = "host_storage_claim_reclamation"
settle_function = "host_storage_settle_reclamation"
input_schema = "schemas/reclaim-input.json"
output_schema = "schemas/reclaim-finish-output.json"
max_concurrency = 1
poll_interval_ms = 1000
claim_timeout_s = 10
handler_timeout_s = 240
settle_timeout_s = 10
lease_seconds = 270

[[components.management_queries]]
id = "generations"
port = "host.storage.generations"
default_limit = 50
max_limit = 100
timeout_s = 10

[[components.management_queries]]
id = "materialization.status"
port = "host.storage.materialization.status"
timeout_s = 10

[[components.management_queries]]
id = "resource"
port = "host.storage.resource"
timeout_s = 10

[[components.management_queries]]
id = "reclaim.status"
port = "host.storage.reclaim.status"
timeout_s = 10
