<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    *{box-sizing:border-box}body{margin:0;padding:10px}main{border:1px solid #29493a;border-radius:9px;background:#102019;overflow:hidden}
    header,form,footer{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}header{border-bottom:1px solid #29493a}h2{font-size:16px;margin:0 auto 0 0}
    button,input,select{border:1px solid #365b49;border-radius:6px;background:#173426;color:#e9f7ef;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5}
    input{min-width:160px;flex:1}form{border-bottom:1px solid #29493a}.list{max-height:420px;overflow:auto}
    .row{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(150px,1fr) 100px minmax(180px,1fr) 90px;gap:8px;padding:8px 12px;border-top:1px solid #203e30;min-width:750px}
    .row code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer{justify-content:space-between;border-top:1px solid #29493a;color:#91ac9a}
  </style>
</head>
<body>
<main>
  <header><h2>Host 物理存储清单</h2><button id="refresh" type="button">刷新</button></header>
  <form id="filter"><input id="deployment" placeholder="Deployment ID" aria-label="Deployment ID"><input id="bot" placeholder="Bot ID" aria-label="Bot ID"><select id="state" aria-label="状态"><option value="">全部状态</option><option>RESERVED</option><option>ACTIVE</option><option>RETIRED</option><option>DELETED</option></select><button type="submit">查询</button></form>
  <div id="items" class="list"></div>
  <footer><span id="status">等待连接</span><button id="more" type="button" hidden>下一页</button></footer>
</main>
<script>
(()=>{'use strict';
  let port,nonce,sequence=0,pending=new Map(),cursor=null,filter={};
  const $=id=>document.getElementById(id),items=$('items'),status=$('status');
  const send=(type,payload={})=>port?.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});
  const resize=()=>send('resize',{height:Math.min(document.documentElement.scrollHeight,620)});
  const query=value=>new Promise((resolve,reject)=>{const request_id='host-storage-'+(++sequence);pending.set(request_id,{resolve,reject});send('query',{request_id,operation_id:'generations',value});});
  function render(item){const row=document.createElement('div');row.className='row';for(const value of [item.resource_id,item.bot_id,item.state,item.physical_name,'r'+item.revision]){const cell=document.createElement('code');cell.textContent=value;cell.title=String(value);row.append(cell);}items.append(row);}
  async function load(append=false){if(!append){items.replaceChildren();cursor=null;filter={...( $('deployment').value.trim()?{deployment_id:$('deployment').value.trim()}:{}),...( $('bot').value.trim()?{bot_id:$('bot').value.trim()}:{}),...( $('state').value?{state:$('state').value}:{})};}status.textContent='正在读取…';$('more').disabled=true;try{const page=await query({limit:50,...filter,...(append&&cursor?{after:cursor}:{})});page.items.forEach(render);cursor=page.next_after;$('more').hidden=!cursor;status.textContent='已显示 '+items.children.length+' 条已登记资源';resize();}catch(error){status.textContent=error.message;}finally{$('more').disabled=false;}}
  $('filter').onsubmit=event=>{event.preventDefault();load();};$('refresh').onclick=()=>load();$('more').onclick=()=>load(true);
  addEventListener('message',event=>{const message=event.data||{};if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;port=event.ports[0];nonce=message.nonce;port.onmessage=event=>{const value=event.data||{};if(value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;if(value.type==='initialize'){resize();load();return;}const entry=pending.get(value.request_id);if(entry){pending.delete(value.request_id);if(value.type==='query-result')entry.resolve(value.value);else entry.reject(Error(value.message||'查询失败'));}};port.start();send('ready');},{once:true});
})();
</script>
</body>
</html>
