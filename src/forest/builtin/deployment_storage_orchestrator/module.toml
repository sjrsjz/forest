manifest_version = 1
package_id = "forest.deployment-storage-orchestrator"
version = "1.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "deployment_storage_orchestrator:DeploymentStorageOrchestrator"

[[components]]
id = "deployment.storage-orchestrator"
scope = "deployment"
auto_install = true
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
provides = []

[components.resources]
max_frame_bytes = 262144
max_inflight = 4
max_queue_items = 16
max_state_inflight = 2
max_owned_tasks = 2
max_owned_resources = 1

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 300
stop_timeout_s = 10

[components.capabilities]
requests = ["service.call:deployment.storage-orchestrator.advance"]

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "deployment.storage-orchestrator.workspace"
label = "Host 存储"
group = "deployment"
order = 25

[[components.kernel_queries]]
name = "deployment.storage-orchestrator.requests.page"
contract = "1.0"
kind = "deployment.storage-requests-page"
input_schema = "schemas/requests-page-input.json"
output_schema = "schemas/requests-page-output.json"

[[components.kernel_commands]]
name = "deployment.storage-orchestrator.request"
contract = "1.0"
kind = "deployment.storage-request"
input_schema = "schemas/request-input.json"
output_schema = "schemas/request-output.json"

[[components.management_queries]]
id = "storage.requests.page"
port = "deployment.storage-orchestrator.requests.page"
default_limit = 50
max_limit = 100
timeout_s = 10

[[components.management_actions]]
id = "storage.request"
port = "deployment.storage-orchestrator.request"
priority = "P0"
timeout_s = 20

[[components.effect_services]]
name = "deployment.storage-orchestrator.advance"
contract = "1.0"
kind = "deployment.host-storage-advance"
semantics = "idempotent"
input_schema = "schemas/advance-input.json"
output_schema = "schemas/advance-output.json"

[[components.owned_work_handlers]]
name = "deployment.storage-orchestrator.execute"
contract = "1.0"
authority = "kernel"
handler = "deployment.storage-orchestrator.execute"
input_schema = "schemas/advance-input.json"
output_schema = "schemas/advance-output.json"
max_concurrency = 2
poll_interval_ms = 1000
claim_timeout_s = 10
handler_timeout_s = 240
settle_timeout_s = 20
lease_seconds = 120
renew_interval_s = 30
renew_timeout_s = 10
