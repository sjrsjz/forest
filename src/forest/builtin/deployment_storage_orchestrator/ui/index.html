<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;color:#dcebe2;background:#0d1712}*{box-sizing:border-box}body{margin:0;padding:10px}main{border:1px solid #29493a;border-radius:9px;background:#102019}header,.bar{display:flex;align-items:center;gap:8px;padding:9px 12px;flex-wrap:wrap}header{border-bottom:1px solid #29493a}h2{font-size:16px;margin:0 auto 0 0}small,#status{color:#91ac9a}button,input,select{border:1px solid #365b49;border-radius:6px;background:#173426;color:#e9f7ef;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5}label{display:grid;gap:4px;min-width:0}input,select{width:100%;min-width:0}details{border-bottom:1px solid #29493a;padding:10px 12px}summary{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:9px;align-items:end;max-width:1080px;padding-top:10px}.bar{border-bottom:1px solid #29493a}.bar input{width:220px}.list{max-height:360px;overflow:auto}.row{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(160px,1.5fr) 100px 90px minmax(150px,1.4fr);gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #29493a;min-width:760px}.row code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.footer{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-top:1px solid #29493a}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(130px,1fr))}}
</style></head><body><main>
<header><h2>Host 存储请求</h2><span id="status" role="status">等待连接</span><button id="refresh" type="button">刷新</button></header>
<details><summary>创建存储请求</summary><p><small>先在 Secret 模块登记 PostgreSQL role 密码（32–256 个可打印 ASCII 字符）。提交后由 Host 异步建库，完成时自动发布 Storage Profile。</small></p><form id="create" class="grid"><label>Bot ID<input name="bot_id" required></label><label>Storage Generation<input name="storage_generation" type="number" min="1" value="1" required></label><label>Profile Ref<input name="profile_ref" value="storage-profile/" required></label><label>DSN Secret Ref<input name="dsn_secret_ref" value="secret://" required></label><label>Role Password Secret Ref<input name="credential_ref" value="secret://" required></label><button type="submit">提交请求</button></form></details>
<form id="filter" class="bar"><input name="bot_id" placeholder="Bot ID 精确筛选" aria-label="Bot ID"><select name="state" aria-label="请求状态"><option value="">全部状态</option><option>PENDING</option><option>SETTLED</option><option>BLOCKED</option></select><button type="submit">查询</button></form>
<div class="row"><strong>Bot</strong><strong>Profile Ref</strong><strong>状态</strong><strong>尝试</strong><strong>错误</strong></div><div id="items" class="list"></div><div class="footer"><span id="count">等待连接</span><button id="more" type="button" hidden>下一页</button></div>
</main><script>
(()=>{'use strict';let port,nonce,sequence=0,after=null,filter={};const pending=new Map(),$=id=>document.getElementById(id);const send=(type,payload={})=>port?.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});const resize=()=>send('resize',{height:Math.min(document.documentElement.scrollHeight,720)});const request=(type,operation_id,value,idempotency_key)=>new Promise((resolve,reject)=>{const request_id='host-storage-'+(++sequence);pending.set(request_id,{resolve,reject});send(type,{request_id,operation_id,value,...(idempotency_key?{idempotency_key}:{})});});const status=value=>{$('status').textContent=value;};const fields=form=>Object.fromEntries(new FormData(form));const randomId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
function row(item){const element=document.createElement('div');element.className='row';element.title=item.request_id;for(const value of [item.bot_id,item.profile_ref,item.state,String(item.attempt_count),item.last_error_code||'—']){const cell=document.createElement('code');cell.textContent=value;element.append(cell);}return element;}
async function load(append){if(!append){after=null;const values=fields($('filter'));filter={...(values.bot_id.trim()?{bot_id:values.bot_id.trim()}:{}),...(values.state?{state:values.state}:{})};$('items').replaceChildren();}$('more').disabled=true;try{const page=await request('query','storage.requests.page',{limit:50,...filter,...(append&&after?{after}:{})});for(const item of page.items)$('items').append(row(item));after=page.next_after;$('more').hidden=!after;$('count').textContent=`已显示 ${$('items').children.length} 条请求`;resize();}catch(error){status(error.message);}finally{$('more').disabled=false;}}
$('filter').onsubmit=event=>{event.preventDefault();load(false);};$('refresh').onclick=()=>load(false);$('more').onclick=()=>load(true);$('create').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');button.disabled=true;try{const value=fields(form);value.storage_generation=Number(value.storage_generation);const result=await request('action','storage.request',value,randomId());status(`请求已冻结：${result.request_id}`);form.closest('details').open=false;await load(false);}catch(error){status(error.message);}finally{button.disabled=false;resize();}};
addEventListener('message',event=>{const message=event.data||{};if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;port=event.ports[0];nonce=message.nonce;port.onmessage=event=>{const value=event.data||{};if(value.protocol!=='forest.management-ui-channel/1'||value.nonce!==nonce)return;if(value.type==='initialize'){status('已连接');resize();load(false);return;}const entry=pending.get(value.request_id);if(entry){pending.delete(value.request_id);if(['query-result','action-result'].includes(value.type))entry.resolve(value.value);else entry.reject(Error(value.message||'操作失败'));}else if(value.type==='error')status(value.message||'操作失败');};port.start();send('ready');},{once:true});
})();
</script></body></html>
