manifest_version = 1
package_id = "forest.codec.onebot"
version = "1.0.1"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "onebot:OneBotCodec"

[[components]]
id = "codec.onebot"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
configuration_apply = "worker-host/1"

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 128
max_state_inflight = 1
max_owned_tasks = 2
max_owned_resources = 2

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 10
stop_timeout_s = 5

[[components.provides]]
name = "onebot.codec.normalize"
contract = "1.0"
semantics = "read"
input_schema = "schemas/normalize.json"
output_schema = "schemas/normalize-result.json"

[[components.provides]]
name = "onebot.codec.prepare-send"
contract = "1.0"
semantics = "read"
input_schema = "schemas/prepare.json"
output_schema = "schemas/prepare-result.json"
