<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; padding: 12px; color: #d8e9df; background: #102019; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h3 { margin: 0; font-size: 15px; }
    p { margin: 8px 0 12px; color: #9cb7a7; }
    #prompts { display: grid; gap: 8px; }
    .prompt { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
    textarea { box-sizing: border-box; width: 100%; min-height: 72px; resize: vertical;
      border: 1px solid #345846; border-radius: 8px; padding: 8px;
      color: #e7f3eb; background: #0c1812; font: inherit; }
    button { border: 1px solid #42745a; border-radius: 8px; padding: 7px 10px;
      color: #d8f1df; background: #1b3b2b; cursor: pointer; }
    button:hover { background: #29553c; }
  </style>
</head>
<body>
  <header><h3>Agent 核心提示词</h3><button id="add" type="button">添加一段</button></header>
  <p>按顺序注入 Agent 的 system 提示。留空即可使用包内默认行为。</p>
  <div id="prompts"></div>
  <script>
    let port = null;
    const prompts = document.getElementById('prompts');
    function render(values) {
      prompts.replaceChildren();
      for (const value of values) {
        const row = document.createElement('div');
        row.className = 'prompt';
        const input = document.createElement('textarea');
        input.value = value;
        input.setAttribute('aria-label', 'Agent system 提示词');
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '移除';
        remove.onclick = () => row.remove();
        row.append(input, remove);
        prompts.append(row);
      }
    }
    document.getElementById('add').onclick = () => render([
      ...prompts.querySelectorAll('textarea')].map(input => input.value).concat('')
    );
    window.addEventListener('message', event => {
      if (event.data?.protocol !== 'forest.bootstrap-ui.init/1'
        || event.ports.length !== 1 || port !== null) return;
      port = event.ports[0];
      render(Array.isArray(event.data.initial_value?.preset_system)
        ? event.data.initial_value.preset_system : []);
      port.onmessage = message => {
        const request = message.data;
        if (request?.protocol !== 'forest.bootstrap-ui.read/1') return;
        port.postMessage({
          protocol: 'forest.bootstrap-ui.value/1',
          request_id: request.request_id,
          value: {
            protocol: 'forest.agent.runtime.bootstrap/1',
            preset_system: [...prompts.querySelectorAll('textarea')].map(input => input.value),
          },
        });
      };
      port.postMessage({protocol: 'forest.bootstrap-ui.ready/1'});
    });
  </script>
</body>
</html>
