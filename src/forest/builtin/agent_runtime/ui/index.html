<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    body{margin:0;padding:16px}main{max-width:1100px;display:grid;gap:12px}
    h1{font-size:17px;margin:0}p{margin:0;color:#a9c1b2}
    .filters,.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
    label{display:grid;gap:5px;flex:1 1 240px;color:#a9c1b2}
    input,select,button{box-sizing:border-box;padding:9px 11px;border:1px solid #395247;border-radius:8px;background:#13231b;color:inherit;font:inherit}
    input,select{width:100%}button{cursor:pointer;background:#255844}button:disabled{opacity:.5;cursor:default}
    .list{border:1px solid #284036;border-radius:8px;max-height:460px;overflow:auto}
    .item{width:100%;display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(140px,1.2fr) minmax(95px,.6fr) minmax(145px,.8fr);gap:12px;text-align:left;padding:9px 11px;border:0;border-bottom:1px solid #284036;border-radius:0;background:transparent}
    .item:hover,.item:focus-visible{background:#1d3428}.item span{min-width:0;overflow-wrap:anywhere}
    .item small{display:block;color:#a9c1b2}#status{min-height:1.4em}
    .detail{border:1px solid #284036;border-radius:8px;padding:12px}
    dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
    dl div{min-width:0}dt{color:#a9c1b2}dd{margin:3px 0 0;overflow-wrap:anywhere}
    details{margin-top:10px;border-top:1px solid #284036;padding-top:8px}summary{cursor:pointer}
    .step-list{max-height:240px;overflow:auto}.step-list div{padding:7px 0;border-bottom:1px solid #284036;overflow-wrap:anywhere}
    [hidden]{display:none!important}
    @media(max-width:760px){.item{grid-template-columns:1fr 1fr}dl{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main>
    <h1>Agent 执行记录</h1>
    <p>按 Bot、群聊或 Session 追踪执行；列表只展示执行元数据。</p>
    <details id="session-browser">
      <summary>浏览 Session</summary>
      <div class="filters">
        <label>Session 状态<select id="session-state"><option value="">全部</option><option>ACTIVE</option><option>CLOSED</option><option>FAILED</option><option>CANCELLED</option></select></label>
        <button id="search-sessions" type="button">查询 Session</button>
      </div>
      <div class="actions"><span id="session-count"></span><button id="next-sessions" type="button" hidden>下一页</button></div>
      <div class="list" id="sessions"></div>
    </details>
    <div class="filters">
      <label>会话引用<input id="conversation" placeholder="onebot:group:933179609" autocomplete="off"></label>
      <label>Run 状态<select id="state"><option value="">全部</option>
        <option>WAIT_INPUT</option><option>PREPARING_MODEL</option><option>MODEL_PENDING</option>
        <option>PARSING</option><option>REPAIR_READY</option><option>WAIT_TOOL</option>
        <option>WAIT_APPROVAL</option><option>BLOCKED_UNKNOWN</option><option>SAFE_BOUNDARY</option>
        <option>FINAL_READY</option><option>RELOAD_WAIT</option><option>COMPLETED</option>
        <option>FAILED</option><option>CANCELLED</option></select></label>
      <button id="search" type="button">查询</button>
    </div>
    <div class="actions"><span id="session-filter">全部 Session</span><button id="clear-session" type="button" hidden>清除 Session 筛选</button></div>
    <div class="actions"><span id="count"></span><button id="next" type="button" hidden>下一页</button></div>
    <div class="list" id="items" aria-live="polite"></div>
    <section class="detail" id="detail" hidden>
      <div class="actions"><strong>Run 状态</strong><button id="refresh-detail" type="button">刷新</button></div>
      <dl>
        <div><dt>Run / Session</dt><dd id="identity"></dd></div>
        <div><dt>会话</dt><dd id="scope"></dd></div>
        <div><dt>状态 / 错误</dt><dd id="run-state"></dd></div>
        <div><dt>输入 / Checkpoint</dt><dd id="progress"></dd></div>
        <div><dt>当前模型请求</dt><dd id="model-request"></dd></div>
        <div><dt>当前工具调用</dt><dd id="tool-call"></dd></div>
        <div><dt>创建</dt><dd id="created"></dd></div>
        <div><dt>更新</dt><dd id="updated"></dd></div>
        <div><dt>终态</dt><dd id="terminal"></dd></div>
      </dl>
      <details><summary>模型回合</summary><div class="step-list" id="model-turns"></div><button id="more-model-turns" type="button" hidden>更多回合</button></details>
      <details><summary>工具调用</summary><div class="step-list" id="tool-calls"></div><button id="more-tool-calls" type="button" hidden>更多调用</button></details>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script>
  (()=>{'use strict';
    let port,nonce,sequence=0,pageCursor=null,filter={},selectedRun='',selectedSession='';
    let sessionCursor=null,sessionFilter={};
    const stepCursors={MODEL_TURN:null,TOOL_CALL:null};
    const pending=new Map(),el=id=>document.getElementById(id);
    const send=(type,payload={})=>port.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});
    const resize=()=>send('resize',{height:document.documentElement.scrollHeight});
    const call=(operation_id,value)=>new Promise((resolve,reject)=>{
      const request_id=`agent:${++sequence}`;pending.set(request_id,{resolve,reject});
      send('query',{request_id,operation_id,value});
    });
    const status=message=>{el('status').textContent=message||'';resize();};
    function currentFilter(){
      const conversation_ref=el('conversation').value.trim(),state=el('state').value;
      if(conversation_ref.length>256)throw new Error('会话引用过长');
      return {...(conversation_ref?{conversation_ref}:{}),...(selectedSession?{session_id:selectedSession}:{}),...(state?{state}:{})};
    }
    async function loadSessions(next=false){
      if(!next){
        const conversation_ref=el('conversation').value.trim(),state=el('session-state').value;
        if(conversation_ref.length>256)throw new Error('会话引用过长');
        sessionFilter={...(conversation_ref?{conversation_ref}:{}),...(state?{state}:{})};
        sessionCursor=null;el('sessions').replaceChildren();
      }
      const input={...sessionFilter,limit:30};
      if(next&&sessionCursor)Object.assign(input,sessionCursor);
      const page=await call('agent.sessions.page',input);
      for(const row of page.items){
        const item=document.createElement('button');item.type='button';item.className='item';
        for(const value of [row.session_id,row.conversation_ref,row.state,row.updated_at]){
          const cell=document.createElement('span');cell.textContent=value||'—';item.append(cell);
        }
        item.onclick=()=>{
          selectedSession=row.session_id;el('conversation').value=row.conversation_ref;
          el('session-filter').textContent=`Session: ${selectedSession}`;
          el('clear-session').hidden=false;
          load().catch(error=>status(error.message));
        };
        el('sessions').append(item);
      }
      el('session-count').textContent=`本页 ${page.items.length} 条${page.has_more?'，还有后续':''}`;
      sessionCursor=page.has_more?{
        snapshot_at:page.snapshot_at,cursor_filter_digest:page.filter_digest,
        after_created_at:page.next_cursor.created_at,after_session_id:page.next_cursor.session_id,
      }:null;
      el('next-sessions').hidden=!sessionCursor;resize();
    }
    async function load(next=false){
      if(!next){filter=currentFilter();pageCursor=null;el('items').replaceChildren();el('detail').hidden=true;}
      const input={...filter,limit:50};
      if(next&&pageCursor)Object.assign(input,pageCursor);
      const page=await call('agent.runs.page',input);
      for(const row of page.items){
        const item=document.createElement('button');item.type='button';item.className='item';
        for(const value of [row.run_id,row.conversation_ref,row.state,row.updated_at]){
          const cell=document.createElement('span');cell.textContent=value||'—';item.append(cell);
        }
        item.onclick=()=>detail(row.run_id).catch(error=>status(error.message));
        el('items').append(item);
      }
      el('count').textContent=`本页 ${page.items.length} 条${page.has_more?'，还有后续':''}`;
      pageCursor=page.has_more?{
        snapshot_at:page.snapshot_at,cursor_filter_digest:page.filter_digest,
        after_created_at:page.next_cursor.created_at,after_run_id:page.next_cursor.run_id,
      }:null;
      el('next').hidden=!pageCursor;status('');
    }
    async function detail(run_id){
      selectedRun=run_id;
      const row=await call('agent.run',{run_id});
      if(selectedRun!==run_id)return;
      el('identity').textContent=`${row.run_id} / ${row.session_id}`;
      el('scope').textContent=row.conversation_ref;
      el('run-state').textContent=`${row.state}${row.error_code?' / '+row.error_code:''}`;
      el('progress').textContent=`r${row.progress.input_revision} / checkpoint ${row.progress.checkpoint_seq}`;
      el('model-request').textContent=row.current.model_request_id||'—';
      el('tool-call').textContent=row.current.tool_call_id||'—';
      el('created').textContent=row.created_at;
      el('updated').textContent=row.updated_at;
      el('terminal').textContent=row.terminal_at||'—';
      el('detail').hidden=false;resize();
      await loadSteps('MODEL_TURN');
      await loadSteps('TOOL_CALL');
    }
    async function loadSteps(kind,next=false){
      const run_id=selectedRun;
      const prefix=kind==='MODEL_TURN'?'model-turns':'tool-calls';
      if(!next){stepCursors[kind]=null;el(prefix).replaceChildren();}
      const input={run_id,kind,limit:20};
      if(next&&stepCursors[kind])Object.assign(input,stepCursors[kind]);
      const page=await call('agent.steps.page',input);
      if(run_id!==selectedRun)return;
      for(const item of page.items){
        const row=document.createElement('div');
        row.textContent=kind==='MODEL_TURN'
          ?`#${item.step_seq} / ${item.turn_id} / ${item.request_id} / ${item.terminal?'终答':item.thinking_only?'思考':'继续'}`
          :`#${item.step_seq} / ${item.tool_name} / ${item.tool_component_id} / ${item.state}${item.error_code?' / '+item.error_code:''}`;
        el(prefix).append(row);
      }
      stepCursors[kind]=page.has_more?{
        snapshot_at:page.snapshot_at,cursor_filter_digest:page.filter_digest,
        after_step_seq:page.next_cursor.step_seq,
      }:null;
      el('more-'+prefix).hidden=!stepCursors[kind];resize();
    }
    addEventListener('message',event=>{
      const message=event.data||{};
      if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect'||typeof message.nonce!=='string')return;
      port=event.ports[0];nonce=message.nonce;
      port.onmessage=event=>{
        const data=event.data||{};
        if(data.protocol!=='forest.management-ui-channel/1'||data.nonce!==nonce)return;
        if(data.type==='initialize'){load().catch(error=>status(error.message));resize();return;}
        const waiter=pending.get(data.request_id);if(!waiter)return;pending.delete(data.request_id);
        if(data.type==='operation-error')waiter.reject(new Error(data.message||'查询失败'));
        else waiter.resolve(data.value);
      };
      port.start();send('ready');
    },{once:true});
    el('session-browser').ontoggle=()=>{if(el('session-browser').open)loadSessions().catch(error=>status(error.message));};
    el('search-sessions').onclick=()=>loadSessions().catch(error=>status(error.message));
    el('next-sessions').onclick=()=>loadSessions(true).catch(error=>status(error.message));
    el('search').onclick=()=>{
      selectedSession='';el('session-filter').textContent='全部 Session';el('clear-session').hidden=true;
      load().catch(error=>status(error.message));
    };
    el('clear-session').onclick=()=>{
      selectedSession='';el('session-filter').textContent='全部 Session';el('clear-session').hidden=true;
      load().catch(error=>status(error.message));
    };
    el('next').onclick=()=>load(true).catch(error=>status(error.message));
    el('refresh-detail').onclick=()=>detail(selectedRun).catch(error=>status(error.message));
    el('more-model-turns').onclick=()=>loadSteps('MODEL_TURN',true).catch(error=>status(error.message));
    el('more-tool-calls').onclick=()=>loadSteps('TOOL_CALL',true).catch(error=>status(error.message));
    el('conversation').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();el('search').click();}};
  })();
  </script>
</body>
</html>
