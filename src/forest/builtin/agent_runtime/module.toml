manifest_version = 1
package_id = "forest.agent-runtime"
version = "4.53.1"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "agent_runtime:AgentRuntime"

[[components]]
id = "agent.runtime"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
bootstrap_materialization = "bootstrap-materialization.json"
auto_install = true
configuration_apply = "worker-host/1"

[components.bootstrap_contribution]
label = "Agent Runtime"
description = "Optional Bot behavior preset; the Agent core protocol is immutable."
order = 60
schema = "schemas/bootstrap-config.json"
initial_value = "bootstrap-setup.json"
ui_entrypoint = "ui/bootstrap.html"

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 64
max_state_inflight = 16
max_owned_tasks = 16
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 15
replacement_guard_query = "agent.replacement-guard"

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "agent.runtime.workspace"
label = "Agent 执行"
group = "agent"
order = 20

[components.capabilities]
requests = [
  "payload.read",
  "payload.write",
  "service.call:provider.profile.bind",
  "service.call:provider.model.dispatch",
  "service.call:provider.model.result.lookup",
  "service.call:runtime.effect-executor-outcome",
  "service.call:conversation.context.snapshot",
  "service.call:conversation.model-view.plan",
  "service.call:conversation.context.prefill",
  "service.call:media.context.resolve",
  "service.call:memory.query.begin",
  "service.call:memory.query.request",
  "service.call:memory.query.work-status",
  "service.call:memory.query.cancel",
  "domain.query:agent.run-snapshot",
  "domain.query:agent.management-runs-page",
  "domain.query:agent.management-sessions-page",
  "domain.query:agent.management-run-steps-page",
  "domain.query:agent.management-effects-page",
  "domain.query:agent.run-recovery",
  "domain.query:agent.execution-history",
  "domain.query:agent.frozen-model-resume",
  "uow.execute:agent.start-from-conversation",
  "uow.execute:agent.append-run-input",
  "uow.execute:agent.acquire-model-input",
  "uow.execute:agent.park-reload",
  "uow.execute:agent.resume-reload",
  "uow.execute:agent.acquire-run-lease",
  "uow.execute:agent.renew-run-lease",
  "uow.execute:agent.release-run-lease",
  "uow.execute:agent.fail-exhausted-model",
  "uow.execute:agent.fail-unsendable-input",
  "uow.execute:agent.cancel-run",
  "uow.execute:agent.cancel-prepared",
  "uow.execute:agent.expire-run",
  "uow.execute:agent.expire-prepared",
  "uow.execute:agent.block-frozen-model",
  "uow.execute:agent.prepare-model-request",
  "uow.execute:agent.inherit-model-request",
  "uow.execute:agent.recover-prepared-model",
  "uow.execute:agent.prepare-model-effect",
  "uow.execute:agent.handoff-model-effect",
  "uow.execute:agent.observe-model-effect",
  "uow.execute:agent.prepare-tool-effect",
  "uow.execute:agent.prepare-approved-tool-effect",
  "uow.execute:agent.handoff-tool-effect",
  "uow.execute:agent.observe-tool-effect",
  "uow.execute:agent.record-protocol-failure",
  "uow.execute:agent.record-model-turn",
  "uow.execute:agent.request-tool-approval",
  "uow.execute:agent.inspect-tool-approval",
  "uow.execute:agent.finalize-candidate",
]
official_bot_grants = [
  { capability = "provider.invoke", delegable = true },
  { capability = "tool.invoke", delegable = true },
]

