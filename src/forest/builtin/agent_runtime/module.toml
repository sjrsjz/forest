manifest_version = 1
package_id = "forest.agent-runtime"
version = "2.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "agent_runtime:AgentRuntime"

[[components]]
id = "agent.runtime"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 64
max_state_inflight = 16
max_owned_tasks = 16
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 15

[components.capabilities]
requests = [
  "domain.query:agent.run-snapshot",
  "domain.query:agent.run-recovery",
  "uow.execute:agent.start-run",
  "uow.execute:agent.append-run-input",
  "uow.execute:agent.park-reload",
  "uow.execute:agent.resume-reload",
  "uow.execute:agent.acquire-run-lease",
  "uow.execute:agent.renew-run-lease",
  "uow.execute:agent.release-run-lease"
]

[[components.provides]]
name = "agent.protocol.describe"
contract = "1.0"
semantics = "read"
input_schema = "schemas/protocol-describe-input.json"
output_schema = "schemas/protocol-describe-output.json"

[[components.provides]]
name = "agent.run.query"
contract = "1.0"
semantics = "read"
input_schema = "schemas/run-query-input.json"
output_schema = "schemas/run-snapshot-output.json"

[components.storage]
schema_id = "forest.agent.runtime"
schema_version = "1.0.0"
baseline = "schema/agent_runtime.sql"
baseline_sha256 = "f582de189787e30c10a8f4315a1bbf407d3d2e469974cc93d2b20217bcad8e1f"
scope = "bot"
repository_contract = "forest.agent-runtime.repository/1"
execution_profile = "official"

[[components.domain_queries]]
name = "agent.run-snapshot"
contract = "1.0"
function = "agent_run_snapshot"
input_schema = "schemas/run-query-input.json"
output_schema = "schemas/run-snapshot-output.json"

[[components.domain_queries]]
name = "agent.run-recovery"
contract = "1.0"
function = "agent_run_recovery"
input_schema = "schemas/run-query-input.json"
output_schema = "schemas/run-recovery-output.json"

[[components.unit_of_work_participants]]
name = "agent.start-run-record"
contract = "1.0"
function = "agent_start_run"
input_schema = "schemas/start-run-envelope.json"
output_schema = "schemas/run-snapshot-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/config"
owner_component = "agent.runtime"
owner_kind = "module.configuration"
owner_id_path = "/input/config/owner_id"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/preset"
owner_component = "agent.runtime"
owner_kind = "preset.context"
owner_id_path = "/input/preset/owner_id"

[[components.unit_of_work_participants]]
name = "agent.append-run-input-record"
contract = "1.0"
function = "agent_append_run_input"
input_schema = "schemas/append-run-input-envelope.json"
output_schema = "schemas/run-snapshot-output.json"

[[components.unit_of_work_participants]]
name = "agent.park-reload-record"
contract = "1.0"
function = "agent_park_reload"
input_schema = "schemas/park-reload-envelope.json"
output_schema = "schemas/run-snapshot-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/state"
owner_component = "agent.runtime"
owner_kind = "checkpoint.state"
owner_id_path = "/input/state/owner_id"

[[components.unit_of_work_participants]]
name = "agent.complete-run-record"
contract = "1.0"
function = "agent_complete_run"
input_schema = "schemas/complete-run-envelope.json"
output_schema = "schemas/run-snapshot-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/state"
owner_component = "agent.runtime"
owner_kind = "checkpoint.state"
owner_id_path = "/input/state/owner_id"

[[components.unit_of_work_participants]]
name = "agent.start-successor-record"
contract = "1.0"
function = "agent_start_successor"
input_schema = "schemas/start-successor-envelope.json"
output_schema = "schemas/run-snapshot-output.json"

[[components.unit_of_work_participants]]
name = "agent.close-session-record"
contract = "1.0"
function = "agent_close_session"
input_schema = "schemas/close-session-envelope.json"
output_schema = "schemas/close-session-output.json"

[[components.unit_of_work_participants]]
name = "agent.acquire-run-record"
contract = "1.0"
function = "agent_acquire_run"
input_schema = "schemas/acquire-run-envelope.json"
output_schema = "schemas/run-owner-output.json"

[[components.unit_of_work_participants]]
name = "agent.resume-reload-record"
contract = "1.0"
function = "agent_resume_reload"
input_schema = "schemas/reload-resume-envelope.json"
output_schema = "schemas/reload-resume-output.json"

[[components.unit_of_work_participants]]
name = "agent.renew-run-record"
contract = "1.0"
function = "agent_renew_run"
input_schema = "schemas/renew-run-envelope.json"
output_schema = "schemas/run-owner-output.json"

[[components.unit_of_work_participants]]
name = "agent.release-run-record"
contract = "1.0"
function = "agent_release_run"
input_schema = "schemas/release-run-envelope.json"
output_schema = "schemas/release-run-output.json"

[[components.unit_of_work_plans]]
name = "agent.start-run"
contract = "1.0"
input_schema = "schemas/start-run-input.json"
output_schema = "schemas/run-snapshot-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.start-run-record" }
]

[[components.unit_of_work_plans]]
name = "agent.append-run-input"
contract = "1.0"
input_schema = "schemas/append-run-input.json"
output_schema = "schemas/run-snapshot-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.append-run-input-record" }
]

[[components.unit_of_work_plans]]
name = "agent.park-reload"
contract = "1.0"
input_schema = "schemas/park-reload-input.json"
output_schema = "schemas/run-snapshot-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.park-reload-record" }
]

[[components.unit_of_work_plans]]
name = "agent.acquire-run-lease"
contract = "1.0"
input_schema = "schemas/acquire-run-input.json"
output_schema = "schemas/run-owner-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.acquire-run-record" }
]

[[components.unit_of_work_plans]]
name = "agent.resume-reload"
contract = "1.0"
input_schema = "schemas/reload-resume-input.json"
output_schema = "schemas/reload-resume-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.resume-reload-record" }
]

[[components.unit_of_work_plans]]
name = "agent.renew-run-lease"
contract = "1.0"
input_schema = "schemas/renew-run-input.json"
output_schema = "schemas/run-owner-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.renew-run-record" }
]

[[components.unit_of_work_plans]]
name = "agent.release-run-lease"
contract = "1.0"
input_schema = "schemas/release-run-input.json"
output_schema = "schemas/release-run-output.json"
timeout_s = 10
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.release-run-record" }
]

[[components.owned_work_handlers]]
name = "agent.reload-resume.pending"
contract = "1.0"
handler = "agent.reload-resume"
claim_function = "agent_claim_reload_resume"
settle_function = "agent_settle_reload_resume"
input_schema = "schemas/reload-resume-input.json"
output_schema = "schemas/reload-resume-output.json"
max_concurrency = 4
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 15
settle_timeout_s = 5
lease_seconds = 45
drain_policy = "inflight"
