manifest_version = 1
package_id = "forest.vector-index.milvus"
version = "2.3.1"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "vector_index:MilvusVectorIndex"

[[components]]
id = "vector.index"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
configuration_apply = "worker-host/1"
config_immutable_paths = ["/space_id", "/dimensions", "/metric"]
provides = []

[components.resources]
max_frame_bytes = 262144
max_inflight = 64
max_queue_items = 256
max_state_inflight = 1
max_owned_tasks = 2
max_owned_resources = 2

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 30
drain_timeout_s = 120
stop_timeout_s = 15

[components.storage]
schema_id = "forest.vector.index"
schema_version = "2.3.0"
baseline = "schema/baseline.sql"
baseline_sha256 = "3c62d4eb7c198cf86f8e56c9bd2aafddbaf1849dce17226d3230591306a9fad5"
scope = "bot"
repository_contract = "forest.vector-index-refs.repository/1"
execution_profile = "official"

[[components.effect_services]]
name = "vector.index.upsert"
contract = "2.0"
kind = "vector-index.milvus"
semantics = "idempotent"
input_schema = "schemas/upsert-input.json"
output_schema = "schemas/upsert-output.json"

[[components.effect_services]]
name = "vector.index.search"
contract = "2.0"
kind = "vector-index.milvus"
semantics = "read"
input_schema = "schemas/search-input.json"
output_schema = "schemas/search-output.json"

[[components.effect_services]]
name = "vector.index.delete"
contract = "1.0"
kind = "vector-index.milvus"
semantics = "idempotent"
input_schema = "schemas/delete-input.json"
output_schema = "schemas/delete-output.json"
