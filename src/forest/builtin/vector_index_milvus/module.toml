manifest_version = 1
package_id = "forest.vector-index.milvus"
version = "2.13.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "vector_index:MilvusVectorIndex"

[[components]]
id = "vector.index"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
bootstrap_materialization = "bootstrap-materialization.json"
auto_install = true
configuration_apply = "worker-host/1"
config_immutable_paths = ["/space_id", "/dimensions", "/metric"]

[components.bootstrap_contribution]
label = "Milvus Vector Index"
description = "Rebuildable ANN index endpoint bound to the Bot embedding space."
order = 30
schema = "schemas/bootstrap-config.json"
initial_value = "bootstrap-input.json"

[[components.bootstrap_contribution.secret_refs]]
field = "credential_ref"
purpose = "vector.index.credential"
allow_empty = true

[[components.bootstrap_contribution.origins]]
field = "endpoint"
schemes = ["http", "https"]

[components.capabilities]
requests = [
  "payload.read",
  "service.call:vector.transport.upsert",
  "service.call:vector.transport.search",
  "service.call:vector.transport.prune",
  "service.call:vector.transport.audit",
  "domain.command:vector.ref.reserve",
  "domain.command:vector.ref.activate",
  "domain.command:vector.ref.tombstone",
  "domain.command:vector.collection.quarantine",
  "domain.command:vector.audit.adjudicate",
  "domain.query:vector.ref.require-query",
  "domain.query:vector.ref.filter-active",
  "domain.query:vector.ref.change-head",
  "domain.query:vector.ref.change-page"
]

[components.resources]
max_frame_bytes = 262144
max_inflight = 64
max_queue_items = 256
max_state_inflight = 16
max_owned_tasks = 2
max_owned_resources = 2

[components.lifecycle]
replacement_facts_schema = "schemas/replacement-facts.json"
prepare_timeout_s = 10
start_timeout_s = 30
drain_timeout_s = 120
stop_timeout_s = 15

[[components.lifecycle.fact_matches]]
component_id = "embedding.multimodal"
own_pointer = "/space/space_id"
other_pointer = "/space/space_id"

[[components.lifecycle.fact_matches]]
component_id = "embedding.multimodal"
own_pointer = "/space/dimensions"
other_pointer = "/space/dimensions"

[components.storage]
schema_id = "forest.vector.index"
schema_version = "2.12.0"
baseline = "schema/baseline.sql"
baseline_sha256 = "46e2d6c65f516200433a0276a67eadd334abc5a067516ca511b52c1dc41fdf00"
scope = "bot"
repository_contract = "forest.vector-index-refs.repository/1"
execution_profile = "official"

[[components.domain_commands]]
name = "vector.collection.plan"
contract = "1.0"
function = "vector_collection_plan"
input_schema = "schemas/collection-plan-input.json"
output_schema = "schemas/collection-plan-output.json"

[[components.domain_commands]]
name = "vector.collection.confirm"
contract = "1.0"
function = "vector_collection_confirm"
input_schema = "schemas/collection-confirm-input.json"
output_schema = "schemas/collection-plan-output.json"

[[components.domain_commands]]
name = "vector.collection.quarantine"
contract = "1.0"
function = "vector_collection_quarantine"
input_schema = "schemas/collection-quarantine-input.json"
output_schema = "schemas/collection-quarantine-output.json"

[[components.domain_commands]]
name = "vector.audit.adjudicate"
contract = "1.0"
function = "vector_adjudicate_ref_audit"
input_schema = "schemas/audit-adjudicate-input.json"
output_schema = "schemas/audit-adjudicate-output.json"

[[components.domain_commands]]
name = "vector.ref.reserve"
contract = "2.0"
function = "vector_ref_reserve"
input_schema = "schemas/ref-reserve-input.json"
output_schema = "schemas/ref-reserve-output.json"

[[components.domain_commands]]
name = "vector.ref.activate"
contract = "2.0"
function = "vector_ref_activate"
input_schema = "schemas/ref-activate-input.json"
output_schema = "schemas/ref-activate-output.json"

[[components.domain_commands]]
name = "vector.ref.tombstone"
contract = "1.0"
function = "vector_ref_tombstone"
input_schema = "schemas/delete-input.json"
output_schema = "schemas/delete-output.json"

[[components.domain_queries]]
name = "vector.ref.require-query"
contract = "2.0"
function = "vector_ref_require_query"
input_schema = "schemas/search-input.json"
output_schema = "schemas/ref-query-output.json"

[[components.domain_queries]]
name = "vector.ref.filter-active"
contract = "2.0"
function = "vector_ref_filter_active"
input_schema = "schemas/ref-filter-input.json"
output_schema = "schemas/search-output.json"

[[components.domain_queries]]
name = "vector.ref.change-head"
contract = "1.0"
function = "vector_ref_change_head"
input_schema = "schemas/change-head-input.json"
output_schema = "schemas/change-head-output.json"

[[components.domain_queries]]
name = "vector.ref.change-page"
contract = "1.0"
function = "vector_ref_change_page"
input_schema = "schemas/change-page-input.json"
output_schema = "schemas/change-page-output.json"

[[components.owned_work_handlers]]
name = "vector.refs.audit"
contract = "2.0"
handler = "vector.refs.audit"
claim_function = "vector_claim_ref_audit"
settle_function = "vector_settle_ref_audit"
input_schema = "schemas/audit-work-input.json"
output_schema = "schemas/audit-work-output.json"
max_concurrency = 1
poll_interval_ms = 5000
claim_timeout_s = 5
handler_timeout_s = 70
settle_timeout_s = 5
lease_seconds = 90

[[components.owned_work_handlers]]
name = "vector.tombstones.sweep"
contract = "2.0"
handler = "vector.tombstones.sweep"
claim_function = "vector_claim_tombstone_sweep"
settle_function = "vector_settle_tombstone_sweep"
input_schema = "schemas/sweep-input.json"
output_schema = "schemas/delete-output.json"
max_concurrency = 1
poll_interval_ms = 1000
claim_timeout_s = 5
handler_timeout_s = 40
settle_timeout_s = 5
lease_seconds = 60

[[components.provides]]
name = "vector.index.upsert"
contract = "3.0"
semantics = "idempotent"
input_schema = "schemas/upsert-input.json"
output_schema = "schemas/upsert-output.json"

[[components.provides]]
name = "vector.index.search"
contract = "2.0"
semantics = "read"
input_schema = "schemas/search-input.json"
output_schema = "schemas/search-output.json"

[[components.provides]]
name = "vector.index.delete"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/delete-input.json"
output_schema = "schemas/delete-output.json"

[[components.effect_services]]
name = "vector.transport.upsert"
contract = "3.0"
kind = "vector-index.milvus"
startup_commands = ["vector.collection.plan", "vector.collection.confirm", "vector.collection.quarantine"]
runtime_commands = ["vector.collection.quarantine"]
semantics = "idempotent"
input_schema = "schemas/transport-upsert-input.json"
output_schema = "schemas/upsert-output.json"

[[components.effect_services]]
name = "vector.transport.search"
contract = "2.0"
kind = "vector-index.milvus"
startup_commands = ["vector.collection.plan", "vector.collection.confirm", "vector.collection.quarantine"]
runtime_commands = ["vector.collection.quarantine"]
semantics = "read"
input_schema = "schemas/transport-search-input.json"
output_schema = "schemas/search-output.json"

[[components.effect_services]]
name = "vector.transport.audit"
contract = "2.0"
kind = "vector-index.milvus"
startup_commands = ["vector.collection.plan", "vector.collection.confirm", "vector.collection.quarantine"]
runtime_commands = ["vector.collection.quarantine"]
semantics = "read"
input_schema = "schemas/transport-audit-input.json"
output_schema = "schemas/transport-audit-output.json"

[[components.effect_services]]
name = "vector.transport.prune"
contract = "2.0"
kind = "vector-index.milvus"
startup_commands = ["vector.collection.plan", "vector.collection.confirm", "vector.collection.quarantine"]
runtime_commands = ["vector.collection.quarantine"]
semantics = "idempotent"
input_schema = "schemas/transport-prune-input.json"
output_schema = "schemas/delete-output.json"
