manifest_version = 1
package_id = "forest.embedding.multimodal"
version = "2.4.2"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "embedding_provider:MultimodalEmbeddingProvider"

[[components]]
id = "embedding.multimodal"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
configuration_apply = "worker-host/1"
config_immutable_paths = ["/profile"]

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 128
max_state_inflight = 1
max_owned_tasks = 4
max_owned_resources = 4

[components.capabilities]
requests = ["payload.read", "payload.write"]

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 120
stop_timeout_s = 10

[[components.provides]]
name = "embedding.profile.bind"
contract = "1.0"
semantics = "read"
input_schema = "schemas/bind-input.json"
output_schema = "schemas/bind-output.json"

[[components.provides]]
name = "embedding.request.materialize"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/materialize-input.json"
output_schema = "schemas/materialize-output.json"

[[components.effect_services]]
name = "embedding.encode"
contract = "2.0"
kind = "embedding.multimodal.http"
semantics = "at-most-once"
input_schema = "schemas/encode-input.json"
output_schema = "schemas/encode-output.json"
