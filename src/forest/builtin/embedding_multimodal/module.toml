manifest_version = 1
package_id = "forest.embedding.multimodal"
version = "2.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "embedding_provider:MultimodalEmbeddingProvider"

[[components]]
id = "embedding.multimodal"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 128
max_state_inflight = 1
max_owned_tasks = 4
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 120
stop_timeout_s = 10

[components.storage]
schema_id = "forest.embedding.multimodal"
schema_version = "2.0.0"
baseline = "schema/baseline.sql"
baseline_sha256 = "b6ee5b8c08a81ba925606dfcc04c6607cd2d628f4f956944e45a295ec612e3bb"
scope = "bot"
repository_contract = "forest.embedding-identity.repository/1"

[[components.provides]]
name = "embedding.profile.bind"
contract = "1.0"
input_schema = "schemas/bind-input.json"
output_schema = "schemas/bind-output.json"

[[components.effect_services]]
name = "embedding.encode"
contract = "1.0"
kind = "embedding.multimodal.http"
semantics = "at-most-once"
input_schema = "schemas/encode-input.json"
output_schema = "schemas/encode-output.json"
