manifest_version = 1
package_id = "forest.conversation-scheduler"
version = "4.3.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "conversation_scheduler:ConversationScheduler"

[[components]]
id = "conversation.scheduler"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 256
max_state_inflight = 1
max_owned_tasks = 16
max_owned_resources = 2

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 10

[components.capabilities]
requests = [
  "payload.write",
  "service.call:agent.execute",
  "service.call:agent.execution.policy",
  "domain.query:conversation.context-page",
  "uow.execute:conversation.commit-silent-input",
  "uow.execute:conversation.commit-final-reply",
  "uow.execute:conversation.session-handoff",
  "uow.execute:conversation.commit-terminal-run"
]

[[components.requires]]
name = "agent.execute"
contract = ">=2.0,<3.0"
required = true
startup_dependency = true

[[components.requires]]
name = "agent.execution.policy"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.provides]]
name = "conversation.context.snapshot"
contract = "2.0"
semantics = "idempotent"
input_schema = "schemas/context-snapshot-input.json"
output_schema = "schemas/context-snapshot-output.json"

[components.storage]
schema_id = "forest.conversation.scheduler"
schema_version = "4.2.0"
baseline = "schema/conversation_scheduler.sql"
baseline_sha256 = "b5f6dbfabc40f3a415108068116881b6ea460602f3a5174af75fbc702d6b244d"
scope = "bot"
repository_contract = "forest.conversation-scheduler.repository/3"
execution_profile = "official"

[[components.domain_queries]]
name = "conversation.context-page"
contract = "1.0"
function = "conversation_context_page"
input_schema = "schemas/context-page-input.json"
output_schema = "schemas/context-page-output.json"

[[components.unit_of_work_participants]]
name = "conversation.admit-message"
contract = "1.0"
function = "conversation_admit_message"
input_schema = "schemas/admit-envelope.json"
output_schema = "schemas/admit-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/content"
owner_component_path = "/input/source_component_id"
owner_kind_path = "/input/content/owner_kind"
owner_id_path = "/input/content/owner_id"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/author"
owner_component_path = "/input/source_component_id"
owner_kind_path = "/input/author/owner_kind"
owner_id_path = "/input/author/owner_id"

[[components.unit_of_work_participants]]
name = "conversation.complete-classification"
contract = "1.0"
function = "conversation_complete_classification"
input_schema = "schemas/classify-envelope.json"
output_schema = "schemas/classify-output.json"

[[components.unit_of_work_participants]]
name = "conversation.classify-shell-ingress"
contract = "1.0"
function = "conversation_classify_shell_ingress"
input_schema = "schemas/shell-classify-envelope.json"
output_schema = "schemas/classify-output.json"

[[components.unit_of_work_participants]]
name = "conversation.select-input"
contract = "1.0"
function = "conversation_select_input"
input_schema = "schemas/select-input-envelope.json"
output_schema = "schemas/select-input-output.json"

[[components.unit_of_work_participants]]
name = "conversation.prepare-context-compaction"
contract = "1.0"
function = "conversation_prepare_context_compaction"
input_schema = "schemas/compact-prepare-envelope.json"
output_schema = "schemas/compact-prepare-output.json"

[[components.unit_of_work_participants]]
name = "conversation.commit-context-compaction"
contract = "1.0"
function = "conversation_commit_context_compaction"
input_schema = "schemas/compact-commit-envelope.json"
output_schema = "schemas/select-input-output.json"

[[components.unit_of_work_participants]]
name = "conversation.append-final-reply"
contract = "1.0"
function = "conversation_append_final_reply"
input_schema = "schemas/append-final-reply-envelope.json"
output_schema = "schemas/append-final-reply-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/reply"
owner_component = "agent.runtime"
owner_kind = "final.reply"
owner_id_path = "/input/reply/owner_id"

[[components.unit_of_work_participants]]
name = "conversation.terminalize-run"
contract = "1.0"
function = "conversation_terminalize_run"
input_schema = "schemas/terminalize-run-envelope.json"
output_schema = "schemas/terminalize-run-output.json"

[[components.unit_of_work_plans]]
name = "conversation.commit-silent-input"
contract = "1.0"
input_schema = "schemas/commit-input-plan.json"
output_schema = "schemas/select-input-output.json"
timeout_s = 20
steps = [
  { id = "select", component_id = "conversation.scheduler", participant = "conversation.select-input", input_path = "/selection" },
  { id = "prepare", component_id = "conversation.scheduler", participant = "conversation.prepare-context-compaction" },
  { id = "payload", component_id = "kernel.payload", participant = "payload.put-json-from-prior", input_path = "/payload" },
  { id = "commit", component_id = "conversation.scheduler", participant = "conversation.commit-context-compaction" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-archive", input_path = "/memory" }
]

[[components.unit_of_work_plans]]
name = "conversation.commit-final-reply"
contract = "1.0"
input_schema = "schemas/commit-final-reply-plan.json"
output_schema = "schemas/delivery-intent-output.json"
timeout_s = 30
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.commit-final-run-record", input_path = "/agent" },
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.append-final-reply", input_path = "/conversation" },
  { id = "delivery", component_id = "delivery", participant = "delivery.create-chat-intent-uow", input_path = "/delivery", participant_generation_field = "delivery_generation_id" }
]

[[components.unit_of_work_plans]]
name = "conversation.session-handoff"
contract = "1.0"
input_schema = "schemas/session-handoff-plan.json"
output_schema = "schemas/session-handoff-output.json"
timeout_s = 30
steps = [
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.select-input", input_path = "/conversation" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-input-batch", input_path = "/memory" },
  { id = "agent", component_id = "agent.runtime", participant = "agent.handoff-session-record", input_path = "/agent" }
]

[[components.unit_of_work_plans]]
name = "conversation.commit-terminal-run"
contract = "1.0"
input_schema = "schemas/commit-terminal-run-plan.json"
output_schema = "schemas/terminalize-run-output.json"
timeout_s = 20
steps = [
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.terminalize-run", input_path = "/conversation" }
]

[[components.owned_work_handlers]]
name = "conversation.silent-drain.pending"
contract = "1.0"
handler = "conversation.silent-drain"
claim_function = "conversation_claim_silent_drain"
settle_function = "conversation_settle_silent_drain"
input_schema = "schemas/silent-drain-input.json"
output_schema = "schemas/select-input-output.json"
max_concurrency = 16
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 30
settle_timeout_s = 5
lease_seconds = 45
drain_policy = "inflight"

[[components.owned_work_handlers]]
name = "conversation.agent-run.pending"
contract = "1.0"
handler = "conversation.agent-run"
claim_function = "conversation_claim_agent_run"
settle_function = "conversation_settle_agent_run"
input_schema = "schemas/agent-work-input.json"
output_schema = "schemas/agent-work-output.json"
max_concurrency = 16
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 600
settle_timeout_s = 5
lease_seconds = 660
drain_policy = "inflight"
