poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 30
settle_timeout_s = 5
lease_seconds = 45
drain_policy = "inflight"

[[components.owned_work_handlers]]
name = "conversation.context-maintenance.pending"
contract = "1.0"
handler = "conversation.context-maintenance"
claim_function = "conversation_claim_context_maintenance"
settle_function = "conversation_settle_context_maintenance"
input_schema = "schemas/context-maintenance-input.json"
output_schema = "schemas/pre-run-compaction-output.json"
max_concurrency = 2
