manifest_version = 1
package_id = "forest.conversation-scheduler"
version = "4.37.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "conversation_scheduler:ConversationScheduler"

[[components]]
id = "conversation.scheduler"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "bootstrap.json"
auto_install = true
configuration_apply = "worker-host/1"

[components.resources]
max_frame_bytes = 262144
max_inflight = 32
max_queue_items = 256
max_state_inflight = 32
max_owned_tasks = 16
max_owned_resources = 2

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 15
drain_timeout_s = 960
stop_timeout_s = 10

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "conversation.scheduler.workspace"
label = "群会话调度"
group = "conversation"
order = 10

[components.capabilities]
requests = [
  "payload.write",
  "payload.read",
  "domain.command:conversation.media-cost.write",
  "domain.command:conversation.run-view.bind",
  "domain.command:conversation.model-view.publish",
  "service.call:agent.execute",
  "service.call:agent.execution.policy",
  "domain.query:conversation.context-page",
  "domain.query:conversation.model-view.prior",
  "domain.query:conversation.read-requeue-request",
  "uow.execute:conversation.commit-silent-input",
  "uow.execute:conversation.prefill-trigger-input",
  "uow.execute:conversation.compact-before-run",
  "uow.execute:conversation.compact-before-handoff",
  "uow.execute:conversation.commit-final-reply",
  "uow.execute:conversation.session-handoff",
  "uow.execute:conversation.commit-terminal-run",
  "uow.execute:conversation.requeue-run",
  "uow.execute:conversation.settle-trigger-segment"
]

[[components.requires]]
name = "agent.execute"
contract = ">=2.0,<3.0"
required = true
startup_dependency = true

[[components.requires]]
name = "agent.execution.policy"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.provides]]
name = "conversation.media-cost.record"
contract = "2.0"
semantics = "idempotent"
input_schema = "schemas/media-cost-input.json"
output_schema = "schemas/media-cost-output.json"

[[components.provides]]
name = "conversation.context.snapshot"
contract = "7.0"
semantics = "idempotent"
input_schema = "schemas/context-snapshot-input.json"
output_schema = "schemas/context-snapshot-output.json"

[[components.provides]]
name = "conversation.model-view.plan"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/model-view-plan-input.json"
output_schema = "schemas/model-view-publish-output.json"

[[components.provides]]
name = "conversation.context.prefill"
contract = "1.0"
semantics = "idempotent"
input_schema = "schemas/prefill-service-input.json"
output_schema = "schemas/select-input-output.json"

[components.storage]
schema_id = "forest.conversation.scheduler"
schema_version = "4.31.1"
baseline = "schema/conversation_scheduler.sql"
baseline_sha256 = "a581613040c12beb40d14a9609d678ac22626679fcc54ec006c2e1c79a10db02"
scope = "bot"
repository_contract = "forest.conversation-scheduler.repository/3"
execution_profile = "official"

[[components.domain_queries]]
name = "conversation.context-page"
contract = "4.0"
function = "conversation_context_page"
input_schema = "schemas/context-page-input.json"
output_schema = "schemas/context-page-output.json"

[[components.domain_queries]]
name = "conversation.model-view.prior"
contract = "1.0"
function = "conversation_model_view_prior"
input_schema = "schemas/model-view-prior-input.json"
output_schema = "schemas/model-view-prior-output.json"

[[components.domain_queries]]
name = "conversation.read-requeue-request"
contract = "1.0"
function = "conversation_read_requeue_request"
input_schema = "schemas/requeue-request-query-input.json"
output_schema = "schemas/requeue-request-query-output.json"

[[components.domain_queries]]
name = "conversation.list-requeue-candidates"
contract = "1.0"
function = "conversation_list_requeue_candidates"
input_schema = "schemas/requeue-candidates-input.json"
output_schema = "schemas/requeue-candidates-output.json"

[[components.domain_queries]]
name = "conversation.list-claim-anomalies"
contract = "1.0"
function = "conversation_list_claim_anomalies"
input_schema = "schemas/claim-anomalies-input.json"
output_schema = "schemas/claim-anomalies-output.json"

[[components.domain_commands]]
name = "conversation.media-cost.write"
contract = "1.0"
function = "conversation_record_media_cost"
input_schema = "schemas/media-cost-input.json"
output_schema = "schemas/media-cost-output.json"

[[components.domain_commands.payload_refs]]
path = "/payload"
byte_length_path = "/byte_length"
owner_component = "media.capture"
owner_kind = "media.asset"
owner_id_path = "/media_ref"

[[components.domain_commands]]
name = "conversation.run-view.bind"
contract = "1.0"
function = "conversation_bind_run_view_profile"
input_schema = "schemas/run-view-bind-input.json"
output_schema = "schemas/run-view-bind-output.json"

[[components.domain_commands]]
name = "conversation.model-view.publish"
contract = "1.0"
function = "conversation_publish_model_view_plan"
input_schema = "schemas/model-view-publish-input.json"
output_schema = "schemas/model-view-publish-output.json"

[[components.domain_commands.payload_refs]]
path = "/quote"
owner_component = "agent.runtime"
owner_kind = "model.view.quote"
owner_id_path = "/quote_owner_id"

[[components.domain_commands.payload_refs]]
path = "/plan"
owner_component = "conversation.scheduler"
owner_kind = "model.view.plan"
owner_id_path = "/plan_owner_id"

[[components.domain_commands]]
name = "conversation.request-requeue"
contract = "1.0"
function = "conversation_request_requeue"
input_schema = "schemas/requeue-request-action-input.json"
output_schema = "schemas/requeue-request-action-output.json"

[[components.management_queries]]
id = "conversation.requeue.status"
port = "conversation.read-requeue-request"
required_role = "ADMIN"
timeout_s = 10

[[components.management_queries]]
id = "conversation.requeue.candidates"
port = "conversation.list-requeue-candidates"
required_role = "ADMIN"
default_limit = 20
max_limit = 50
timeout_s = 10

[[components.management_queries]]
id = "conversation.claim.anomalies"
port = "conversation.list-claim-anomalies"
required_role = "ADMIN"
default_limit = 20
max_limit = 50
timeout_s = 10

[[components.management_actions]]
id = "conversation.requeue.request"
port = "conversation.request-requeue"
priority = "P1"
actor_field = "requested_by"
timeout_s = 15

[[components.unit_of_work_participants]]
name = "conversation.admit-message"
contract = "1.0"
function = "conversation_admit_message"
input_schema = "schemas/admit-envelope.json"
output_schema = "schemas/admit-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/content"
byte_length_path = "/input/content_byte_length"
owner_component_path = "/input/source_component_id"
owner_kind_path = "/input/content/owner_kind"
owner_id_path = "/input/content/owner_id"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/author"
owner_component_path = "/input/source_component_id"
owner_kind_path = "/input/author/owner_kind"
owner_id_path = "/input/author/owner_id"

[[components.unit_of_work_participants]]
name = "conversation.complete-classification"
contract = "1.0"
function = "conversation_complete_classification"
input_schema = "schemas/classify-envelope.json"
output_schema = "schemas/classify-output.json"

[[components.unit_of_work_participants]]
name = "conversation.classify-shell-ingress"
contract = "1.0"
function = "conversation_classify_shell_ingress"
input_schema = "schemas/shell-classify-envelope.json"
output_schema = "schemas/classify-output.json"

[[components.unit_of_work_participants]]
name = "conversation.select-input"
contract = "1.0"
function = "conversation_select_input"
input_schema = "schemas/select-input-envelope.json"
output_schema = "schemas/select-input-output.json"

[[components.unit_of_work_participants]]
name = "conversation.authorize-run-trigger"
contract = "1.0"
function = "conversation_authorize_run_trigger"
input_schema = "schemas/authorize-run-trigger-envelope.json"
output_schema = "schemas/authorize-run-trigger-output.json"

[[components.unit_of_work_participants]]
name = "conversation.prepare-context-compaction"
contract = "1.0"
function = "conversation_prepare_context_compaction"
input_schema = "schemas/compact-prepare-envelope.json"
output_schema = "schemas/compact-prepare-output.json"

[[components.unit_of_work_participants]]
name = "conversation.commit-context-compaction"
contract = "1.0"
function = "conversation_commit_context_compaction"
input_schema = "schemas/compact-commit-envelope.json"
output_schema = "schemas/compact-commit-output.json"

[[components.unit_of_work_participants]]
name = "conversation.append-final-reply"
contract = "1.0"
function = "conversation_append_final_reply"
input_schema = "schemas/append-final-reply-envelope.json"
output_schema = "schemas/append-final-reply-output.json"

[[components.unit_of_work_participants.payload_refs]]
path = "/input/reply"
byte_length_path = "/input/reply_byte_length"
owner_component = "agent.runtime"
owner_kind = "final.reply"
owner_id_path = "/input/reply/owner_id"

[[components.unit_of_work_participants]]
name = "conversation.terminalize-run"
contract = "1.0"
function = "conversation_terminalize_run"
input_schema = "schemas/terminalize-run-envelope.json"
output_schema = "schemas/terminalize-run-output.json"

[[components.unit_of_work_participants]]
name = "conversation.requeue-run-record"
contract = "1.0"
function = "conversation_requeue_run"
input_schema = "schemas/requeue-run-envelope.json"
output_schema = "schemas/requeue-run-output.json"

[[components.unit_of_work_participants]]
name = "conversation.settle-trigger-segment-record"
contract = "1.0"
function = "conversation_settle_trigger_segment"
input_schema = "schemas/trigger-settle-envelope.json"
output_schema = "schemas/trigger-settle-output.json"

[[components.unit_of_work_plans]]
name = "conversation.compact-before-run"
contract = "1.0"
input_schema = "schemas/pre-run-compaction-input.json"
output_schema = "schemas/pre-run-compaction-output.json"
timeout_s = 20
steps = [
  { id = "prepare", component_id = "conversation.scheduler", participant = "conversation.prepare-context-compaction" },
  { id = "payload", component_id = "kernel.payload", participant = "payload.put-json-from-prior", input_path = "/payload" },
  { id = "commit", component_id = "conversation.scheduler", participant = "conversation.commit-context-compaction" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-archive", input_path = "/memory" }
]

[[components.unit_of_work_plans]]
name = "conversation.compact-before-handoff"
contract = "1.0"
input_schema = "schemas/handoff-compaction-input.json"
output_schema = "schemas/pre-run-compaction-output.json"
timeout_s = 20
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.verify-completed-compaction", input_path = "/anchor" },
  { id = "prepare", component_id = "conversation.scheduler", participant = "conversation.prepare-context-compaction" },
  { id = "payload", component_id = "kernel.payload", participant = "payload.put-json-from-prior", input_path = "/payload" },
  { id = "commit", component_id = "conversation.scheduler", participant = "conversation.commit-context-compaction" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-archive", input_path = "/memory" }
]

[[components.unit_of_work_plans]]
name = "conversation.commit-silent-input"
contract = "1.0"
input_schema = "schemas/commit-input-plan.json"
output_schema = "schemas/select-input-output.json"
timeout_s = 20
steps = [
  { id = "select", component_id = "conversation.scheduler", participant = "conversation.select-input", input_path = "/selection" },
  { id = "prepare", component_id = "conversation.scheduler", participant = "conversation.prepare-context-compaction" },
  { id = "payload", component_id = "kernel.payload", participant = "payload.put-json-from-prior", input_path = "/payload" },
  { id = "commit", component_id = "conversation.scheduler", participant = "conversation.commit-context-compaction" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-archive", input_path = "/memory" }
]

[[components.unit_of_work_plans]]
name = "conversation.prefill-trigger-input"
contract = "1.0"
input_schema = "schemas/prefill-input-plan.json"
output_schema = "schemas/select-input-output.json"
timeout_s = 25
steps = [
  { id = "select", component_id = "conversation.scheduler", participant = "conversation.select-input", input_path = "/selection" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "qualify", component_id = "memory.graph", participant = "memory.qualify-input-batch", input_path = "/qualification" },
  { id = "prepare", component_id = "conversation.scheduler", participant = "conversation.prepare-context-compaction" },
  { id = "payload", component_id = "kernel.payload", participant = "payload.put-json-from-prior", input_path = "/payload" },
  { id = "commit", component_id = "conversation.scheduler", participant = "conversation.commit-context-compaction" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-archive", input_path = "/memory" }
]

[[components.unit_of_work_plans]]
name = "conversation.commit-final-reply"
contract = "1.0"
input_schema = "schemas/commit-final-reply-plan.json"
output_schema = "schemas/delivery-intent-output.json"
timeout_s = 30
steps = [
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "agent", component_id = "agent.runtime", participant = "agent.commit-final-run-record", input_path = "/agent" },
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.append-final-reply", input_path = "/conversation" },
  { id = "memory", component_id = "memory.graph", participant = "memory.associate-final-reply", input_path = "/memory" },
  { id = "delivery", component_id = "delivery", participant = "delivery.create-chat-intent-uow", input_path = "/delivery", participant_generation_field = "delivery_generation_id" }
]

[[components.unit_of_work_plans]]
name = "conversation.session-handoff"
contract = "1.0"
input_schema = "schemas/session-handoff-plan.json"
output_schema = "schemas/session-handoff-output.json"
timeout_s = 30
steps = [
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.select-input", input_path = "/conversation" },
  { id = "payload_epoch", component_id = "kernel.payload", participant = "payload.capture-deletion-epoch", input_path = "/payload_epoch" },
  { id = "memory", component_id = "memory.graph", participant = "memory.qualify-input-batch", input_path = "/memory" },
  { id = "agent", component_id = "agent.runtime", participant = "agent.handoff-session-record", input_path = "/agent" }
]

[[components.unit_of_work_plans]]
name = "conversation.commit-terminal-run"
contract = "1.0"
input_schema = "schemas/commit-terminal-run-plan.json"
output_schema = "schemas/terminalize-run-output.json"
timeout_s = 20
steps = [
  { id = "agent", component_id = "agent.runtime", participant = "agent.verify-terminal-run", input_path = "/conversation" },
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.terminalize-run", input_path = "/conversation" }
]

[[components.unit_of_work_plans]]
name = "conversation.requeue-run"
contract = "1.0"
input_schema = "schemas/requeue-run-plan.json"
output_schema = "schemas/requeue-run-output.json"
timeout_s = 20
steps = [
  { id = "conversation", component_id = "conversation.scheduler", participant = "conversation.requeue-run-record", input_path = "/conversation" },
  { id = "agent", component_id = "agent.runtime", participant = "agent.verify-requeue", input_path = "/agent" }
]

[[components.unit_of_work_plans]]
name = "conversation.settle-trigger-segment"
contract = "1.0"
input_schema = "schemas/trigger-settle-input.json"
output_schema = "schemas/trigger-settle-output.json"
timeout_s = 20
steps = [
  { id = "settle", component_id = "conversation.scheduler", participant = "conversation.settle-trigger-segment-record" }
]

[[components.owned_work_handlers]]
name = "conversation.silent-drain.pending"
contract = "1.0"
handler = "conversation.silent-drain"
claim_function = "conversation_claim_silent_drain"
settle_function = "conversation_settle_silent_drain"
input_schema = "schemas/silent-drain-input.json"
output_schema = "schemas/select-input-output.json"
