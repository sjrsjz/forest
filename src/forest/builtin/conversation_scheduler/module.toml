handler_timeout_s = 30
settle_timeout_s = 5
lease_seconds = 45
drain_policy = "inflight"

[[components.owned_work_handlers]]
name = "conversation.agent-run.pending"
contract = "1.0"
handler = "conversation.agent-run"
claim_function = "conversation_claim_agent_run"
settle_function = "conversation_settle_agent_run"
input_schema = "schemas/agent-work-input.json"
output_schema = "schemas/agent-work-output.json"
max_concurrency = 16
poll_interval_ms = 100
claim_timeout_s = 5
handler_timeout_s = 600
settle_timeout_s = 5
lease_seconds = 660
drain_policy = "inflight"

[[components.owned_work_handlers]]
name = "conversation.trigger-settlement.pending"
contract = "1.0"
handler = "conversation.trigger-settlement"
claim_function = "conversation_claim_trigger_settlement"
settle_function = "conversation_settle_trigger_owned_work"
input_schema = "schemas/trigger-settle-input.json"
output_schema = "schemas/trigger-settle-output.json"
max_concurrency = 4
poll_interval_ms = 250
