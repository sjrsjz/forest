<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    *{box-sizing:border-box}body{margin:0;padding:12px}button,input,select{font:inherit}
    button{border:1px solid #2d604a;border-radius:7px;background:#194432;color:#e5f5eb;padding:6px 10px;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}input,select{border:1px solid #365647;border-radius:7px;background:#0c1b14;color:inherit;padding:7px}
    .bar{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin-bottom:10px}.bar label{display:grid;gap:3px;color:#a9c5b4}
    .bar input{width:180px}.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1.2fr);gap:10px;height:490px}
    section{border:1px solid #29493a;border-radius:9px;background:#102019;min-height:0;overflow:auto}h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid #29493a}
    table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 9px;border-bottom:1px solid #254133;vertical-align:top}th{color:#9dbba9;font-weight:500}
    .id{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.muted{color:#9db5a2}.detail{padding:10px 12px}.facts{display:grid;grid-template-columns:125px 1fr;gap:5px 9px;margin:0 0 14px}.facts dt{color:#a6c0ac}.facts dd{margin:0;overflow-wrap:anywhere}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.form label{display:grid;gap:3px}.form .wide{grid-column:1/-1}.form input,.form select{width:100%}
    #status{min-height:20px;color:#90d8ae;margin:5px 0 8px;overflow-wrap:anywhere}.observations{margin-top:12px}.observation{border-top:1px solid #29493a;padding:7px 0;overflow-wrap:anywhere}
    @media(max-width:760px){.layout{display:block;height:auto}section{height:330px;margin-bottom:10px}.bar input{width:150px}}
  </style>
</head>
<body>
  <div class="bar">
    <label>发送通道<select id="lane"><option value="">全部</option><option>CHAT</option><option>CONTROL</option></select></label>
    <label>准确会话 ID<input id="channel" placeholder="群号或私聊 ID"></label>
    <button id="search">查询 UNKNOWN</button><button id="more">下一页</button>
    <span id="count" class="muted"></span>
  </div>
  <div id="status" role="status"></div>
  <div class="layout">
    <section><h2>待核对发送</h2><table><thead><tr><th>Intent / 通道</th><th>更新时间</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>
    <section><h2>发送证据与结论</h2><div class="detail">
      <dl id="facts" class="facts"><dt>选择</dt><dd>从左侧选择 UNKNOWN Intent。</dd></dl>
      <div class="form">
        <label>核对结论<select id="conclusion"><option value="SENT">确认已发送</option><option value="NOT_APPLIED_RETRY">确认未发送，重新排队</option><option value="NOT_APPLIED_FINAL">确认未发送，终止</option></select></label>
        <label>证据类型<input id="evidence-kind" placeholder="例如 platform-log"></label>
        <label class="wide">可复核证据引用<input id="evidence-ref" placeholder="日志记录 ID、工单 ID 或其他可复核引用"></label>
      </div>
      <button id="resolve" disabled>提交调和结论</button>
      <div class="observations"><strong>观察记录</strong><div id="observations" class="muted">尚未选择。</div></div>
    </div></section>
  </div>
  <script>
  (()=>{'use strict';
    let port,nonce,sequence=0,page=null,selected=null,filterKey='';const pending=new Map();
    const $=id=>document.getElementById(id);
    const send=(type,payload={})=>port.postMessage({protocol:'forest.management-ui-channel/1',type,nonce,...payload});
    const request=(type,operation_id,value,idempotency_key)=>new Promise((resolve,reject)=>{const request_id=`delivery-ui:${++sequence}`;pending.set(request_id,{resolve,reject});send(type,{request_id,operation_id,value,...(idempotency_key?{idempotency_key}:{})});});
    const call=(id,value)=>request('query',id,value);
    const action=(id,value,key)=>request('action',id,value,key);
    const randomId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');
    const status=value=>$('status').textContent=value||'';
    const stamp=value=>value?new Date(value).toLocaleString():'—';
    function filters(){const value={limit:50};if($('lane').value)value.lane_kind=$('lane').value;if($('channel').value.trim())value.channel_ref=$('channel').value.trim();return value;}
    function renderList(items){const rows=$('rows');rows.replaceChildren();for(const item of items){const row=rows.insertRow();const label=row.insertCell();const id=document.createElement('div');id.className='id';id.textContent=item.intent_id;const channel=document.createElement('div');channel.className='muted';channel.textContent=`${item.lane_kind} · ${item.channel_kind} ${item.channel_ref}`;label.append(id,channel);row.insertCell().textContent=stamp(item.updated_at);const button=document.createElement('button');button.textContent='核对';button.onclick=()=>inspect(item.intent_id).catch(e=>status(e.message));row.insertCell().append(button);}if(!items.length){const row=rows.insertRow();row.insertCell().textContent='当前筛选没有 UNKNOWN 记录。';} $('count').textContent=`本页 ${items.length} 条`; $('more').disabled=items.length<50;}
    async function load(next=false){const input=filters(),key=JSON.stringify(input);if(next&&page&&key===filterKey&&page.items.length){const last=page.items.at(-1);input.as_of=page.as_of;input.before_updated_at=last.updated_at;input.before_intent_id=last.intent_id;}const value=await call('delivery.unknown.list',input);page=value;filterKey=key;renderList(value.items);status('');}
    function fact(label,value){const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=value??'—';$('facts').append(dt,dd);}
    async function inspect(intent_id){const value=await call('delivery.unknown.get',{intent_id});selected=value;$('facts').replaceChildren();fact('Intent',value.intent.intent_id);fact('状态',value.intent.state);fact('通道',`${value.intent.lane_kind} · ${value.intent.channel_kind} ${value.intent.channel_ref}`);fact('分片',`${value.part.part_index+1} / ${value.intent.part_count} · ${value.part.state}`);fact('Attempt',`${value.attempt.attempt_id} · ${value.attempt.state}`);fact('Effect',value.attempt.effect_operation_ref);fact('Effect Attempt',value.attempt.effect_attempt_ref);fact('适配器 Generation',value.attempt.adapter_generation_id);fact('错误',value.attempt.error_code);$('resolve').disabled=value.intent.state!=='UNKNOWN'||value.attempt.state!=='UNKNOWN';const box=$('observations');box.replaceChildren();for(const item of value.observations){const div=document.createElement('div');div.className='observation';const evidence=item.evidence_details?` · ${item.evidence_details.kind}: ${item.evidence_details.reference} · ${item.evidence_details.requested_by}`:'';div.textContent=`${stamp(item.observed_at)} · ${item.evidence_kind} · ${item.observed_status} · ${item.accepted?'接受':'冲突'}${evidence}`;box.append(div);}if(!value.observations.length)box.textContent='没有观察记录。';status('');}
    async function resolve(){if(!selected||selected.intent.state!=='UNKNOWN'||selected.attempt.state!=='UNKNOWN')throw Error('请先选择仍为 UNKNOWN 的发送。');const kind=$('evidence-kind').value.trim(),reference=$('evidence-ref').value.trim();if(!kind||!reference)throw Error('证据类型和可复核引用都必须填写。');const choice=$('conclusion').value,statusCode={SENT:'SENT',NOT_APPLIED_RETRY:'RETRYABLE_NOT_APPLIED',NOT_APPLIED_FINAL:'REJECTED_NOT_APPLIED'}[choice];const attempt=selected.attempt;const intent_id=selected.intent.intent_id;const value={work:{intent_id,attempt_id:attempt.attempt_id,effect_operation_ref:attempt.effect_operation_ref},observed_status:statusCode,error_code:choice==='SENT'?null:'DELIVERY_ADMIN_NOT_APPLIED',receipt:null,effect:{protocol:'forest.effect-observe/1',effect_operation_id:attempt.effect_operation_ref,attempt_id:attempt.effect_attempt_ref,observation_operation_id:`delivery-reconcile:${randomId()}`,status:choice==='SENT'?'SUCCEEDED':'NOT_APPLIED',evidence_kind:'reconciliation',evidence_payload:null},evidence:{kind,reference}};$('resolve').disabled=true;try{const result=await action('delivery.unknown.resolve',value,randomId());await inspect(intent_id);await load();status(result.accepted?`调和已提交：${result.state}`:`结论冲突；当前状态 ${result.state}，请重新核对。`);}finally{$('resolve').disabled=selected?.intent.state!=='UNKNOWN'||selected?.attempt.state!=='UNKNOWN';}}
    addEventListener('message',event=>{const message=event.data||{};if(event.source!==parent||!event.ports[0]||message.protocol!=='forest.management-ui-connect/1'||message.type!=='connect')return;port=event.ports[0];nonce=message.nonce;port.onmessage=async event=>{const data=event.data||{};if(data.protocol!=='forest.management-ui-channel/1'||data.nonce!==nonce)return;if(data.type==='initialize'){send('set-draft',{value:{protocol:'forest.delivery/1'}});send('resize',{height:600});load().catch(e=>status(e.message));return;}const waiter=pending.get(data.request_id);if(!waiter)return;pending.delete(data.request_id);if(data.type==='operation-error')waiter.reject(Error(data.message||'操作失败'));else waiter.resolve(data.value);};port.start();send('ready');});
    $('search').onclick=()=>load().catch(e=>status(e.message));$('more').onclick=()=>load(true).catch(e=>status(e.message));$('resolve').onclick=()=>resolve().catch(e=>status(e.message));
  })();
  </script>
</body>
</html>
