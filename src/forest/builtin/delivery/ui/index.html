<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#dcebe2;background:#0d1712}
    *{box-sizing:border-box}body{margin:0;padding:14px}.grid{display:grid;grid-template-columns:minmax(12rem,1fr) minmax(12rem,1fr);gap:12px}
    section{border:1px solid #29493a;border-radius:10px;padding:13px;background:#102019}h2{margin:0 0 5px;font-size:16px}p{margin:4px 0;color:#97b4a4}
    .value{font:13px ui-monospace,monospace;color:#7fe0b5}.wide{grid-column:1/-1}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <div class="grid">
    <section>
      <h2>发送执行器</h2>
      <p>Intent、分片、发送尝试和外部副作用由当前 Delivery 包独占。</p>
    </section>
    <section>
      <h2>协议</h2>
      <p class="value">forest.delivery/1</p>
    </section>
    <section class="wide">
      <h2>生命周期</h2>
      <p>热重载会停止接收新任务，排空已领取工作，再原子发布新 Generation。配置通过本页面所属包提交。</p>
    </section>
  </div>
  <script>
    (() => {
      'use strict';
      const protocol = 'forest.management-ui/1';
      let port = null, nonce = null;
      const send = (type, payload = {}) => port?.postMessage({protocol, nonce, type, ...payload});
      addEventListener('message', event => {
        const message = event.data || {};
        if (event.source !== parent || !event.ports[0] || message.protocol !== protocol || message.type !== 'forest:init' || typeof message.nonce !== 'string') return;
        port = event.ports[0]; nonce = message.nonce;
        send('module:set-draft', {values:{protocol:'forest.delivery/1'}});
        send('module:ready'); send('module:resize', {height:document.documentElement.scrollHeight});
      });
    })();
  </script>
</body>
</html>
