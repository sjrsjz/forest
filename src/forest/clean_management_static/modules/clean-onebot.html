<div class="contribution-view onebot-workbench">
  <aside class="binding-list"><div class="binding-list-head">Bindings</div><div id="binding-items"></div></aside>
  <section class="binding-editor">
    <header><div><strong id="binding-title">OneBot Binding</strong><p id="binding-state"></p></div><button id="binding-save">计划并应用</button></header>
    <div class="binding-facts">
      <label>QQ 账号<input id="binding-self" readonly></label>
      <label>Transport<input id="binding-transport" readonly></label>
      <label>Secret 引用<input id="binding-secret" readonly></label>
      <label>连接错误<input id="binding-error" readonly></label>
      <label class="binding-check"><input id="binding-enabled" type="checkbox">启用连接</label>
      <label class="binding-check"><input id="binding-receive" type="checkbox">接收入站消息</label>
    </div>
    <div class="binding-config">
      <label>端点<input id="binding-endpoint" maxlength="2048"></label>
      <label>超时（秒）<input id="binding-timeout" type="number" min="1" max="120"></label>
      <label>事件缓冲<input id="binding-event-capacity" type="number" min="1" max="4096"></label>
      <label>请求缓冲<input id="binding-pending-capacity" type="number" min="1" max="1024"></label>
    </div>
    <details><summary>代际与连接 fence</summary><pre id="binding-fence"></pre></details>
  </section>
</div>
