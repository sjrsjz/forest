<div class="contribution-view delivery-workbench">
  <section class="delivery-queue">
    <header>
      <div><strong>发送结果待核对</strong><p>只列出越过网络交接边界但结果未知的发送链。</p></div>
      <button id="delivery-refresh" class="quiet" type="button">刷新</button>
    </header>
    <div class="delivery-filters">
      <label>通道<select id="delivery-lane"><option value="">全部</option><option>CHAT</option><option>CONTROL</option></select></label>
      <label>群聊 / 会话<input id="delivery-channel" maxlength="256" placeholder="精确 channel_ref"></label>
      <button id="delivery-search" type="button">查询</button>
    </div>
    <div class="delivery-grid delivery-grid-head"><span>Intent / 通道</span><span>Lane</span><span>Attempt</span><span>更新时间</span><span></span></div>
    <div id="delivery-list" class="delivery-list"></div>
    <footer><button id="delivery-more" class="quiet hidden" type="button">加载更多</button><span id="delivery-count" class="muted"></span></footer>
  </section>
  <section class="delivery-detail">
    <header><div><strong>不可变证据链</strong><p>Intent → Part → Attempt → Effect 及历次观察记录。</p></div></header>
    <pre id="delivery-detail">选择一条记录查看详情。</pre>
  </section>
  <section class="delivery-resolve">
    <header><div><strong>提交核对结论</strong><p>只有已核实的外部证据才能解除 UNKNOWN。</p></div></header>
    <div class="delivery-form">
      <label>结论<select id="delivery-resolution"><option value="SENT">已发送</option><option value="NOT_APPLIED_RETRY">确认未发送，重新排队</option><option value="NOT_APPLIED_FINAL">确认未发送，终止该 Intent</option></select></label>
      <label>证据来源<select id="delivery-source-kind"><option value="PROVIDER_QUERY">Provider 查询</option><option value="PLATFORM_OBSERVATION">平台侧观察</option><option value="OPERATOR_OBSERVATION">管理员人工核对</option></select></label>
      <label class="wide">证据引用<input id="delivery-source-ref" maxlength="1024" placeholder="查询单号、平台消息 ID 或审计记录引用"></label>
      <label class="wide">备注<textarea id="delivery-note" maxlength="4096" placeholder="可选；记录判断依据，不要粘贴消息正文"></textarea></label>
      <div class="delivery-selection"><span id="delivery-selected">尚未选择待核对记录</span><button id="delivery-submit" type="button" disabled>提交结论</button></div>
    </div>
  </section>
</div>
