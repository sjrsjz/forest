<div class="contribution-view agent-workbench">
  <section class="agent-runs">
    <header><div><strong>Agent Run 控制</strong><p>按会话与状态筛选；列表使用稳定游标，不加载消息正文。</p></div><button id="run-refresh" class="quiet" type="button">刷新</button></header>
    <div class="run-filters">
      <label>会话引用<input id="run-conversation" maxlength="256" placeholder="例如 onebot:group:933179609"></label>
      <label>状态<select id="run-state"><option value="">全部</option><option value="PREPARING_MODEL,MODEL_PENDING,PARSING,REPAIR_READY,WAIT_TOOL,WAIT_APPROVAL,BLOCKED_UNKNOWN,SAFE_BOUNDARY,FINAL_READY,RELOAD_WAIT,WAIT_INPUT">运行中</option><option value="COMPLETED">COMPLETED</option><option value="FAILED">FAILED</option><option value="CANCELLED">CANCELLED</option></select></label>
      <button id="run-search" type="button">查询</button>
    </div>
    <div class="run-grid run-grid-head"><span>Run / 会话</span><span>状态</span><span>检查点</span><span>更新时间</span><span>操作</span></div>
    <div id="run-list" class="run-list"></div>
    <footer><button id="run-more" class="quiet hidden" type="button">加载更多</button><span id="run-count" class="muted"></span></footer>
    <pre id="run-detail" class="run-detail hidden"></pre>
  </section>
  <section class="agent-settings">
    <header><div><strong>单 Agent 运行配置</strong><p id="agent-state"></p></div><button id="agent-save">计划并应用</button></header>
    <div class="agent-fields">
      <label>规格修订（模块只读）<input id="agent-spec" maxlength="256" readonly></label>
      <label>Run 超时（秒）<input id="agent-timeout" type="number" min="1" max="86400"></label>
      <label>最大步骤<input id="agent-steps" type="number" min="1" max="256"></label>
      <label>输出 token<input id="agent-tokens" type="number" min="1" max="131072"></label>
      <label class="agent-check"><input id="agent-stream" type="checkbox">启用 Provider 流式响应</label>
    </div>
    <div class="preset-head"><div><strong>Bot PresetContext</strong><p>Bot 人格与行为提示；按顺序注入，不改变不可变协议。</p></div><button id="preset-add" class="quiet" type="button">添加段落</button></div>
    <div id="preset-list" class="preset-list"></div>
  </section>
  <section class="core-prompt">
    <header><div><strong>Forest CorePrompt</strong><p id="core-identity"></p></div><span class="immutable">只读</span></header>
    <textarea id="core-text" readonly spellcheck="false" aria-label="Forest CorePrompt"></textarea>
  </section>
</div>
