<section id="bot-route-graph" class="card hidden">
  <div class="route-graph-heading">
    <div><h2>路由与执行图</h2><p class="hint">直接读取内核发布的组件、service、命令、消息处理器、事件和 job 路由。图不可在此拖拽修改；变更必须经过对应模块生命周期发布。</p></div>
    <button id="route-graph-refresh" class="subtle" type="button">刷新快照</button>
  </div>
  <div id="route-graph-summary" class="route-graph-summary"></div>
  <form id="route-graph-filter" class="route-graph-filter">
    <label>节点类型<select name="kind"><option value="">全部</option><option value="component">组件</option><option value="service">Service</option><option value="command">命令</option><option value="message_handler">消息处理器</option><option value="event_publisher">事件发布</option><option value="event_subscriber">事件订阅</option><option value="job_handler">Job</option></select></label>
    <label>组件或标识<input name="query" maxlength="128" placeholder="筛选组件、service、命令…"></label>
  </form>
  <p id="route-graph-status" role="status"></p>
  <div id="route-graph-nodes" class="route-graph-nodes" aria-live="polite"></div>
  <details><summary>依赖与事件边</summary><div id="route-graph-edges" class="route-graph-edges"></div></details>
  <details id="dispatch-trace-panel">
    <summary>消息 Dispatch Trace</summary>
    <form id="dispatch-trace-filter" class="dispatch-trace-filter">
      <label>群/会话 ID<input name="conversation_id" maxlength="256"></label>
      <label>Binding ID<input name="binding_id" maxlength="128"></label>
      <label>群/频道 ID<input name="channel_id" maxlength="256"></label>
      <label>消息事件 ID<input name="event_id" maxlength="256"></label>
      <label>组件 ID<input name="component_id" maxlength="128"></label>
      <label>代际 ID<input name="generation_id" maxlength="128"></label>
      <label>结果状态<input name="status" maxlength="64"></label>
      <label>开始时间（含时区）<input name="received_after" maxlength="64" placeholder="2026-09-17T00:00:00+08:00"></label>
      <label>截止时间（含时区）<input name="received_before" maxlength="64" placeholder="2026-09-18T00:00:00+08:00"></label>
      <label>数量<input name="limit" type="number" min="1" max="100" value="30"></label>
      <button type="submit">查询</button>
    </form>
    <button id="dispatch-trace-more" type="button" class="subtle hidden">加载更早记录</button>
    <p id="dispatch-trace-status" role="status"></p>
    <div id="dispatch-traces" class="dispatch-traces" aria-live="polite"></div>
  </details>
</section>
