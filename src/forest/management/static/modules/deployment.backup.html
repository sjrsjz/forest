<section aria-labelledby="deployment-backup-title">
  <h2 id="deployment-backup-title">部署备份</h2>
  <p class="hint">备份模块协调 deployment 与各 Bot 的独立一致性切口。恢复和物理资源回收由其他模块负责。</p>
  <div class="columns">
    <div class="card">
      <h3>创建加密备份</h3>
      <form id="deployment-backup-create-form">
        <label>恢复口令<input name="recovery_passphrase" type="password" required minlength="16" maxlength="1024" autocomplete="new-password"></label>
        <label>确认恢复口令<input name="recovery_confirmation" type="password" required minlength="16" maxlength="1024" autocomplete="new-password"></label>
        <label class="check"><input name="include_packages" type="checkbox" checked><span>包含已登记组件包</span></label>
        <label>当前管理员密码<input name="current_password" type="password" required minlength="12" maxlength="1024" autocomplete="current-password"></label>
        <button type="submit">创建备份</button>
      </form>
    </div>
    <div class="card">
      <h3>导入外部备份</h3>
      <form id="deployment-backup-import-form">
        <label>加密备份文件<input name="artifact" type="file" accept=".bin,.forest-backup,application/vnd.forest.backup" required></label>
        <label>恢复口令<input name="recovery_passphrase" type="password" required minlength="16" maxlength="1024" autocomplete="new-password"></label>
        <label>当前管理员密码<input name="current_password" type="password" required minlength="12" maxlength="1024" autocomplete="current-password"></label>
        <button type="submit">上传并校验</button>
      </form>
    </div>
  </div>
  <div id="deployment-backup-verification" class="card hidden">
    <h3>只读验证</h3><p id="deployment-backup-verification-target" class="hint"></p>
    <form id="deployment-backup-verification-form">
      <label>恢复口令<input name="recovery_passphrase" type="password" required minlength="16" maxlength="1024" autocomplete="new-password"></label>
      <label>当前管理员密码<input name="current_password" type="password" required minlength="12" maxlength="1024" autocomplete="current-password"></label>
      <div class="actions"><button type="submit">开始验证</button><button id="deployment-backup-verification-cancel" type="button" class="subtle">取消</button></div>
    </form>
  </div>
  <div class="card"><div class="actions"><h3>备份任务</h3><button id="deployment-backup-refresh" type="button" class="subtle">刷新</button></div><p id="deployment-backup-empty" class="hint hidden">还没有备份任务。</p><div id="deployment-backup-list"></div></div>
  <div class="card"><h3>导入任务</h3><p id="deployment-backup-import-empty" class="hint hidden">还没有导入任务。</p><div id="deployment-backup-import-list"></div></div>
</section>
