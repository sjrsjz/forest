<section id="deployment-accounts" aria-labelledby="deployment-accounts-title">
  <h2 id="deployment-accounts-title">安全与账号</h2>
  <p class="muted">固定角色模板由服务端强制执行。管理员可以读写；查看者只能查询部署与 Bot 状态。平台群管理员不会自动成为后台账号。</p>
  <div class="columns"><div class="card"><h3>管理账号</h3><div id="account-list" aria-live="polite"></div><button id="account-refresh" class="subtle">刷新账号</button></div>
  <div class="card"><h3>创建账号</h3><form id="account-create-form">
    <label>账号<input name="username" required maxlength="80" pattern="[a-zA-Z0-9_.-]+" autocomplete="off"></label>
    <label>角色<select name="role"><option value="viewer">查看者</option><option value="admin">管理员</option></select></label>
    <label>初始密码<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
    <label>你的当前密码<input name="current_password" type="password" required minlength="12" maxlength="1024" autocomplete="current-password"></label>
    <button type="submit">创建账号</button>
  </form></div></div>
  <div id="account-detail" class="card hidden"><h3 id="account-detail-name"></h3><p id="account-detail-meta" class="muted"></p>
    <form id="account-plan-form"><div class="columns"><div>
      <label>角色<select name="role"><option value="admin">管理员</option><option value="viewer">查看者</option></select></label>
      <label class="check"><input name="disabled" type="checkbox">停用账号</label>
    </div><div><label>设置新密码（留空保持）<input name="new_password" type="password" minlength="12" maxlength="1024" autocomplete="new-password"></label>
      <p class="hint">预览不改变账号。提交角色、停用状态或密码后，该账号的全部会话都会撤销；至少保留一个已启用管理员。</p></div></div>
      <button type="submit">预览账号变更</button>
    </form>
    <div id="account-preview" class="hidden"><h3>确认账号变更</h3><pre id="account-preview-diff"></pre>
      <form id="account-apply-form"><label>再次输入你的当前密码<input name="current_password" type="password" required minlength="12" maxlength="1024" autocomplete="current-password"></label><button type="submit">应用账号变更</button></form>
    </div>
  </div>
</section>
