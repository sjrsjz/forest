<section id="deployment-audit" class="card" aria-labelledby="deployment-audit-title">
  <h2 id="deployment-audit-title">部署审计</h2>
  <p class="muted">按不可变部署事实核对账号、配置、Bot 目录、Binding 预留和插件导入。页面只显示服务端白名单内的脱敏元数据。</p>
  <form id="audit-filter-form" class="audit-filters">
    <label>动作<input name="action" maxlength="256" placeholder="例如 account.apply"></label>
    <label>资源前缀<input name="resource_prefix" maxlength="256" placeholder="例如 bot:"></label>
    <label>操作者 ID<input name="actor_id" maxlength="256"></label>
    <button type="submit">查询</button>
  </form>
  <div class="actions">
    <button id="audit-refresh" class="subtle" type="button">刷新最新记录</button>
    <button id="audit-more" class="subtle hidden" type="button">更早记录</button>
  </div>
  <p id="audit-empty" class="hint hidden">当前筛选条件下没有审计记录。</p>
  <div id="audit-list" aria-live="polite"></div>
</section>
