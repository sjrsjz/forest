<div class="contribution-view core-rescue">
  <header class="core-rescue-header">
    <div><strong>群聊 Core 救援授权</strong><span id="core-rescue-revision"></span></div>
  </header>
  <p>授权仅针对指定 Bot 的 Binding、群和 QQ 主体，按动作分别授予。当前仅交付授权账本；独立群聊救援入口与执行器尚未发布，这些授权暂时不会使救援命令可用。</p>
  <form id="core-rescue-form" class="core-rescue-form">
    <label>Binding 引用<input name="binding_ref" required maxlength="256" autocomplete="off"></label>
    <label>群号<input name="group_ref" required inputmode="numeric" pattern="[1-9][0-9]{0,19}" autocomplete="off"></label>
    <label>QQ 主体<input name="principal_ref" required pattern="qq:[1-9][0-9]{0,19}" placeholder="qq:123456" autocomplete="off"></label>
    <fieldset>
      <legend>允许的救援动作</legend>
      <label><input type="checkbox" name="status">状态</label>
      <label><input type="checkbox" name="cancel">取消</label>
      <label><input type="checkbox" name="disable">暂停 DATA</label>
      <label><input type="checkbox" name="reload">重载请求</label>
    </fieldset>
    <div class="core-rescue-buttons">
      <button type="submit">保存授权</button>
      <button id="core-rescue-revoke" type="button">撤销该主体</button>
    </div>
  </form>
  <table>
    <thead><tr><th>Binding</th><th>群</th><th>主体</th><th>动作</th><th>修订</th></tr></thead>
    <tbody id="core-rescue-grants"></tbody>
  </table>
</div>
