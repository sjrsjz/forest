<div class="contribution-view audit-workbench">
  <form id="audit-filters" class="audit-filters">
    <label>动作<input name="action" placeholder="shell.command.succeeded"></label>
    <label>生产者<input name="producer_component_id" placeholder="shell.command"></label>
    <label>来源<input name="origin_kind" placeholder="group.shell"></label>
    <label>资源类型<input name="resource_kind" placeholder="bot"></label>
    <label>资源 ID<input name="resource_id"></label>
    <label>操作类型<input name="operation_kind" placeholder="shell.request"></label>
    <label>操作 ID<input name="operation_id"></label>
    <label>页大小<select name="limit"><option>25</option><option selected>50</option><option>100</option></select></label>
    <button type="submit">查询</button>
  </form>
  <div class="audit-results">
    <div id="audit-summary" class="audit-summary"></div>
    <div id="audit-rows" class="audit-rows"></div>
    <button id="audit-more" class="quiet hidden" type="button">下一页</button>
  </div>
</div>
