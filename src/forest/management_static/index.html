<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Forest Runtime Console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="setup" class="login-layer hidden">
    <form id="setup-form" class="login-card">
      <span class="mark">FOREST · FIRST SETUP</span>
      <h1>创建首位管理员</h1>
      <p>输入安装程序生成的一次性配对码。配对成功后，该凭据立即失效。</p>
      <label>配对码<input name="pairing_code" type="password" autocomplete="one-time-code" required minlength="43" maxlength="128"></label>
      <label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-z][a-z0-9._-]{2,63}"></label>
      <label>显示名称<input name="display_name" autocomplete="name" required maxlength="128"></label>
      <label>新密码<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label>
      <button type="submit">完成配对</button>
      <output id="setup-error"></output>
    </form>
  </div>
  <div id="login" class="login-layer hidden">
    <form id="login-form" class="login-card">
      <span class="mark">FOREST</span>
      <h1>运行时控制台</h1>
      <p>使用部署级管理账号登录。</p>
      <label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="64"></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="12"></label>
      <button type="submit">登录</button>
      <output id="login-error"></output>
    </form>
  </div>
  <div id="console" class="console hidden">
    <header class="topbar">
      <div><span class="mark">FOREST</span><strong id="bot-id"></strong></div>
      <label id="scope-picker" class="scope-picker hidden"><span>作用域</span><select id="scope-select"><option value="deployment">部署</option></select></label>
      <div class="runtime-line"><span id="runtime-state"></span><code id="graph-id"></code></div>
      <button id="logout" class="quiet">退出</button>
    </header>
    <aside class="sidebar">
      <div class="sidebar-title">运行模块 <span id="module-count"></span></div>
      <nav id="module-nav"></nav>
    </aside>
    <main class="workspace">
      <div id="notice" class="notice hidden"></div>
      <section id="overview" class="pane">
        <div class="pane-head"><div><small>RUNTIME GRAPH</small><h1>模块注册表</h1></div></div>
        <details id="graph-control" class="graph-control hidden">
          <summary>部署图 · 新增 / 替换包</summary>
          <form id="graph-replace-form" class="graph-replace-form">
            <label>操作<select name="operation"><option value="replace">替换</option><option value="add">新增</option></select></label>
            <label id="graph-existing-component">现有模块<select name="component_id" required></select></label>
            <label id="graph-new-component" class="hidden">新模块 ID<input name="new_component_id" pattern="[a-z0-9][a-z0-9._-]{0,127}" spellcheck="false"></label>
            <label>包摘要<input name="package_digest" required pattern="sha256:[a-f0-9]{64}" spellcheck="false"></label>
            <span>当前图修订 <code id="graph-replace-revision"></code></span>
            <button type="submit">提交替换</button>
          </form>
          <output id="graph-replace-status" aria-live="polite"></output>
        </details>
        <div id="module-table" class="module-table"></div>
      </section>
      <section id="module-view" class="pane hidden">
        <div class="pane-head"><div><small id="component-kind">MODULE</small><h1 id="component-title"></h1></div><button id="back" class="quiet">返回注册表</button></div>
        <nav id="contribution-nav" class="tabs"></nav>
        <div id="contribution-root" class="contribution-root"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
