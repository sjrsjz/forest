manifest_version = 1
package_id = "tests.routing-component"
version = "1.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "routing_component:RoutingComponent"

[[components]]
id = "tests.routing-component"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
provides = []

[components.resources]
max_frame_bytes = 262144
max_inflight = 8
max_queue_items = 32
max_state_inflight = 4
max_owned_tasks = 4
max_owned_resources = 2

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 30
stop_timeout_s = 10

[components.capabilities]
requests = ["event.publish:tests.ready", "job.schedule:tests.echo"]

[[components.publishes]]
topic = "tests.ready"
contract = "1.0"
schema = "schemas/value.json"

[[components.subscribes]]
subscriber_id = "tests.capture"
topic = "tests.ready"
contract = "1.0"
schema = "schemas/value.json"
max_attempts = 3

[[components.jobs]]
handler_id = "tests.echo"
input_schema = "schemas/value.json"
max_attempts = 3
timeout_s = 10
max_concurrency = 2
