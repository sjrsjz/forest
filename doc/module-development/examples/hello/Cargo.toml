[package]
name = "forest-module-example-hello"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone example; no change to the framework workspace is needed.
[workspace]

[profile.dev]
debug = 0
incremental = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-hello"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../../../crates/forest-sdk" }
forest-protocol = { path = "../../../../crates/forest-protocol" }
forest-serde = { path = "../../../../crates/forest-serde" }
forest-onebot = { path = "../../../../plugins/onebot/protocol", features = ["forest"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../../../crates/forest-package" }
