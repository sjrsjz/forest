name: forest

services:
  initialize:
    image: python:3.11.13-slim
    pull_policy: missing
    user: "0:0"
    command: ["python", "/opt/forest/container_init.py"]
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./scripts/container_init.py:/opt/forest/container_init.py:ro
      - forest_data:/data
      - forest_secrets:/run/forest-secrets
      - postgres_data:/var/lib/forest-postgres:ro

  secret:
    image: python:3.11.13-slim
    profiles: [bootstrap]
    user: "0:0"
    command: ["python", "/opt/forest/container_secret.py"]
    stdin_open: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    environment:
      FOREST_SECRET_NAME: ${FOREST_SECRET_NAME:-}
    volumes:
      - ./scripts/container_secret.py:/opt/forest/container_secret.py:ro
      - forest_secrets:/run/forest-secrets

  postgres:
    image: postgres:17.10-alpine3.23
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: forest_bot
      POSTGRES_USER: forest
      POSTGRES_PASSWORD_FILE: /run/forest-secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - forest_secrets:/run/forest-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest_bot"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    shm_size: 128mb

  forest:
    build: .
    image: forest:local
    restart: unless-stopped
    init: true
    depends_on:
      initialize:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      FOREST_DATABASE_PASSWORD_FILE: /run/forest-secrets/postgres_password
      FOREST_DATABASE_HOST: postgres
      FOREST_DATABASE_NAME: forest_bot
      FOREST_BOT_ID: ${FOREST_BOT_ID:-forest-main}
      FOREST_MODEL_BASE_URL: ${FOREST_MODEL_BASE_URL:?set FOREST_MODEL_BASE_URL}
      FOREST_MODEL_API_KEY_FILE: /run/forest-secrets/model_api_key
      FOREST_MODEL_NAME: ${FOREST_MODEL_NAME:?set FOREST_MODEL_NAME}
      FOREST_MODEL_INPUT_MODALITIES: ${FOREST_MODEL_INPUT_MODALITIES:-text}
      FOREST_EMBEDDING_ENDPOINT: ${FOREST_EMBEDDING_ENDPOINT:?set FOREST_EMBEDDING_ENDPOINT}
      FOREST_EMBEDDING_API_KEY_FILE: /run/forest-secrets/embedding_api_key
      FOREST_EMBEDDING_DEPLOYMENT_ID: ${FOREST_EMBEDDING_DEPLOYMENT_ID:-embedding.multimodal/qiyu-vl/default}
      FOREST_EMBEDDING_MODEL_REVISION: ${FOREST_EMBEDDING_MODEL_REVISION:-operator-declared/1}
      FOREST_EMBEDDING_MODEL: ${FOREST_EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
      FOREST_EMBEDDING_DIMENSIONS: ${FOREST_EMBEDDING_DIMENSIONS:-4096}
      FOREST_ONEBOT_SELF_ID: ${FOREST_ONEBOT_SELF_ID:?set FOREST_ONEBOT_SELF_ID}
      FOREST_ONEBOT_WEBSOCKET_URL: ${FOREST_ONEBOT_WEBSOCKET_URL:?set FOREST_ONEBOT_WEBSOCKET_URL}
      FOREST_ONEBOT_ACCESS_TOKEN_FILE: /run/forest-secrets/onebot_access_token
      FOREST_ALLOWED_GROUP_IDS: ${FOREST_ALLOWED_GROUP_IDS:-933179609}
      FOREST_GROUP_TRIGGER_MODE: ${FOREST_GROUP_TRIGGER_MODE:-MENTION}
      FOREST_AGENT_SYSTEM_PROMPT: ${FOREST_AGENT_SYSTEM_PROMPT:-}
      FOREST_RUNTIME_STATUS_FILE: /data/runtime-status.json
      FOREST_DATA_DIR: /data
      FOREST_MANAGEMENT_TOKEN: ${FOREST_MANAGEMENT_TOKEN:-}
      FOREST_MANAGEMENT_HOST: 0.0.0.0
      FOREST_MANAGEMENT_PORT: 8080
    ports:
      - "127.0.0.1:${FOREST_MANAGEMENT_PORT:-8080}:8080"
    volumes:
      - forest_data:/data
      - forest_secrets:/run/forest-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

volumes:
  postgres_data:
  forest_data:
  forest_secrets:
