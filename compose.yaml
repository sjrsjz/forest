name: forest

services:
  initialize:
    image: python:3.11.13-slim
    pull_policy: missing
    user: "0:0"
    command: ["python", "/opt/forest/container_init.py"]
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./scripts/container_init.py:/opt/forest/container_init.py:ro
      - forest_secrets:/run/forest-secrets
      - postgres_data:/var/lib/forest-postgres:ro
      - forest_packages:/var/lib/forest-packages

  secret:
    image: python:3.11.13-slim
    profiles: [bootstrap]
    user: "0:0"
    command: ["python", "/opt/forest/container_secret.py"]
    stdin_open: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    environment:
      FOREST_SECRET_NAME: ${FOREST_SECRET_NAME:-}
    volumes:
      - ./scripts/container_secret.py:/opt/forest/container_secret.py:ro
      - forest_secrets:/run/forest-secrets

  postgres:
    image: postgres:17.10-alpine3.23
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      initialize:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: forest_deployment
      POSTGRES_USER: forest
      POSTGRES_PASSWORD_FILE: /run/forest-secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - forest_secrets:/run/forest-secrets:ro
      - ./scripts/postgres_init_host.sh:/docker-entrypoint-initdb.d/10-host.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest_deployment"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    shm_size: 128mb

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    pull_policy: missing
    restart: unless-stopped
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    pull_policy: missing
    restart: unless-stopped
    command: ["minio", "server", "/minio_data"]
    environment:
      MINIO_ROOT_USER: forest
      MINIO_ROOT_PASSWORD: ${FOREST_MILVUS_OBJECT_PASSWORD:-forest-milvus-local-change-me}
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]

  milvus:
    image: milvusdb/milvus:v3.0.0
    pull_policy: missing
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: forest
      MINIO_SECRET_ACCESS_KEY: ${FOREST_MILVUS_OBJECT_PASSWORD:-forest-milvus-local-change-me}
      MINIO_REGION: us-east-1
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:${FOREST_MILVUS_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined

  supervisor:
    build: .
    image: forest:local
    command: ["python", "-m", "forest", "supervisor"]
    restart: unless-stopped
    init: true
    depends_on:
      initialize:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      FOREST_DEPLOYMENT_ID: ${FOREST_DEPLOYMENT_ID:-forest/default}
      FOREST_HOST_ID_FILE: /run/forest-secrets/host_id
      FOREST_DEPLOYMENT_DATABASE_PASSWORD_FILE: /run/forest-secrets/postgres_password
      FOREST_DEPLOYMENT_DATABASE_HOST: postgres
      FOREST_DEPLOYMENT_DATABASE_NAME: forest_deployment
      FOREST_HOST_DATABASE_PASSWORD_FILE: /run/forest-secrets/host_postgres_password
      FOREST_HOST_DATABASE_HOST: postgres
      FOREST_HOST_DATABASE_NAME: forest_host
      FOREST_DEPLOYMENT_MASTER_KEYRING_FILE: /run/forest-secrets/deployment_master_keyring
      FOREST_DEPLOYMENT_WEB_BOOTSTRAP_FILE: /run/forest-secrets/deployment_web_bootstrap
      FOREST_DEPLOYMENT_MANAGEMENT_HOST: 0.0.0.0
      FOREST_DEPLOYMENT_MANAGEMENT_PORT: 8081
      FOREST_DEPLOYMENT_MANAGEMENT_ORIGIN: ${FOREST_MANAGEMENT_ORIGIN:-http://127.0.0.1:8080}
      FOREST_SUPERVISOR_POLL_SECONDS: ${FOREST_SUPERVISOR_POLL_SECONDS:-1}
      FOREST_SUPERVISOR_MAX_STARTING: ${FOREST_SUPERVISOR_MAX_STARTING:-2}
      FOREST_PACKAGE_CATALOG_ROOT: /var/lib/forest-packages
    ports:
      - "127.0.0.1:${FOREST_MANAGEMENT_PORT:-8080}:8081"
    volumes:
      - forest_secrets:/run/forest-secrets:ro
      - forest_packages:/var/lib/forest-packages
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8081),2); s.close()"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  forest_secrets:
  etcd_data:
  minio_data:
  milvus_data:
  forest_packages:
