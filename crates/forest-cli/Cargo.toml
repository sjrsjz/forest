[package]
name = "forest-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "forest"
path = "src/main.rs"

[dependencies]
forest-runtime = { path = "../forest-runtime" }
forest-protocol = { path = "../forest-protocol" }
forest-onebot = { path = "../forest-onebot", features = ["http", "forest"] }
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
futures.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
forest-test = { path = "../../plugins/forest-test" }
forest-config = { path = "../forest-config" }
tempfile = "3.23.0"
