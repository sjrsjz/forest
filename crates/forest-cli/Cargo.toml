[package]
name = "forest-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["webui"]
webui = ["dep:forest-webui"]

[[bin]]
name = "forest"
path = "src/main.rs"

[dependencies]
forest-package = { path = "../forest-package" }
forest-control = { path = "../forest-control" }
forest-runtime = { path = "../forest-runtime" }
forest-webui = { path = "../forest-webui", optional = true }
forest-protocol = { path = "../forest-protocol" }
tokio.workspace = true
anyhow.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
