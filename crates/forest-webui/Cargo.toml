[package]
name = "forest-webui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
forest-control = { path = "../forest-control" }
forest-runtime = { path = "../forest-runtime" }
forest-config = { path = "../forest-config" }
forest-protocol = { path = "../forest-protocol" }
forest-serde = { path = "../forest-serde" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2 = "0.10.9"
subtle = "2.6.1"
getrandom = "0.3.4"

[dev-dependencies]
forest-scheduler-probe = { path = "../forest-runtime/tests/fixtures/probe" }
tempfile = "3.23.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
