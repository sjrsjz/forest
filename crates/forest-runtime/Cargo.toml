[package]
name = "forest-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
forest-protocol = { path = "../forest-protocol" }
forest-serde = { path = "../forest-serde" }
forest-util = { path = "../forest-util", features = ["serde"] }
forest-config = { path = "../forest-config" }
forest-onebot = { path = "../forest-onebot", features = ["http", "forest"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
indexmap = "2.14.2"
cap-std = "3.4.5"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
wasmtime = { version = "=38.0.3", default-features = false, features = ["async", "cache", "cranelift", "runtime", "std", "wat"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3.23.0"
forest-test = { path = "../../plugins/forest-test" }
forest-scheduler-probe = { path = "tests/fixtures/probe" }
