[package]
name = "forest-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
forest-package = { path = "../forest-package" }
forest-protocol = { path = "../forest-protocol" }
forest-serde = { path = "../forest-serde" }
forest-util = { path = "../forest-util", features = ["serde"] }
forest-config = { path = "../forest-config" }
serde.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
indexmap = "2.14.2"
getrandom = "0.3.4"
cap-std = "3.4.5"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
wasmtime = { version = "=48.0.7", default-features = false, features = ["anyhow", "async", "cache", "cranelift", "runtime", "std", "wat"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.23.0"
forest-scheduler-probe = { path = "tests/fixtures/probe" }
