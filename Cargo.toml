[workspace]
members = ["crates/forest-serde", "crates/forest-serde-macros", "crates/forest-util", "crates/forest-onebot", "crates/forest-config", "crates/forest-protocol", "crates/forest-sdk", "crates/forest-runtime", "crates/forest-control", "crates/forest-webui", "crates/forest-cli", "plugins/forest-test", "plugins/npucraft", "plugins/shell", "plugins/qwen-vl-embedding", "plugins/openai-provider", "plugins/context", "plugins/memory", "plugins/agent", "plugins/agent-tools", "plugins/deepseek-web", "plugins/wolfram-alpha", "plugins/media", "plugins/typst", "crates/forest-runtime/tests/fixtures/probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
forest-serde-macros = { path = "crates/forest-serde-macros" }
bincode = "1.3.3"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
futures = "0.3.31"
anyhow = "1.0.100"
thiserror = "2.0.18"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Typesetting is a large compute workload; keep its distributed guest optimized.
[profile.guest]
inherits = "release"
opt-level = 2
codegen-units = 16
strip = "debuginfo"
