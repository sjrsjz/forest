[workspace]
members = ["crates/synthase-serde", "crates/synthase-serde-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
synthase-serde-macros = { path = "crates/synthase-serde-macros" }
