[package]
id = "/module/message-output"
version = "0.1.0"
name = "Message output"
description = "Native and Markdown output with per-group long-message forwarding"

[module]
file = "module.wasm"
lifecycle-error = "generated/lifecycle-error.schema"

[[configs]]
key = "/settings"
schema = "generated/configs/0.schema"
default = "generated/configs/0.value"

[configs.access]
readers = ["self"]
writers = ["/user/admin"]

[[provides]]
path = "/send"
input = "generated/provides/0.input.schema"
output = "generated/provides/0.output.schema"

[provides.access]
callers = [
    "/module/agent",
    "/module/onebot-tools",
    "/module/typst-command",
    "/user/admin",
]

[[provides]]
path = "/send_markdown"
input = "generated/provides/1.input.schema"
output = "generated/provides/1.output.schema"

[provides.access]
callers = [
    "/module/agent",
    "/module/onebot-tools",
    "/user/admin",
]

[[uses]]
object = "/module/markdown"
interface = "/format"
input = "generated/uses/0.input.schema"
output = "generated/uses/0.output.schema"

[[uses]]
object = "/module/media"
interface = "/get"
input = "generated/uses/1.input.schema"
output = "generated/uses/1.output.schema"

[[uses]]
object = "/module/onebot"
interface = "/send_group_message"
input = "generated/uses/2.input.schema"
output = "generated/uses/2.output.schema"

