[package]
id = "/module/context"
version = "0.1.0"
name = "Context formatter"
description = "Ordered content to OpenAI messages with a configurable Agent prompt"

[module]
file = "module.wasm"
lifecycle-error = "generated/lifecycle-error.schema"

[[configs]]
key = "/prompt/agent"
schema = "generated/configs/0.schema"
default = "generated/configs/0.value"

[configs.access]
readers = ["self"]
writers = ["/user/admin"]

[[provides]]
path = "/format"
input = "generated/provides/0.input.schema"
output = "generated/provides/0.output.schema"

[provides.access]
callers = [
    "/module/**",
    "/user/admin",
]

[[uses]]
object = "/module/markdown"
interface = "/encode"
input = "generated/uses/0.input.schema"
output = "generated/uses/0.output.schema"

