[package]
id = "/module/onebot"
version = "0.1.0"
name = "OneBot v11 adapter"
description = "Wasm protocol adapter using generic host WebSocket notifications"

[module]
file = "module.wasm"
lifecycle-error = "generated/lifecycle-error.schema"
activated = "/activated"

[[configs]]
key = "/settings"
schema = "generated/configs/0.schema"
default = "generated/configs/0.value"

[configs.access]
readers = [
    "self",
    "/user/admin",
]
writers = ["/user/admin"]

[[provides]]
path = "/activated"
input = "generated/provides/0.input.schema"
output = "generated/provides/0.output.schema"

[provides.access]
callers = ["/system/lifecycle"]

[[provides]]
path = "/io"
input = "generated/provides/1.input.schema"
output = "generated/provides/1.output.schema"

[provides.access]
callers = ["/system/io"]

[[provides]]
path = "/query"
input = "generated/provides/2.input.schema"
output = "generated/provides/2.output.schema"

[provides.access]
callers = [
    "/module/**",
    "/user/admin",
]

[[provides]]
path = "/send_group_message"
input = "generated/provides/3.input.schema"
output = "generated/provides/3.output.schema"

[provides.access]
callers = [
    "/module/**",
    "/user/admin",
]

[[provides]]
path = "/send_private_message"
input = "generated/provides/4.input.schema"
output = "generated/provides/4.output.schema"

[provides.access]
callers = [
    "/module/**",
    "/user/admin",
]

[[events]]
path = "/group_message"
input = "generated/events/0.schema"

[events.access]
readers = ["/module/**"]

