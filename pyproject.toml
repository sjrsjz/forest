[project]
name = "forest"
version = "0.1.0"
description = "A modular, durable multi-bot framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
forest = "forest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forest"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires a private PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
