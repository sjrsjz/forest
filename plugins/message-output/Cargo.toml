[package]
name = "forest-message-output"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-message-output"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
forest-onebot = { path = "../../crates/forest-onebot", features = ["forest"] }
base64 = "0.22.1"
serde_json.workspace = true

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
tokio.workspace = true
tempfile = "3.23.0"
