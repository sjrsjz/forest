[package]
name = "forest-qwen-vl-embedding"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-qwen-vl-embedding"
path = "src/bin/package.rs"

[[example]]
name = "verify-qwen-vl-embedding"
path = "examples/verify.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
forest-config = { path = "../../crates/forest-config" }
tokio.workspace = true
tempfile = "3.23.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
