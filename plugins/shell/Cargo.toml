[package]
name = "forest-shell"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-shell"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
forest-onebot = { path = "../../crates/forest-onebot", features = ["forest"] }
serde_json.workspace = true

[dev-dependencies]
forest-control = { path = "../../crates/forest-control" }
forest-runtime = { path = "../../crates/forest-runtime" }
forest-config = { path = "../../crates/forest-config" }
forest-npucraft = { path = "../npucraft" }
forest-test = { path = "../forest-test" }
tokio.workspace = true
tempfile = "3.23.0"
