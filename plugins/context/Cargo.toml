[package]
name = "forest-context-module"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-context"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
forest-onebot = { path = "../onebot/protocol", features = ["forest"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
forest-markdown = { path = "../markdown" }
forest-runtime = { path = "../../crates/forest-runtime" }
forest-config = { path = "../../crates/forest-config" }
tokio.workspace = true
tempfile = "3.23.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../crates/forest-package" }
