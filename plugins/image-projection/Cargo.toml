[package]
name = "forest-image-projection"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-image-projection"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
tokio.workspace = true
tempfile = "3.23.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../crates/forest-package" }
