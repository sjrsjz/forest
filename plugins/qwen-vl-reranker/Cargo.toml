[package]
name = "forest-qwen-vl-reranker"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-qwen-vl-reranker"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
forest-config = { path = "../../crates/forest-config" }
tokio.workspace = true
tempfile = "3.23.0"
axum = "0.8.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../crates/forest-package" }
