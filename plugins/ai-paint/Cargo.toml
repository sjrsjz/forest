[package]
name = "forest-ai-paint"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-ai-paint"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
url = "2.5.7"

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
forest-config = { path = "../../crates/forest-config" }
forest-media = { path = "../media" }
tokio.workspace = true
axum = "0.8.8"
tempfile = "3.23.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../crates/forest-package" }
