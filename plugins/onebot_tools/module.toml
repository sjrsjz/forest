manifest_version = 1
package_id = "forest.plugins.onebot-tools"
version = "1.0.0"
kernel_api = ">=1.0,<2.0"
runtime = "python-worker"
entrypoint = "plugin:Tools"

[[components]]
id = "tools.onebot"
scope = "bot"
state_schema = 1
reload_mode = "drain"
config_schema = "schemas/config.json"
bootstrap_config = "defaults.json"
configuration_apply = "worker-host/1"

[components.capabilities]
requests = ["state.read", "state.write", "payload.read", "payload.write", "service.call:adapter.onebot.groups.page", "service.call:adapter.onebot.api.query", "service.call:adapter.onebot.api.command", "service.call:delivery.submit", "service.call:delivery.status"]

[components.resources]
max_frame_bytes = 262144
max_inflight = 16
max_queue_items = 64
max_state_inflight = 8
max_owned_tasks = 4
max_owned_resources = 4

[components.lifecycle]
prepare_timeout_s = 10
start_timeout_s = 10
drain_timeout_s = 90
stop_timeout_s = 10

[components.management_ui]
entrypoint = "ui/index.html"
protocol = "forest.management-ui/1"
contribution_id = "tools.onebot.workspace"
label = "Onebot Tools"
group = "tools"
order = 10

[[components.requires]]
name = "adapter.onebot.groups.page"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.requires]]
name = "adapter.onebot.api.query"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.requires]]
name = "adapter.onebot.api.command"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.requires]]
name = "delivery.submit"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

[[components.requires]]
name = "delivery.status"
contract = ">=1.0,<2.0"
required = true
startup_dependency = true

