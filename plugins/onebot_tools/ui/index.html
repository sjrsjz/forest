<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工具设置</title>
<style>:root{color-scheme:dark;font:14px/1.5 system-ui;color:#dcebe4;background:#0b1712}*{box-sizing:border-box}body{margin:0;padding:14px}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 8px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}section{border:1px solid #294437;border-radius:9px;padding:12px;margin-top:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(230px,1fr));gap:12px}label{display:grid;gap:4px}.check{display:flex;gap:8px;align-items:center}input,textarea,select{color:inherit;background:#08130e;border:1px solid #365b47;border-radius:5px;padding:7px;font:inherit;min-width:0;width:100%}input[type=checkbox]{width:16px;height:16px;accent-color:#84d9ae}textarea{height:78px;resize:vertical}button{border:1px solid #365b47;border-radius:6px;background:#193b2a;color:inherit;padding:7px 12px;cursor:pointer;font:inherit}button.primary{background:#84d9ae;color:#092718}button:disabled{opacity:.45}.muted,small{color:#9ab2a5;font-size:12px}#groups{max-height:240px;overflow:auto;margin-top:8px}#groups label{padding:7px;border-bottom:1px solid #294437;display:flex;gap:9px;align-items:center}#groups input{width:16px;flex:none}.tools{display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:6px}.tools label{display:flex;gap:7px;align-items:center}#selected{display:flex;gap:5px;flex-wrap:wrap;max-height:120px;overflow:auto;margin-top:8px}.bar input{flex:1}.status{min-height:21px;overflow-wrap:anywhere}#error{color:#ffbcac}[hidden]{display:none!important}@media(max-width:620px){.fields,.tools{grid-template-columns:1fr}}</style></head>
<body><header><div><h1 id="title"></h1><small id="revision"></small></div><button id="plan" class="primary" disabled>生成配置计划</button></header><p class="muted" id="help"></p>
<section><div id="fields" class="fields"></div></section>
<section id="tool-section" hidden><h2>启用的工具</h2><div class="tools" id="tools"></div></section><section id="permission-section" hidden><h2>各工具允许的目标群角色</h2><p class="muted">全局操作者由上方配置；未勾选角色时，仅全局操作者可执行该操作。</p><div class="tools" id="permissions"></div></section>
<section id="group-section" hidden><h2>允许操作的群</h2><div class="bar"><select id="account"></select><input id="search" maxlength="128" placeholder="群名 / 群号"><button id="find">查询</button><button id="refresh">刷新账号与群</button></div><p id="error" role="alert"></p><div id="groups"></div><div class="bar"><small id="page-info"></small><button id="next" hidden>下一页</button></div><details><summary id="selected-count">已选群</summary><div id="selected"></div></details></section><p class="status" id="status" role="status"></p>
<script>(()=>{'use strict';const settings={"title": "OneBot Agent 工具", "help": "工具权限独立于自动触发白名单。普通查询只覆盖下方允许群；发送、禁言、踢人等操作还需操作者或目标群管理员权限。操作结果不确定时不会自动重发。", "groups": true, "fields": [{"path": "operator_ids", "label": "全局操作者 QQ 号（一行一个）", "type": "list"}], "permissions": ["onebot_send_group", "onebot_ban_member", "onebot_ban_all", "onebot_kick_member", "onebot_set_card", "onebot_set_group_name"], "tools": ["onebot_account_info", "onebot_groups", "onebot_group_info", "onebot_member_info", "onebot_members", "onebot_send_group", "onebot_send_private", "onebot_ban_member", "onebot_ban_all", "onebot_kick_member", "onebot_set_card", "onebot_set_group_name", "onebot_delivery_status"]};let port,nonce,draft=null,sequence=0,load=0,cursor=null;const pending=new Map(),controls=new Map(),$=id=>document.getElementById(id);const send=(type,payload={})=>port.postMessage({protocol:'forest.management-ui-channel/1',nonce,type,...payload});const resize=()=>send('resize',{height:document.documentElement.scrollHeight});const status=text=>{$('status').textContent=text;resize();};const get=path=>path.split('.').reduce((v,k)=>v[k],draft);const set=(path,value)=>{const parts=path.split('.'),key=parts.pop();parts.reduce((v,k)=>v[k],draft)[key]=value;};
const list=value=>value.split(/[\s,]+/).filter(Boolean);const query=value=>new Promise((resolve,reject)=>{const request_id='tool-settings:'+ ++sequence;pending.set(request_id,{resolve,reject});send('query',{request_id,operation_id:'groups.page',value});});
function changed(){if(settings.autoOrigin){try{set('transport.allowed_origins',[new URL(get('endpoint')).origin]);}catch{}}send('set-draft',{value:structuredClone(draft)});}
function renderFields(){
 $('fields').replaceChildren();controls.clear();
 for(const field of settings.fields){const label=document.createElement('label'),input=document.createElement(field.type==='list'?'textarea':'input');label.textContent=field.label;
 if(field.type==='boolean'){input.type='checkbox';input.checked=get(field.path);label.className='check';}else if(field.type==='number'){input.type='number';input.value=get(field.path);input.min=field.min;input.max=field.max;}else{if(field.type!=='list')input.type='text';const value=get(field.path);input.value=field.type==='list'?value.join('\n'):value??'';}
 input.oninput=()=>{let value=field.type==='boolean'?input.checked:field.type==='number'?Number(input.value):field.type==='list'?list(input.value):input.value;if(field.nullable&&value==='')value=null;set(field.path,value);changed();};controls.set(field.path,input);label.append(input);if(field.help){const help=document.createElement('small');help.textContent=field.help;label.append(help);}$('fields').append(label);}
 if(settings.tools){$('tool-section').hidden=false;$('tools').replaceChildren();for(const tool of settings.tools){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=draft.enabled_tools.includes(tool);input.onchange=()=>{const selected=new Set(draft.enabled_tools);if(input.checked)selected.add(tool);else selected.delete(tool);draft.enabled_tools=[...selected];changed();};label.append(input,document.createTextNode(tool));$('tools').append(label);}}
 if(settings.permissions){$('permission-section').hidden=false;$('permissions').replaceChildren();for(const tool of settings.permissions){const row=document.createElement('div'),title=document.createElement('small');title.textContent=tool;row.append(title);for(const role of ['owner','admin']){const label=document.createElement('label'),input=document.createElement('input');label.className='check';input.type='checkbox';input.checked=draft.management_permissions[tool].includes(role);input.onchange=()=>{const selected=new Set(draft.management_permissions[tool]);if(input.checked)selected.add(role);else selected.delete(role);draft.management_permissions[tool]=[...selected];changed();};label.append(input,document.createTextNode(role==='owner'?'群主':'管理员'));row.append(label);}$('permissions').append(row);}}
 resize();
}
function selection(){const selected=new Set(draft.allowed_group_ids);$('selected-count').textContent=`已选 ${selected.size} 个群`;$('selected').replaceChildren();for(const id of selected){const button=document.createElement('button');button.textContent=id+' ×';button.onclick=()=>{draft.allowed_group_ids=draft.allowed_group_ids.filter(v=>v!==id);changed();selection();for(const input of $('groups').querySelectorAll('input'))input.checked=draft.allowed_group_ids.includes(input.value);};$('selected').append(button);}resize();}
async function groups({metadata=false,next=false}={}){const run=++load;$('error').textContent='';$('next').hidden=true;try{
 if(metadata){const page=await query({binding_ref:null,query:'',after_group_id:null});if(run!==load)return;$('account').replaceChildren();for(const row of page.accounts){const option=document.createElement('option');option.value=row.binding_ref;option.textContent=row.self_id+' · '+row.binding_ref;$('account').append(option);}if(page.accounts.some(a=>a.binding_ref===draft.binding_ref))$('account').value=draft.binding_ref;else if(draft.binding_ref){const option=document.createElement('option');option.value=draft.binding_ref;option.textContent=draft.binding_ref+' (not enabled)';$('account').append(option);$('account').value=draft.binding_ref;}else if(page.accounts.length){draft.binding_ref=page.accounts[0].binding_ref;changed();}}
 if(!$('account').value){$('error').textContent='没有可查询的在线账号，已有选择仍保留。';return;}if(!next)cursor=null;
 const page=await query({binding_ref:$('account').value,query:$('search').value.trim(),after_group_id:cursor});if(run!==load)return;cursor=page.next_after_group_id;$('groups').replaceChildren();
 for(const row of page.items){const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');input.type='checkbox';input.value=row.group_id;input.checked=draft.allowed_group_ids.includes(row.group_id);input.onchange=()=>{const selected=new Set(draft.allowed_group_ids);if(input.checked)selected.add(row.group_id);else selected.delete(row.group_id);draft.allowed_group_ids=[...selected];changed();selection();};text.textContent=row.group_name+' · '+row.group_id;label.append(input,text);$('groups').append(label);}$('page-info').textContent=`匹配 ${page.total} 个群，本页 ${page.items.length} 个`;$('next').hidden=cursor===null;selection();
 }catch(error){if(run===load)$('error').textContent='群列表读取失败：'+error.message+'。已有选择保留。';}finally{if(run===load)resize();}}
function initialize(value){draft=structuredClone(value);renderFields();if(settings.groups){$('group-section').hidden=false;selection();groups({metadata:true});}}
addEventListener('message',event=>{const m=event.data||{};if(event.source!==parent||!event.ports[0]||m.protocol!=='forest.management-ui-connect/1'||m.type!=='connect'||typeof m.nonce!=='string')return;port=event.ports[0];nonce=m.nonce;port.onmessage=event=>{const v=event.data||{};if(v.protocol!=='forest.management-ui-channel/1'||v.nonce!==nonce)return;if(v.type==='initialize'){$('title').textContent=settings.title;$('help').textContent=settings.help;$('revision').textContent=`期望 r${v.configuration.desired.revision} · 生效 r${v.configuration.effective.revision}`;initialize(v.configuration.desired.value);$('plan').disabled=false;return;}if(v.type==='reset'){initialize(v.value);status('草稿已恢复');return;}if(v.type==='plan-ready'){status('计划已生成，请检查并点击外层“应用计划”。');return;}if(v.type==='desired-committed'){status(`配置 r${v.revision} 已提交，等待生效。`);return;}if(v.type==='error'){status(v.message||'配置失败');return;}const entry=pending.get(v.request_id);if(!entry)return;pending.delete(v.request_id);if(v.type==='operation-error')entry.reject(Error(v.message));else entry.resolve(v.value);};port.start();send('ready');},{once:true});
$('plan').onclick=()=>{changed();send('request-plan');};$('refresh').onclick=()=>groups({metadata:true});$('find').onclick=()=>groups();$('next').onclick=()=>groups({next:true});$('account').onchange=()=>{draft.binding_ref=$('account').value;changed();groups();};$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();groups();}};
})();</script></body></html>
