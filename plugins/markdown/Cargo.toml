[package]
name = "forest-markdown"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-markdown"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
forest-onebot = { path = "../onebot/protocol", features = ["forest"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
mitex = "0.2.4"
serde_json.workspace = true

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
tokio.workspace = true
tempfile = "3.23.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../crates/forest-package" }
