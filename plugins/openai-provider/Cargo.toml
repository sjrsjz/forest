[package]
name = "forest-openai-provider"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-openai-provider"
path = "src/bin/package.rs"

[[example]]
name = "verify-openai-provider"
path = "examples/verify.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
forest-runtime = { path = "../../crates/forest-runtime" }
forest-config = { path = "../../crates/forest-config" }
tokio.workspace = true
tempfile = "3.23.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
