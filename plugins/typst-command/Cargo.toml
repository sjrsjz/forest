[package]
name = "forest-typst-command"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "package-typst-command"
path = "src/bin/package.rs"

[dependencies]
forest-sdk = { path = "../../crates/forest-sdk" }
forest-protocol = { path = "../../crates/forest-protocol" }
forest-serde = { path = "../../crates/forest-serde" }
forest-onebot = { path = "../../crates/forest-onebot", features = ["forest"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
forest-markdown = { path = "../markdown" }
forest-runtime = { path = "../../crates/forest-runtime" }
forest-typst = { path = "../typst" }
forest-media = { path = "../media" }
forest-message-output = { path = "../message-output" }
tempfile = "3.23.0"
tokio.workspace = true
base64 = "0.22.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
forest-package = { path = "../../crates/forest-package" }
